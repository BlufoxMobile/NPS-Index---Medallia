<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blufox NPS Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* ===== DESIGN TOKENS ===== */
  :root{
    --navy:#1e3a8a; --navy-deep:#0f172a; --orange:#f97316; --orange-deep:#ea580c;
    --good:#047857; --good-light:#10b981; --good-bg:#ecfdf5; --good-border:#a7f3d0;
    --neutral:#b45309; --neutral-light:#f59e0b; --neutral-bg:#fffbeb; --neutral-border:#fde68a;
    --bad:#b91c1c; --bad-light:#ef4444; --bad-bg:#fef2f2; --bad-border:#fecaca;
    --app-bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink-soft:#475569; --ink-faint:#94a3b8;
    --line:#e2e8f0; --line-soft:#eef2f6;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --shadow-md:0 4px 12px rgba(15,23,42,.07), 0 2px 4px rgba(15,23,42,.04);
    --shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --ease:cubic-bezier(.4,0,.2,1);
    --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:var(--font); background:var(--app-bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.45; }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:3px solid rgba(30,58,138,.45); outline-offset:2px; border-radius:6px; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 16px 64px; }

  /* ===== HEADER BAR ===== */
  .appbar{ background:linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 70%); color:#fff; padding:18px 0 22px; box-shadow:var(--shadow-md); position:sticky; top:0; z-index:20; }
  .appbar .wrap{ padding-bottom:0; }
  .appbar-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo{ width:38px;height:38px;border-radius:10px;flex:none; background:linear-gradient(135deg,var(--orange),var(--orange-deep)); display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px; box-shadow:0 2px 8px rgba(234,88,12,.45); }
  .titles h1{ font-size:19px; margin:0; letter-spacing:-.2px; font-weight:700; }
  .titles p{ margin:2px 0 0; font-size:12.5px; color:#c7d2fe; }
  .appbar-spacer{ flex:1 1 auto; }
  .updated{ font-size:12px; color:#c7d2fe; text-align:right; }
  .updated strong{ color:#fff; font-weight:600; }

  /* ===== CONTROLS BAR ===== */
  .controls{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); padding:14px; margin-top:18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .seg{ display:inline-flex; background:var(--app-bg); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .seg button{ border:0; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; padding:8px 16px; border-radius:999px; transition:all .18s var(--ease); min-height:36px; }
  .seg button[aria-pressed="true"]{ background:var(--navy); color:#fff; box-shadow:var(--shadow-sm); }
  .field{ position:relative; }
  .field select{ appearance:none; -webkit-appearance:none; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 34px 9px 13px; min-height:40px; cursor:pointer; transition:border-color .15s var(--ease), box-shadow .15s var(--ease); }
  .field select:hover{ border-color:#cbd5e1; }
  .field::after{ content:""; position:absolute; right:13px; top:50%; width:8px;height:8px;border-right:2px solid var(--ink-faint); border-bottom:2px solid var(--ink-faint); transform:translateY(-65%) rotate(45deg); pointer-events:none; }
  .controls-spacer{ flex:1 1 auto; }
  .chips{ display:inline-flex; gap:8px; flex-wrap:wrap; }
  .chip{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--ink-soft); display:inline-flex; align-items:center; gap:7px; min-height:38px; transition:all .16s var(--ease); }
  .chip .dot{ width:9px;height:9px;border-radius:50%; }
  .chip.good .dot{ background:var(--good-light); }
  .chip.neutral .dot{ background:var(--neutral-light); }
  .chip.bad .dot{ background:var(--bad-light); }
  .chip[aria-pressed="true"].good{ background:var(--good-bg); border-color:var(--good-border); color:var(--good); }
  .chip[aria-pressed="true"].neutral{ background:var(--neutral-bg); border-color:var(--neutral-border); color:var(--neutral); }
  .chip[aria-pressed="true"].bad{ background:var(--bad-bg); border-color:var(--bad-border); color:var(--bad); }
  .chip[aria-pressed="false"]{ opacity:.55; }

  /* ===== KPI CARDS ===== */
  .kpis{ display:grid; gap:12px; margin-top:16px; grid-template-columns:repeat(6, 1fr); }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-sm); padding:14px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--navy); }
  .kpi.k-good::before{ background:var(--good-light); }
  .kpi.k-neutral::before{ background:var(--neutral-light); }
  .kpi.k-bad::before{ background:var(--bad-light); }
  .kpi.k-nps::before{ background:linear-gradient(var(--orange),var(--orange-deep)); }
  .kpi .lbl{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); }
  .kpi .val{ font-size:28px; font-weight:800; letter-spacing:-1px; margin-top:4px; line-height:1; }
  .kpi .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .kpi.k-good .val{ color:var(--good); }
  .kpi.k-neutral .val{ color:var(--neutral); }
  .kpi.k-bad .val{ color:var(--bad); }
  .kpi.k-nps .val{ color:var(--orange-deep); }

  /* ===== SECTION HEADER + BULK ===== */
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:26px 4px 12px; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:15px; margin:0; font-weight:800; letter-spacing:-.2px; }
  .bulk{ display:inline-flex; gap:8px; }
  .bulk button{ border:1px solid var(--line); background:var(--card); color:var(--navy); font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:9px; min-height:38px; transition:all .15s var(--ease); }
  .bulk button:hover{ background:#f8fafc; border-color:#cbd5e1; }

  /* ===== LEVEL 1 — STORE ===== */
  .store{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); margin-bottom:14px; overflow:hidden; transition:box-shadow .2s var(--ease); }
  .store.open{ box-shadow:var(--shadow-md); }
  .store-head{ width:100%; border:0; background:transparent; text-align:left; display:flex; align-items:center; gap:14px; padding:16px 18px; transition:background .15s var(--ease); }
  .store-head:hover{ background:#f8fafc; }
  .caret{ flex:none; width:24px;height:24px;border-radius:7px; display:grid;place-items:center; color:var(--ink-faint); background:var(--app-bg); transition:transform .25s var(--ease), color .15s; }
  .caret svg{ width:13px;height:13px; }
  [aria-expanded="true"] > .caret{ transform:rotate(90deg); color:var(--navy); }
  .store-id{ flex:1 1 auto; min-width:0; }
  .store-id .name{ font-size:16px; font-weight:800; letter-spacing:-.2px; }
  .store-id .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .minis{ display:inline-flex; gap:6px; flex:none; }
  .mini{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:7px; display:inline-flex; align-items:center; gap:4px; line-height:1.6; }
  .mini.g{ background:var(--good-bg); color:var(--good); }
  .mini.n{ background:var(--neutral-bg); color:var(--neutral); }
  .mini.b{ background:var(--bad-bg); color:var(--bad); }
  .nps-badge{ flex:none; text-align:center; min-width:64px; padding:6px 12px; border-radius:var(--r-md); border:1.5px solid; }
  .nps-badge .num{ font-size:22px; font-weight:800; letter-spacing:-1px; line-height:1; }
  .nps-badge .cap{ font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.8; }
  .nps-pos{ background:var(--good-bg); border-color:var(--good-border); color:var(--good); }
  .nps-mid{ background:var(--neutral-bg); border-color:var(--neutral-border); color:var(--neutral); }
  .nps-neg{ background:var(--bad-bg); border-color:var(--bad-border); color:var(--bad); }

  /* collapsible body */
  .collapse{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s var(--ease); }
  .collapse > .collapse-inner{ overflow:hidden; }
  [aria-expanded="true"] + .collapse, .collapse.open{ grid-template-rows:1fr; }
  .reps{ padding:4px 14px 14px; background:#fbfcfe; border-top:1px solid var(--line-soft); }

  /* ===== LEVEL 2 — REP (hero score) ===== */
  .rep{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); margin-top:10px; overflow:hidden; transition:box-shadow .18s var(--ease); }
  .rep.open{ box-shadow:var(--shadow-sm); }
  .rep-head{ width:100%; border:0; background:transparent; text-align:left; display:flex; align-items:center; gap:14px; padding:14px 16px; transition:background .15s var(--ease); }
  .rep-head:hover{ background:#f8fafc; }
  .rep-id{ flex:1 1 auto; min-width:0; }
  .rep-id .name{ font-size:15px; font-weight:700; }
  .rep-id .ntid{ font-size:11px; color:var(--ink-faint); font-weight:600; background:var(--app-bg); padding:1px 7px; border-radius:5px; margin-left:6px; }
  .rep-id .meta{ font-size:12px; color:var(--ink-soft); margin-top:5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rep-id .tot{ font-weight:700; color:var(--ink); }
  .rep-hero{ flex:none; text-align:center; min-width:92px; padding:6px 8px; border-radius:var(--r-md); border:2px solid; }
  .rep-hero .num{ font-size:42px; font-weight:800; letter-spacing:-2px; line-height:.92; font-variant-numeric:tabular-nums; }
  .rep-hero .cap{ font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .hero-pos{ background:var(--good-bg); border-color:var(--good-light); color:var(--good); }
  .hero-mid{ background:var(--neutral-bg); border-color:var(--neutral-light); color:var(--neutral); }
  .hero-neg{ background:var(--bad-bg); border-color:var(--bad-light); color:var(--bad); }
  .buckets{ padding:2px 12px 12px; background:#fbfcfe; border-top:1px solid var(--line-soft); }

  /* ===== LEVEL 3 — BUCKET ===== */
  .bucket{ margin-top:9px; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--card); }
  .bucket-head{ width:100%; border:0; background:transparent; text-align:left; display:flex; align-items:center; gap:11px; padding:11px 13px; font-weight:700; font-size:13.5px; transition:background .15s var(--ease); }
  .bucket-head:hover{ background:#f8fafc; }
  .bucket-head .swatch{ width:10px;height:10px;border-radius:3px; flex:none; }
  .bucket.good .swatch{ background:var(--good-light); }
  .bucket.neutral .swatch{ background:var(--neutral-light); }
  .bucket.bad .swatch{ background:var(--bad-light); }
  .bucket.good .bucket-head{ color:var(--good); }
  .bucket.neutral .bucket-head{ color:var(--neutral); }
  .bucket.bad .bucket-head{ color:var(--bad); }
  .bucket-head .label{ flex:1 1 auto; }
  .count-pill{ font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px; background:var(--app-bg); color:var(--ink-soft); min-width:24px; text-align:center; }
  .bucket-head .caret{ background:transparent; }
  .surveys{ padding:4px 12px 12px; }
  .survey{ display:flex; gap:12px; align-items:flex-start; padding:11px 4px; border-top:1px solid var(--line-soft); }
  .surveys .survey:first-child{ border-top:0; }
  .score-chip{ flex:none; width:34px;height:34px;border-radius:9px; display:grid;place-items:center; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .score-chip.g{ background:var(--good-bg); color:var(--good); border:1px solid var(--good-border); }
  .score-chip.n{ background:var(--neutral-bg); color:var(--neutral); border:1px solid var(--neutral-border); }
  .score-chip.b{ background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-border); }
  .survey-body{ flex:1 1 auto; min-width:0; }
  .survey-top{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .txn{ font-size:11.5px; font-weight:700; color:var(--navy); background:#eef2ff; padding:2px 8px; border-radius:6px; }
  .date{ font-size:11.5px; color:var(--ink-faint); font-weight:600; }
  .comment{ font-size:13px; color:var(--ink-soft); margin-top:5px; }
  .comment.empty{ color:var(--ink-faint); font-style:italic; }
  .empty-bucket{ font-size:12.5px; color:var(--ink-faint); padding:12px 4px; font-style:italic; }

  /* ===== TOOLBAR / BANNER / MISC ===== */
  .toolbar{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .btn{ background:var(--navy-deep); color:#fff; border:none; border-radius:9px; padding:10px 18px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .btn:hover:not(:disabled){ background:var(--navy); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .note{ font-size:12px; color:var(--ink-soft); }
  .banner{ padding:12px 16px; border-radius:var(--r-md); font-size:13px; margin-top:16px; display:none; line-height:1.5; }
  .banner.info{ display:block; background:var(--neutral-bg); border:1px solid var(--neutral-border); color:#713f12; }
  .banner.success{ display:block; background:var(--good-bg); border:1px solid var(--good-border); color:var(--good); }
  .banner.error{ display:block; background:var(--bad-bg); border:1px solid var(--bad-border); color:var(--bad); }
  .empty{ text-align:center; color:var(--ink-faint); padding:50px 0; font-size:14px; }
  .src{ text-align:center; color:#bbc3ce; font-size:11px; margin-top:26px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width:880px){ .kpis{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:560px){
    .wrap{ padding:0 12px 48px; }
    .kpis{ grid-template-columns:repeat(2,1fr); }
    .kpi .val{ font-size:24px; }
    .controls{ padding:12px; }
    .controls-spacer{ display:none; }
    .seg, .field, .chips{ width:100%; }
    .field select{ width:100%; }
    .seg{ justify-content:center; }
    .updated{ text-align:left; width:100%; }
    .appbar-spacer{ display:none; }
    .store-head, .rep-head{ flex-wrap:wrap; }
    .minis{ order:3; width:100%; margin-top:8px; }
    .rep-id{ flex:1 1 60%; }
    .rep-hero{ min-width:78px; }
    .rep-hero .num{ font-size:36px; }
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <div class="appbar-row">
      <div class="logo">B</div>
      <div class="titles">
        <h1>NPS Report</h1>
        <p>Blufox Mobile &middot; Xfinity Retail</p>
      </div>
      <div class="appbar-spacer"></div>
      <div class="updated" id="updatedAt">Loading survey data&hellip;</div>
    </div>
  </div>
</header>

<main class="wrap">

  <div class="banner" id="banner"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Reporting period">
      <button id="tabYesterday" aria-pressed="true" onclick="setTab('yesterday')">Yesterday</button>
      <button id="tabMtd" aria-pressed="false" onclick="setTab('mtd')">Month-to-Date</button>
    </div>
    <div class="field">
      <select id="storeFilter" aria-label="Filter by store" onchange="render()"><option value="">All Stores</option></select>
    </div>
    <div class="field">
      <select id="dmFilter" aria-label="Filter by district manager" onchange="render()"><option value="">All DMs</option></select>
    </div>
    <div class="controls-spacer"></div>
    <div class="chips" role="group" aria-label="Toggle score bands">
      <button class="chip good" id="chipGood" aria-pressed="true" onclick="toggleBand('good')"><span class="dot"></span>Good</button>
      <button class="chip neutral" id="chipOk" aria-pressed="true" onclick="toggleBand('ok')"><span class="dot"></span>Neutral</button>
      <button class="chip bad" id="chipBad" aria-pressed="true" onclick="toggleBand('bad')"><span class="dot"></span>Bad</button>
    </div>
  </div>

  <section class="kpis" id="summary" aria-label="Summary metrics"></section>

  <div class="section-head">
    <h2>Stores &middot; Reps</h2>
    <div class="bulk">
      <button onclick="expandAll()">Expand all</button>
      <button onclick="collapseAll()">Collapse all</button>
    </div>
  </div>

  <div id="results"><div class="empty">Loading&hellip;</div></div>
  <div class="src" id="src"></div>
</main>

<script>
// === NPS SHARED MODULE (identical copy lives in upload.html + NPS-Index---Medallia/index.html) ===
const NPS_CONFIG = {
  WEBHOOK_URL: "",  // intentionally blank on the public dashboard — email sending is automated server-side, not from this file
  RESPONSES_PATH: "data/nps-responses.json",
  SENT_LOG_PATH:  "data/nps-sent-log.json",
  RESPONSES_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-responses.json",
  MTD_PATH:      "data/nps-mtd.json",
  MTD_URL:       "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-mtd.json",
  SENT_LOG_URL:  "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-sent-log.json",
  DIRECTORY_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/store-directory.json",
  NPS_SALES_REPORT_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/Sales%20Report.xlsx",
  TSHEET_URL: "https://script.google.com/macros/s/AKfycbyQaa1yvggLJuw5dcme74vwAW3hSB3BvzCK40IhLThy-F8KZDFOF6gcyl8psNMd3yD-Cg/exec",
  OPEN_ORDERS_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/open-orders.json",
  CLOSURES_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/closures.json",
  FU_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTG0Gp38ba_zBP7jNlGg9GWGgzFsh6946OUVOl9RQp0kL9Amc0qQZg0hMbdw7veg7Y56qKv6tUSFjI7/pub?output=csv",
  CRM_URL: "https://blufoxmobile.github.io/Daily-Sales-Report/crm.html",
  DASHBOARD_URL: "https://blufoxmobile.github.io/NPS-Index---Medallia/",
  SUMMARY_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/target-summary.json",
  RSD_FILTER: "Bilbrey",
  MY_EMAIL: "jbilbrey@blufoxmobile.com",
  HISTORY_DAYS: 95
};

// --- Freshness helpers: read each GitHub file at its NEWEST commit so we bypass
// the raw.githubusercontent CDN lag that otherwise serves yesterday's copy for
// minutes after an upload. NPS_FRESH records the commit date for the readiness gate.
const NPS_FRESH = {};
function npsLocalYMD(d){ d = d || new Date(); const z = n => String(n).padStart(2,"0"); return d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()); }
async function npsPinnedUrl(repo, path){
  try {
    const api = "https://api.github.com/repos/BlufoxMobile/" + repo + "/commits?path=" + encodeURIComponent(path) + "&per_page=1&_=" + Date.now();
    const r = await fetch(api, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } });
    if(r.ok){
      const j = await r.json();
      if(j && j[0] && j[0].sha){
        const iso = j[0].commit && j[0].commit.committer && j[0].commit.committer.date;
        NPS_FRESH[path] = { sha: j[0].sha, date: iso ? npsLocalYMD(new Date(iso)) : null };
        return "https://raw.githubusercontent.com/BlufoxMobile/" + repo + "/" + j[0].sha + "/" + path.split("/").map(encodeURIComponent).join("/");
      }
    }
  } catch(e){ console.warn("pin lookup failed:", repo, path, e); }
  return null;
}

// Store-number → short store name (numbers observed in the tNPS "Store ID" column BE).
const NPS_STORE_NUM = {
  "55027": "Bourbonnais",   "55009": "Uptown",          "55005": "Frankfort",
  "51026": "Schererville",  "55004": "Glenview",        "51011": "Greeneville",
  "51025": "South Skokie",  "55006": "Elkhart",         "55010": "Evergreen Park",
  "55000": "Valparaiso",    "51022": "South Knoxville", "51023": "Round Lake Beach",
  "51031": "Johnson City",  "55002": "Tinley Park",     "55011": "Cicero",
  "55001": "Kildeer",       "55003": "Dekalb",          "55008": "Evanston",
  "51009": "Oak Ridge",     "51038": "Machesney Park"
  // Oak Lawn Xfinity Store — store number TBD (store opens Aug 5, 2026).
  // Add  "<storeNumber>": "Oak Lawn"  here once the number is assigned.
};

// Keyword fallbacks for store numbers we haven't seen yet. Checked in order.

function npsMapStore(raw){
  if(!raw) return null;
  const m = String(raw).match(/^\s*(\d{4,6})/);
  if(m && NPS_STORE_NUM[m[1]]) return NPS_STORE_NUM[m[1]];
  const s = String(raw).toLowerCase();
  for(const [name, keys] of NPS_STORE_ALIASES){
    if(keys.some(k => s.includes(k))) return name;
  }
  return null;
}

function npsDateStr(v){
  let d = null;
  if(v instanceof Date){ d = v; }
  else if(typeof v === "number"){
    d = new Date(Math.round((v - 25569) * 86400000));
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
  }
  else if(v){ const t = new Date(v); if(!isNaN(t.getTime())) d = t; }
  if(!d || isNaN(d.getTime())) return null;
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function npsPrettyDate(iso){
  if(!iso) return "";
  const [y,mo,da] = iso.split("-").map(Number);
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[mo-1] + " " + da + ", " + y;
}

function npsCleanText(v){
  if(v == null) return "";
  let s = String(v);
  // The export writes some unicode as literal "\uXXXX" sequences — decode them.
  s = s.replace(/\\u([0-9a-fA-F]{4})/g, (m,h) => String.fromCharCode(parseInt(h,16)));
  return s.trim();
}

function npsEsc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Bucket per Jeff's spec: 9-10 good (green), 8 ok (yellow), 0-7 bad (red).
function npsBucket(score){ return score >= 9 ? "good" : score === 8 ? "ok" : "bad"; }

// Parse the tNPS Responses export workbook into survey objects.
function parseNpsWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws) throw new Error("Workbook has no sheets");
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(15, rows.length); i++){
    const r = rows[i];
    if(r && r.some(c => c != null && String(c).trim() === "Employee NTID")){ hr = i; break; }
  }
  if(hr < 0) throw new Error('Header row not found (no "Employee NTID" column). Is this the tNPS Responses export?');
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const iId       = h.findIndex(c => /^surveyid/i.test(c));
  const iTxn      = h.findIndex(c => c.toLowerCase() === "transaction date");
  const iResp     = h.findIndex(c => c.toLowerCase() === "response date");
  const iNtid     = h.indexOf("Employee NTID");
  const iScore    = h.findIndex(c => c.toLowerCase() === "sms tnps");       // col J
  const iScoreAlt = h.findIndex(c => c.toLowerCase() === "tnps");           // col K fallback
  const iReason   = h.findIndex(c => c.toLowerCase() === "reason for score"); // col L
  let iType  = h.findIndex(c => /retail interaction/i.test(c));             // col AY
  if(iType  < 0) iType  = 50;
  let iStore = h.findIndex(c => c.toLowerCase() === "store id");            // col BE
  if(iStore < 0) iStore = 56;

  const surveys = [];
  const unmatched = new Set();
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r) continue;
    const id = r[iId] != null ? String(r[iId]).trim() : "";
    let score = r[iScore];
    if((score == null || score === "") && iScoreAlt >= 0) score = r[iScoreAlt];
    if(!id || score == null || score === "") continue;
    score = Number(score);
    if(isNaN(score)) continue;
    const rawStore = r[iStore] != null ? String(r[iStore]).trim() : "";
    const storeKey = npsMapStore(rawStore);
    if(!storeKey && rawStore) unmatched.add(rawStore);
    surveys.push({
      id: id,
      score: score,
      txnDate:  npsDateStr(r[iTxn]),
      respDate: npsDateStr(r[iResp]),
      ntid:     r[iNtid] != null ? String(r[iNtid]).trim() : "",
      comment:  npsCleanText(r[iReason]),
      txnType:  r[iType] != null ? String(r[iType]).trim() : "",
      storeKey: storeKey,
      storeRaw: rawStore
    });
  }
  return { surveys: surveys, unmatched: Array.from(unmatched) };
}

// Compact version of the DM-Visit-Guide "Store Rank" parser (same header regexes).
// Also parses "Rep Rank" into NPS_REPS as a side effect (same workbook fetch).
async function npsFetchSalesStores(){
  const salesUrl = (await npsPinnedUrl("Daily-Sales-Report","data/Sales Report.xlsx")) || NPS_CONFIG.NPS_SALES_REPORT_URL;
  const resp = await fetch(salesUrl + "?t=" + Date.now(), {cache:"no-store"});
  if(!resp.ok) throw new Error("Sales report HTTP " + resp.status);
  const wb = XLSX.read(await resp.arrayBuffer(), { type: "array" });
  try { NPS_REPS = npsParseReps(wb); } catch(e){ console.warn("Rep Rank parse failed:", e); }
  const ws = wb.Sheets["Store Rank"];
  if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(20, rows.length); i++){
    if(rows[i] && rows[i].some(c => c && String(c).trim() === "Rank")){ hr = i; break; }
  }
  if(hr < 0) return [];
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const idx = {
    rank:      h.findIndex(c => c.trim() === "Rank"),
    region:    h.findIndex(c => c.toLowerCase().includes("region")),
    store:     h.findIndex(c => c.toLowerCase().includes("store")),
    rsd:       h.findIndex(c => c.toLowerCase().includes("rsd")),
    dm:        h.findIndex(c => c.trim().toLowerCase() === "dm"),
    sm:        h.findIndex(c => c.trim().toLowerCase() === "sm"),
    gpTrend:   h.findIndex(c => /^GP\s*\$\s*Trend$/i.test(c)),
    mobileCR:  h.findIndex(c => c.toLowerCase().includes("mobile close rate")),
    fiscalCR:  h.findIndex(c => c.toLowerCase().includes("fiscal close rate")),
    nonTrad:   h.findIndex(c => c.toLowerCase().includes("non traditional")),
    gigPct:    h.findIndex(c => /^GIG\s*Plans[\s\S]*%[\s\S]*10\s*Pts/i.test(c)),
    plusMix:   h.findIndex(c => /Mobile\s*Plus\s*Mix[\s\S]*5\s*Pts/i.test(c)),
    newToUpg:  h.findIndex(c => /NEW\s*TO\s*UPGR\s*%/i.test(c)),
    accPerDev: h.findIndex(c => /Accessory.*per\s*Device.*Net/i.test(c)),
    nps:       h.findIndex(c => c.toLowerCase().includes("fiscal nps") && !c.toLowerCase().includes("last")),
    newRGU:    h.findIndex(c => /^NEW\s*RGU$/i.test(c)),
    mobileMTD: h.findIndex(c => /^Mobile\s*MTD$/i.test(c)),
    tabletMTD: h.findIndex(c => /^Tablet\s*MTD$/i.test(c)),
    watchMTD:  h.findIndex(c => /^Watches\s*MTD$/i.test(c))
  };
  /* BFX SMART TARGETS: extra Store Rank columns for the daily-target engine.
     Header regex first; fixed-index fallback (fiscal installs AM/38, fiscal
     mobile AN/39, accessory net $ CD/81) only when the header text there
     passes a sanity check — otherwise -1 and the engine estimates instead. */
  const bfxCol = (pred, fixedIdx, sanityRe) => {
    const byName = h.findIndex(c => c && pred(String(c)));
    if(byName >= 0) return byName;
    const at = (h[fixedIdx] != null) ? String(h[fixedIdx]) : "";
    return sanityRe.test(at) ? fixedIdx : -1;
  };
  idx.fMob   = bfxCol(c => /mobile/i.test(c) && /install/i.test(c), 39, /mobile/i);
  idx.fInst  = bfxCol(c => /install/i.test(c) && !/mobile/i.test(c), 38, /install|rgu/i);
  idx.accNet = bfxCol(c => /access/i.test(c) && /net/i.test(c) && !/device/i.test(c), 81, /access/i);
  idx.trafBfx = h.findIndex(c => c && /shopper\s*trak\s*daily\s*avg/i.test(String(c)));
  const out = [];
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || r[idx.rank] == null) break;
    const rsd = r[idx.rsd];
    if(!rsd || !String(rsd).includes(NPS_CONFIG.RSD_FILTER)) continue;
    const g = k => idx[k] >= 0 ? num(r[idx[k]]) : 0;
    out.push({
      rank: num(r[idx.rank]),
      region: r[idx.region] || "", name: r[idx.store] || "",
      dm: r[idx.dm] || "", sm: r[idx.sm] || "",
      gpTrend: g("gpTrend"), mobileCR: g("mobileCR"), fiscalCR: g("fiscalCR"),
      nonTrad: g("nonTrad"), gigPct: g("gigPct"), plusMix: g("plusMix"),
      newToUpg: g("newToUpg"), accPerDev: g("accPerDev"), nps: g("nps"),
      newRGU: g("newRGU"), mobileMTD: g("mobileMTD"), tabletMTD: g("tabletMTD"), watchMTD: g("watchMTD"),
      /* BFX SMART TARGETS: engine inputs (null when the column wasn't found) */
      fMob: idx.fMob >= 0 ? num(r[idx.fMob]) : null,
      fInst: idx.fInst >= 0 ? num(r[idx.fInst]) : null,
      accTotal: idx.accNet >= 0 ? num(r[idx.accNet]) : null
    });
    /* BFX SMART TARGETS: capture shopper-trak daily avg here too, so the
       dashboard gets traffic pacing without a second workbook fetch. */
    if(idx.trafBfx >= 0){
      const tv = num(r[idx.trafBfx]);
      const snB = npsShortFromRaw(r[idx.store]);
      if(snB && tv > 0) NPS_DAILY[snB.toLowerCase()] = Math.round(tv);
    }
  }
  BFX_SALES_ROWS = out; /* BFX SMART TARGETS: cache for goal helpers */
  return out;
}

// Parse "Rep Rank" sheet → ALL reps with their MTD stats (no RSD filter, so any
// rep who shows up on a survey can be matched). Header regexes mirror the
// DM-Visit-Guide parser.
function npsParseReps(wb){
  const ws = wb.Sheets["Rep Rank"];
  if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(20, rows.length); i++){
    if(rows[i] && rows[i].some(c => c && String(c).trim() === "Rank")){ hr = i; break; }
  }
  if(hr < 0) return [];
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const iRank   = h.findIndex(c => c.trim() === "Rank");
  const iName   = h.findIndex(c => c.toLowerCase().includes("employee"));
  const iLoc    = h.findIndex(c => c.toLowerCase().includes("location"));
  const iGP     = h.findIndex(c => /^GP\s*\$/i.test(c));
  const iPlus   = h.findIndex(c => /Mobile\s*Plus\s*Mix[\s\S]*5\s*Pts/i.test(c));
  const iGig    = h.findIndex(c => /^GIG\s*Plans[\s\S]*commissions\s*plan\)\s*%$/i.test(c));
  const iMobile = h.findIndex(c => /^Mobile\s*MTD$/i.test(c));
  const iTablet = h.findIndex(c => /^Tablet\s*MTD$/i.test(c));
  const iWatch  = h.findIndex(c => /^Watches\s*MTD$/i.test(c));
  if(iName < 0) return [];
  const out = [];
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || r[iName] == null) continue;
    const name = String(r[iName]).trim();
    if(!name) continue;
    out.push({
      name: name,
      store: iLoc >= 0 ? String(r[iLoc] || "").trim() : "",
      rank: iRank >= 0 ? num(r[iRank]) : 0,
      gp: iGP >= 0 ? num(r[iGP]) : 0,
      plusMix: iPlus >= 0 ? num(r[iPlus]) : 0,
      gigPct: iGig >= 0 ? num(r[iGig]) : 0,
      mobile: iMobile >= 0 ? num(r[iMobile]) : 0,
      tablet: iTablet >= 0 ? num(r[iTablet]) : 0,
      watch: iWatch >= 0 ? num(r[iWatch]) : 0
    });
  }
  return out;
}

// Map any raw store string (full name, lead string, order string) → short name.
function npsShortFromRaw(raw){
  if(!raw) return null;
  const stripped = String(raw).replace(/\s+Test\s+Xfinity\s+Store\b/gi, "").replace(/\s+Xfinity\s+Store\b/gi, "").trim();
  return npsMapStore(raw) || npsMapStore(stripped) || (stripped || null);
}

// T-Sheet Submissions feed → MTD t-chart counts by store + by rep.
async function npsFetchTSheets(){
  const resp = await fetch(NPS_CONFIG.TSHEET_URL + "?_=" + Date.now(), { cache: "no-store" });
  if(!resp.ok) throw new Error("T-Sheet HTTP " + resp.status);
  const data = await resp.json();
  if(!data || !data.success || !Array.isArray(data.submissions)) throw new Error("T-Sheet payload malformed");
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const byStore = {}, byRep = {};
  let total = 0;
  for(const s of data.submissions){
    const ts = Date.parse(s.timestamp);
    if(!isFinite(ts) || ts < startOfMonth) continue;
    total++;
    const shortName = npsShortFromRaw(s.store);
    if(shortName) byStore[shortName] = (byStore[shortName] || 0) + 1;
    const rep = String(s.rep_name || "").trim().toLowerCase();
    if(rep && shortName){
      const key = rep + "||" + shortName.toLowerCase();
      byRep[key] = (byRep[key] || 0) + 1;
    }
  }
  NPS_TCHARTS = { byStore: byStore, byRep: byRep, total: total, loaded: true };
  return NPS_TCHARTS;
}

// ===== Lunch Punch Audit (best-effort) — missed lunch punches per store =====
// Mirrors the Auto-Punch-Report "By Store" tab: an employee-day with 1–3 punches
// (fewer than clock-in / lunch-out / lunch-in / clock-out) is a missed lunch
// punch. Managers are excluded, exactly like the dashboard. Never blocks emails.
let NPS_PUNCH = { byStore: {}, total: 0, detail: {}, loaded: false };
const NPS_PUNCH_URL  = "https://raw.githubusercontent.com/BlufoxMobile/Auto-Punch-Report/main/data/punch-data.xlsx";
const NPS_MGR_TITLES = ["Store Manager", "DM", "Ops Coordinator"];

// Same logic the punch dashboard uses to read a punch time out of a cell.
function npsPunchTime(v){
  if(v == null || v === "") return "";
  if(v instanceof Date){
    return String(v.getHours()).padStart(2,"0") + ":" +
           String(v.getMinutes()).padStart(2,"0") + ":" +
           String(v.getSeconds()).padStart(2,"0");
  }
  const m = String(v).match(/(\d{2}:\d{2}:\d{2})/);
  return m ? m[1] : "00:00:00";
}

async function npsFetchPunches(){
  const purl = (await npsPinnedUrl("Auto-Punch-Report","data/punch-data.xlsx")) || NPS_PUNCH_URL;
  const resp = await fetch(purl + "?t=" + Date.now(), { cache: "no-store" });
  if(!resp.ok) throw new Error("Punch data HTTP " + resp.status);
  const wb = XLSX.read(await resp.arrayBuffer(), { type: "array", cellDates: true });
  const sn = wb.SheetNames.find(s => /punch.?status/i.test(s))
          || wb.SheetNames.find(s => /break.*compliance/i.test(s))
          || wb.SheetNames.find(s => /punch/i.test(s))
          || wb.SheetNames[0];
  const ws = wb.Sheets[sn];
  if(!ws){ NPS_PUNCH = { byStore: {}, total: 0, detail: {}, loaded: true }; return NPS_PUNCH; }
  const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true, cellDates: true });
  if(!rows.length){ NPS_PUNCH = { byStore: {}, total: 0, detail: {}, loaded: true }; return NPS_PUNCH; }

  const H = Object.keys(rows[0]);
  const findH = re => H.find(h => re.test(String(h).trim()));
  const cPunchTime = findH(/^punch\s*time$/i);

  // Collapse rows into per-(store, employee, date) day records → punch count.
  const days = {};
  if(cPunchTime){
    // Long form: one row per punch.
    const cStore = findH(/^store$/i)       || "Store";
    const cName  = findH(/^name$/i)        || findH(/^employee$/i) || findH(/employee.?name/i) || "Name";
    const cTitle = findH(/^job\s*title$/i) || findH(/^title$/i)    || "Title";
    const cDate  = findH(/^date$/i)        || findH(/punch.*in.*date/i) || "Date";
    rows.forEach(r => {
      const t = npsPunchTime(r[cPunchTime]);
      if(!t || t === "00:00:00") return;
      const dstr = npsDateStr(r[cDate]) || String(r[cDate]||"").slice(0,10);
      const k = String(r[cStore]||"") + "||" + String(r[cName]||"") + "||" + dstr;
      if(!days[k]) days[k] = { store: String(r[cStore]||""), title: String(r[cTitle]||""), name: String(r[cName]||""), date: dstr, times: [], cnt: 0 };
      days[k].cnt++;
      days[k].times.push(t);
    });
  } else {
    // Wide form: one row per employee-day with up to 4 punch columns.
    const cStore = findH(/^store$/i)              || "Store";
    const cEmp   = findH(/^employee$/i)           || findH(/employee.?name/i) || "Employee";
    const cTitle = findH(/^job\s*title$/i)        || findH(/^title$/i)        || "Job Title";
    const cDate  = findH(/punch.*in.*date/i)      || findH(/^date$/i)         || "Punch In Date";
    const cols   = [findH(/punch.?1.*time.*in\b/i) || "Punch 1 Time In",
                    findH(/punch.?1.*time.*out/i)  || "Punch 1 Time Out",
                    findH(/punch.?2.*time.*in\b/i) || "Punch 2 Time In",
                    findH(/punch.?2.*time.*out/i)  || "Punch 2 Time Out"];
    rows.forEach(r => {
      let cnt = 0; const tms = [];
      cols.forEach(c => { const t = npsPunchTime(r[c]); if(t && t !== "00:00:00"){ cnt++; tms.push(t); } });
      if(!cnt) return;
      const dstr = npsDateStr(r[cDate]) || String(r[cDate]||"").slice(0,10);
      const k = String(r[cStore]||"") + "||" + String(r[cEmp]||"") + "||" + dstr;
      days[k] = { store: String(r[cStore]||""), title: String(r[cTitle]||""), name: String(r[cEmp]||""), date: dstr, times: tms, cnt: cnt };
    });
  }

  // Per store: count employee-days with 1–3 punches, managers excluded, keyed by
  // the same short store name the email loop uses.
  const byStore = {};
  const detail = {};
  let total = 0;
  Object.keys(days).forEach(k => {
    const d = days[k];
    if(NPS_MGR_TITLES.includes(d.title)) return;
    if(d.cnt >= 1 && d.cnt < 4){
      const short = npsShortFromRaw(d.store);
      if(short){
        byStore[short] = (byStore[short] || 0) + 1; total++;
        (detail[short] = detail[short] || []).push({ rep: d.name, date: d.date, punches: d.cnt, clockOut: (d.times.length ? d.times.slice().sort().pop() : "") });
      }
    }
  });
  NPS_PUNCH = { byStore: byStore, total: total, detail: detail, loaded: true };
  return NPS_PUNCH;
}

// Minimal CSV parser (same semantics as the CRM's parseFuCSV).
function npsParseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}

// Same classification the Store CRM uses for credit-escalation leads.
function npsClassifyLead(responseText){
  const t = String(responseText || "").replace(/<[^>]*>/g, "").toLowerCase();
  if(!t) return "pending";
  if(/\bresubmit\b/i.test(t)) return "resubmit";
  if(/\bconfirm[a-z]*\b[\s\S]{0,80}\beligible\b/i.test(t)) return "approved";
  return "denied";
}

      fetch(NPS_CONFIG.CLOSURES_URL + "?_=" + Date.now(), { cache: "no-store" })
    ]);
    const oo = ooR.ok ? await ooR.json() : { orders: [] };
    const cl = clR.ok ? await clR.json() : {};
    (oo.orders || []).forEach(o => {
      const c = cl[o.workOrder];
      const status = (!c || c.status === "Other") ? "Open" : c.status;
      if(status !== "Open") return;
      const shortName = npsShortFromRaw(o.store);
      if(!shortName) return;
      open[shortName] = (open[shortName] || 0) + 1;
      if(Number(o.age) >= 30) aged[shortName] = (aged[shortName] || 0) + 1;
      (openList[shortName] = openList[shortName] || []).push({
        customer: String(o.customerName || "").trim(),
        wo: String(o.workOrder || "").trim(),
        product: String(o.product || "").trim(),
        rep: String(o.repName || "").trim(),
        age: Number(o.age) || 0
      });
    });
    Object.keys(openList).forEach(k => {
      openList[k].sort((a,b) => b.age - a.age);
      openList[k] = openList[k].slice(0, 50);
    });
  } catch(e){ console.warn("open-orders fetch failed:", e); }
  // --- lead follow-ups ---
  try {
    const r = await fetch(NPS_CONFIG.FU_CSV_URL + "&_=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const rows = npsParseCsv(await r.text());
      const h = (rows[0] || []).map(s => String(s).trim());
      const col = name => h.indexOf(name);
      const iStore = col("store"), iResp = col("creditTeamResponse"),
            iCust = col("customerName"), iPhone = col("phone"), iRep = col("rep");
      for(let i = 1; i < rows.length; i++){
        const row = rows[i];
        if(!row || !row.some(v => v && String(v).trim())) continue;
        const bucket = npsClassifyLead(iResp >= 0 ? row[iResp] : "");
        if(bucket !== "approved" && bucket !== "resubmit") continue;
        const shortName = npsShortFromRaw(iStore >= 0 ? row[iStore] : "");
        if(!shortName) continue;
        if(!leads[shortName]) leads[shortName] = { approved: 0, resubmit: 0 };
        leads[shortName][bucket]++;
        (leadList[shortName] = leadList[shortName] || []).push({
          customer: iCust >= 0 ? String(row[iCust] || "").trim() : "",
          phone: iPhone >= 0 ? String(row[iPhone] || "").trim() : "",
          rep: iRep >= 0 ? String(row[iRep] || "").trim() : "",
          bucket: bucket
        });
      }
      // approved (contact now) first, then resubmits
      Object.keys(leadList).forEach(k => {
        leadList[k].sort((a,b) => (a.bucket === b.bucket) ? 0 : (a.bucket === "approved" ? -1 : 1));
        leadList[k] = leadList[k].slice(0, 50);
      });
    }
  } catch(e){ console.warn("lead follow-ups fetch failed:", e); }
  NPS_CRM = { open: open, aged: aged, leads: leads, openList: openList, leadList: leadList, loaded: true };
  return NPS_CRM;
}

// "ALURRALDE,DIANA" → "Alurralde, Diana"
function npsTitleCase(s){
  return String(s || "").toLowerCase().replace(/,(?=\S)/g, ", ")
    .replace(/\b[a-z]/g, c => c.toUpperCase()).trim();
}

// Resolve an NTID like "bp-aray552" → "Anthony Ray" by matching first initial +
// last-name prefix against Rep Rank names. Returns "" unless exactly one match.
function npsRepName(ntid){
  if(!ntid || !NPS_REPS.length) return "";
  const m = String(ntid).toLowerCase().match(/^bp-([a-z])([a-z]+?)\d/);
  if(!m) return "";
  const ini = m[1], lastPrefix = m[2];
  const hits = NPS_REPS.filter(rep => {
    const parts = String(rep.name).trim().toLowerCase().split(/\s+/);
    if(parts.length < 2) return false;
    const first = parts[0], last = parts[parts.length - 1];
    return first.charAt(0) === ini && last.indexOf(lastPrefix) === 0;
  });
  if(hits.length === 1) return hits[0].name;
  // collisions: try narrowing by exact last-name length match
  if(hits.length > 1){
    const exact = hits.filter(rep => {
      const last = String(rep.name).trim().toLowerCase().split(/\s+/).pop();
      return last === lastPrefix;
    });
    if(exact.length === 1) return exact[0].name;
  }
  return "";
}

function npsPctFmt(v){
  const n = Number(v) || 0;
  return (Math.abs(n) <= 1.5 ? n * 100 : n).toFixed(1) + "%";
}
function npsMoneyFmt(v){ return "$" + Math.round(Number(v) || 0).toLocaleString("en-US"); }

function npsMedian(arr){
  const a = arr.slice().sort((x,y) => x - y);
  if(!a.length) return 0;
  const mid = Math.floor(a.length / 2);
  return a.length % 2 ? a[mid] : (a[mid-1] + a[mid]) / 2;
}

let NPS_TARGETS = { byStore: {}, loaded: false };

async function npsFetchTargets(){

async function npsFetchConversion(){
  try {
    const purl = (await npsPinnedUrl("Daily-Sales-Report","data/Sales Report.xlsx")) || NPS_CONFIG.NPS_SALES_REPORT_URL;
    const resp = await fetch(purl + "?t=" + Date.now(), { cache: "no-store" });
    if(resp.ok){
      const buf = await resp.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
      const conv = {};
      const zs = wb.Sheets["Zero"];
      if(zs){
        const aoa = XLSX.utils.sheet_to_json(zs, { header: 1, defval: null, raw: true });
        let hr = -1;
        for(let i=0;i<Math.min(aoa.length,10);i++){ if(aoa[i] && String(aoa[i][0]||"").trim().toLowerCase()==="store name"){ hr=i; break; } }
        if(hr > -1){
          for(let i=hr+1;i<aoa.length;i++){
            const r = aoa[i]; if(!r || !r[0]) continue;
            const sn = npsShortFromRaw(r[0]); if(!sn) continue;
            const mobile = Number(r[2]) || 0;
            const mcrRaw = r[7];
            const traffic = Number(r[8]) || 0;
            const mcr = (typeof mcrRaw === "number") ? (mcrRaw <= 1 ? mcrRaw*100 : mcrRaw) : null;
            conv[sn] = { traffic: traffic, mobile: mobile, mcr: mcr, tcharts: 0, tpct: null };
          }
        }
      }
      const srk = wb.Sheets["Store Rank"];
      if(srk){
        const aoa = XLSX.utils.sheet_to_json(srk, { header: 1, defval: null, raw: true });
        let h = -1, col = 30;
        for(let i=0;i<Math.min(aoa.length,12);i++){ if(aoa[i] && String(aoa[i][2]||"").trim().toLowerCase()==="store"){ h=i; break; } }
        if(h > -1){
          const hdr = aoa[h];
          for(let ci=0;ci<hdr.length;ci++){ if(hdr[ci] && /shopper\s*trak\s*daily\s*avg/i.test(String(hdr[ci]))){ col=ci; break; } }
          for(let i=h+1;i<aoa.length;i++){ const r=aoa[i]; if(!r || !r[2]) continue; const sn = npsShortFromRaw(r[2]); const v = Number(r[col]); if(sn && !isNaN(v) && v>0) NPS_DAILY[sn.toLowerCase()] = Math.round(v); }
        }
      }
      NPS_CONV.byStore = conv;
    }
    const tr = await fetch(NPS_CONFIG.TSHEET_URL + "?_=" + Date.now(), { cache: "no-store" });
    if(tr.ok){
      const data = await tr.json();
      const subs = (data && data.submissions) || [];
      const byDate = {};
      for(const s of subs){ const ts = s.timestamp; if(!ts) continue; const day = String(ts).slice(0,10); (byDate[day] = byDate[day] || []).push(s); }
      const d = new Date(); d.setDate(d.getDate()-1); const yISO = d.toISOString().slice(0,10);
      let useDate = null;
      if(byDate[yISO]) useDate = yISO;
      else { const days = Object.keys(byDate).sort(); for(let i=days.length-1;i>=0;i--){ if(byDate[days[i]].length>=30){ useDate=days[i]; break; } } if(!useDate && days.length) useDate = days[days.length-1]; }
      const counts = {};
      (byDate[useDate] || []).forEach(s => { const sn = npsShortFromRaw(s.store); if(sn) counts[sn] = (counts[sn]||0)+1; });
      NPS_CONV.date = useDate;
      Object.keys(NPS_CONV.byStore).forEach(sn => {
        const tc = counts[sn] || 0;
        const traffic = NPS_CONV.byStore[sn].traffic || 0;
        NPS_CONV.byStore[sn].tcharts = tc;
        NPS_CONV.byStore[sn].tpct = traffic > 0 ? (tc/traffic*100) : null;
      });
    }
    NPS_CONV.loaded = true;
  } catch(e){ console.warn("conversion unavailable:", e); }
  return NPS_CONV;
}

/* BFX SMART TARGETS ========================================================
   Everything from here to "END BFX SMART TARGETS" is new and IDENTICAL in
   upload.html + NPS-Index---Medallia/index.html (it lives inside the shared
   NPS module). It embeds the Blufox Smart Goal Engine VERBATIM, then renders
   the "🎯 TODAY'S TARGETS" panel used by the morning-briefing email and the
   NPS Index per-store dashboard cards. */
/* ============================================================
   BLUFOX SMART GOAL ENGINE  v1.1  (shared module)
   v1.1: volume-aware attachGoal for Gig/Plus (replaces "N in a row"),
         video-per-internet rule, mixGoal locked to Jeff's NPS Calculator.
   Embed this block VERBATIM in:
     - Daily-Goals-Sheet/index.html
     - One-On-One-Form/index.html
     - NPS email module (NPS-Index---Medallia/index.html + Daily-Sales-Report/upload.html)
   ------------------------------------------------------------
   DESIGN (agreed with Jeff, July 2026):
   - DUAL PERIOD:
       * FISCAL month (22nd -> 21st): drives MCR / FCR / NPS pacing,
         because close rates are measured fiscally.
       * CALENDAR month: drives GP $, Accessory $, Watch/Tablet units,
         because the sales report counts those units calendar-MTD and
         the Monthly Target Planner assigns calendar-month goals.
   - PACING: need = goal - MTD actual; daily = ceil(need / daysRemaining)
     where daysRemaining INCLUDES today (old sheet excluded today -> inflated goals).
   - DAY MATH: computed from calendar dates at midnight (old sheet used
     clock time, so goals flipped at noon).
   - OVER-PACE RULE: if a store's trending close rate beats the minimum
     (7% MCR / 10% FCR), the goal RISES to maintain their trend, flagged
     stretch:true. Same for GP when gpTrend > assigned target.
   - GOAL HIT: when need <= 0, status 'hit' and daily = maintenance pace
     (what it takes per day to keep the achieved rate), never a fake 1.
   ============================================================ */
var BFX = (function(){
  'use strict';

  // ---- Company standards (single source of truth) ----
  var STD = {
    MCR_MIN: 7,        // % mobile close rate, fiscal
    FCR_MIN: 10,       // % fiscal close rate (RGUs), fiscal
    NPS_GOAL: 80,      // tNPS
    GIG_GOAL: 80,      // % of internet sales on Gig
    PLUS_GOAL: 75,     // % of mobile lines on Plus
    ACC_PER_BOX: 20,   // $ accessory per mobile box (was $30 on old daily sheet — wrong)
    WT_RATE: 2,        // % of traffic -> watch/tablet
    TSHEET_RATE: 20    // % of traffic -> t-sheets
  };

  var DAY = 86400000;
  function mid(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function ceil(x){ return Math.ceil(x - 1e-9); }

  // ---- Period math (date-based, stable all day) ----
  // Fiscal month: 22nd -> 21st. rem INCLUDES today.
  function fiscalPeriod(now, dayOverride){
    var t = mid(now||new Date()), y=t.getFullYear(), m=t.getMonth(), d=t.getDate();
    var s = (d>=22) ? new Date(y,m,22) : new Date(y,m-1,22);
    var e = (d>=22) ? new Date(y,m+1,21) : new Date(y,m,21);
    var tot = Math.round((e-s)/DAY)+1;
    var el  = dayOverride>0 ? dayOverride : Math.round((t-s)/DAY)+1;
    el = Math.min(Math.max(el,1), tot);
    return { start:s, end:e, tot:tot, el:el, rem: tot-el+1 };
  }
  function calendarPeriod(now, dayOverride){
    var t = mid(now||new Date()), y=t.getFullYear(), m=t.getMonth();
    var tot = new Date(y, m+1, 0).getDate();
    var el  = dayOverride>0 ? dayOverride : t.getDate();
    el = Math.min(Math.max(el,1), tot);
    return { tot:tot, el:el, rem: tot-el+1 };
  }

  /* ---- Rate-driven unit goal (MCR -> mobile, FCR -> RGU). FISCAL basis.
     in: { trafDay, mtdUnits, minRate(%), per: fiscalPeriod() }
     Traffic to date approximated trafDay*el (report gives daily avg, not fiscal MTD).
     out: { rate, trend, stretch, monthGoal, mtd, need, daily, maintain, status, pct } */
  function rateGoal(o){
    var p = o.per, trafDay = o.trafDay>0 ? o.trafDay : 0;
    if(!trafDay) return { noTraffic:true, rate:o.minRate, trend:0, stretch:false,
      monthGoal:0, mtd:o.mtdUnits||0, need:0, daily:0, maintain:0, status:'no-data', pct:0 };
    var trafToDate = trafDay * p.el;
    var projTraf   = trafDay * p.tot;
    var mtd   = o.mtdUnits||0;
    var trend = trafToDate>0 ? (mtd/trafToDate)*100 : 0;
    var stretch = trend > o.minRate;
    var rate  = Math.max(o.minRate, trend);          // over-pace rule: raise to trend
    var monthGoal = ceil((rate/100)*projTraf);       // always round UP
    var need  = Math.max(0, monthGoal - mtd);
    var maintain = Math.max(1, ceil((rate/100)*trafDay)); // per-day pace to hold the rate
    var daily = need>0 ? ceil(need/p.rem) : maintain;
    var status = need<=0 ? 'hit' : (mtd >= (rate/100)*trafToDate - 1e-9 ? 'on-pace' : 'behind');
    return { rate:rate, trend:trend, stretch:stretch, monthGoal:monthGoal, mtd:mtd,
             need:need, daily:daily, maintain:maintain, status:status,
             pct: monthGoal>0 ? Math.min(100,(mtd/monthGoal)*100) : 0 };
  }

  /* ---- Amount goal (GP $, Accessory $, W/T units). CALENDAR basis.
     in: { monthGoal, trendGoal(optional, e.g. gpTrend), mtd, per: calendarPeriod(), roundTo }
     Jeff's example: goal $50,000, trending $48,000 -> gap $2,000 / days left
     is added on top of pace. Implemented as need/rem which is equivalent. */
  function amountGoal(o){
    var p = o.per;
    var base = o.monthGoal||0;
    var stretch = (o.trendGoal||0) > base;
    var goal = Math.max(base, o.trendGoal||0);       // over-pace rule
    var mtd  = o.mtd||0;
    var need = Math.max(0, goal - mtd);
    var maintain = Math.max(0, ceil(goal/p.tot));
    var daily = need>0 ? ceil(need/p.rem) : maintain;
    var paceMTD = goal*(p.el/p.tot);
    var status = need<=0 ? 'hit' : (mtd >= paceMTD-1e-9 ? 'on-pace' : 'behind');
    if(o.roundTo){ daily = Math.ceil(daily/o.roundTo)*o.roundTo; }
    return { goal:goal, stretch:stretch, mtd:mtd, need:need, daily:daily,
             maintain:maintain, status:status,
             pct: goal>0 ? Math.min(100,(mtd/goal)*100) : 0,
             gapToPace: Math.max(0, paceMTD-mtd) };
  }

  /* ---- Mix goal (NPS): how many more "good" outcomes in a row to reach
     the goal share. n = ceil((g*base - num)/(1-g)).
     Matches Jeff's NPS Calculator 2025.xlsx exactly:
       =MAX(0, CEILING((Surveys*Desired - Surveys*Current)/(1-Desired), 1))
     NPS: num = promoters - detractors, base = total surveys, g = 0.80. */
  function mixGoal(o){
    var g = (o.goalPct||0)/100, num = o.num||0, base = o.base||0;
    var cur = base>0 ? (num/base)*100 : null;
    if(cur===null) return { cur:null, needed:null, status:'no-data', goalPct:o.goalPct };
    if(cur >= o.goalPct) return { cur:cur, needed:0, status:'hit', goalPct:o.goalPct };
    var needed = g>=1 ? Infinity : Math.max(1, ceil((g*base - num)/(1-g)));
    return { cur:cur, needed:needed, status:'behind', goalPct:o.goalPct };
  }

  /* ---- Attach goal (Gig %, Plus %, video-on-internet) — VOLUME-AWARE.
     The old "next N in a row" math dragged the whole month's history along
     (e.g. "139 Gig in a row"), which is not actionable. Instead:
       expRem  = internets/mobiles you'll realistically sell in the rest of
                 the month, from your own pace: ceil((base/el) * rem)
       needed  = Gig sales required AMONG those to finish the month at goal:
                 ceil(g*(base+expRem) - num)
     If needed > expRem the goal is mathematically out of reach this month:
       status 'all-in' -> sell goal-product on EVERY remaining sale and
       report bestPct (the % you'd finish at), fresh start next month.
     in: { goalPct, num, base, per (calendarPeriod or fiscalPeriod) }
     out: { cur, expRem, needed, perDay, share(%), bestPct, status } */
  function attachGoal(o){
    var g = (o.goalPct||0)/100, num = o.num||0, base = o.base||0, p = o.per;
    var cur = base>0 ? (num/base)*100 : null;
    if(cur===null) return { cur:null, status:'no-data', goalPct:o.goalPct };
    if(cur >= o.goalPct){
      // already at goal: hold it — goal-share of each remaining sale
      var expR0 = ceil((base/p.el)*p.rem);
      return { cur:cur, expRem:expR0, needed:ceil(g*expR0), perDay:0,
               share:o.goalPct, bestPct:cur, status:'hit', goalPct:o.goalPct };
    }
    var expRem = ceil((base/Math.max(1,p.el)) * p.rem);        // own-pace projection
    if(expRem<=0) return { cur:cur, expRem:0, needed:0, perDay:0, share:null,
                           bestPct:cur, status:'no-volume', goalPct:o.goalPct };
    var needed = Math.max(1, ceil(g*(base+expRem) - num));
    if(needed >= expRem){
      var bestPct = ((num+expRem)/(base+expRem))*100;          // all-Gig finish
      return { cur:cur, expRem:expRem, needed:expRem, perDay:null,
               share:100, bestPct:bestPct, status:'all-in', goalPct:o.goalPct };
    }
    return { cur:cur, expRem:expRem, needed:needed,
             perDay: needed/p.rem,                              // may be <1 — round in UI
             share: (needed/expRem)*100,
             bestPct:o.goalPct, status:'behind', goalPct:o.goalPct };
  }

  /* ---- Full store computation ----
     s: { trafDay, fMob, fInst,            // fiscal MTD mobile / RGU installs
          gpTarget (from target-summary.json, fallback report col P),
          gpTrend, gpMTD,
          accMTD, wtMTD,
          npsProm, npsDet, npsTotal,       // optional (Medallia MTD)
          gigNum, gigBase, plusNum, plusBase } // optional
     opts: { now, fiscalDayOverride, calDayOverride } */
  function storeGoals(s, opts){
    opts = opts||{};
    var fp = fiscalPeriod(opts.now, opts.fiscalDayOverride||0);
    var cp = calendarPeriod(opts.now, opts.calDayOverride||0);

    var mobile = rateGoal({ trafDay:s.trafDay, mtdUnits:s.fMob, minRate:STD.MCR_MIN, per:fp });
    var rgu    = rateGoal({ trafDay:s.trafDay, mtdUnits:s.fInst, minRate:STD.FCR_MIN, per:fp });

    // Accessory month goal = $20 x mobile month goal (unit-consistent with planner)
    var accMonth = STD.ACC_PER_BOX * mobile.monthGoal;
    var acc = amountGoal({ monthGoal:accMonth, mtd:s.accMTD, per:cp, roundTo:5 });

    var wtMonth = ceil((STD.WT_RATE/100) * (s.trafDay||0) * cp.tot);
    var wt = amountGoal({ monthGoal:wtMonth, mtd:s.wtMTD, per:cp });

    var gp = amountGoal({ monthGoal:s.gpTarget||0, trendGoal:s.gpTrend||0,
                          mtd:s.gpMTD||0, per:cp, roundTo:25 });

    var out = { period:{fiscal:fp, calendar:cp}, std:STD,
                mobile:mobile, rgu:rgu, acc:acc, wt:wt, gp:gp };

    if(s.npsTotal!=null) out.nps  = mixGoal({ goalPct:STD.NPS_GOAL,
      num:(s.npsProm||0)-(s.npsDet||0), base:s.npsTotal });
    // Gig / Plus: volume-aware attach goals (report MTD counts are calendar-month)
    if(s.gigBase!=null)  out.gig  = attachGoal({ goalPct:STD.GIG_GOAL,  num:s.gigNum,  base:s.gigBase,  per:cp });
    if(s.plusBase!=null) out.plus = attachGoal({ goalPct:STD.PLUS_GOAL, num:s.plusNum, base:s.plusBase, per:cp });
    // Video / non-traditional: standard is video WITH EVERY internet sale.
    // Daily video goal = today's internet (RGU) goal; monthly need = internets without video.
    if(s.videoMTD!=null && s.intMTD!=null){
      out.video = { attachCur: s.intMTD>0 ? (s.videoMTD/s.intMTD)*100 : null,

/* BFX SMART TARGETS: Store Rank rows cached by npsFetchSalesStores() so the
   goal helpers can see a store's row without re-fetching the workbook. */
let BFX_SALES_ROWS = [];
function bfxRowFor(shortName){
  const k = String(shortName || "").trim().toLowerCase();
  return (BFX_SALES_ROWS || []).find(s => String(s.name).trim().toLowerCase() === k) || null;
}

/* BFX SMART TARGETS: fiscal-MTD NPS survey buckets per store (nps-mtd.json —
   the same Medallia MTD export the dashboard's MTD tab reads). Best effort. */
let BFX_NPSMTD = { byStore: {}, loaded: false };
function bfxIngestNpsMtd(surveys){
  const by = {};
  (surveys || []).forEach(s => {
    if(!s || !s.storeKey || s.score == null) return;
    const k = String(s.storeKey).trim().toLowerCase();
    const rec = by[k] = by[k] || { prom: 0, det: 0, total: 0 };
    const b = npsBucket(Number(s.score));
    if(b === "good") rec.prom++; else if(b === "bad") rec.det++;
    rec.total++;
  });
  BFX_NPSMTD = { byStore: by, loaded: true };
  return BFX_NPSMTD;
}
async function bfxFetchNpsMtd(){
  if(BFX_NPSMTD.loaded) return BFX_NPSMTD;
  try {
    const url = NPS_CONFIG.MTD_URL || "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-mtd.json";
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const j = await r.json();
      bfxIngestNpsMtd(j.surveys || []);
    }
  } catch(e){ console.warn("nps-mtd unavailable for targets:", e); }
  return BFX_NPSMTD;
}

/* BFX SMART TARGETS: map the parsed feeds into BFX.storeGoals for one store.
   Inputs: NPS_DAILY (shopper-trak daily avg), NPS_TARGETS (target-summary.json),
   the store's Store Rank row, BFX_NPSMTD (Medallia MTD buckets).
   g.est flags which inputs were estimated so the UI can mark them with ~. */
function bfxStoreTargets(shortName, rowMaybe){
  const key = String(shortName || "").trim().toLowerCase();
  const row = rowMaybe || bfxRowFor(shortName);
  const trafDay = NPS_DAILY[key] || 0;
  if(!row || !trafDay) return null;
  const t = (NPS_TARGETS.byStore || {})[key] || {};
  const cp = BFX.calendarPeriod();
  const gpTrend = Number(row.gpTrend) || 0;
  const gpMTD = gpTrend * (cp.el / cp.tot);   // ESTIMATE: report carries trend, not GP MTD
  const wtMTD = (Number(row.watchMTD) || 0) + (Number(row.tabletMTD) || 0);
  const devs  = (Number(row.mobileMTD) || 0) + wtMTD;
  const accMTD = (row.accTotal != null) ? Number(row.accTotal)
               : Math.round((Number(row.accPerDev) || 0) * devs);   // estimate when col missing
  const fMob  = (row.fMob  != null) ? Number(row.fMob)  : (Number(row.mobileMTD) || 0);
  const fInst = (row.fInst != null) ? Number(row.fInst) : (Number(row.newRGU) || 0);
  const s = { trafDay: trafDay, fMob: fMob, fInst: fInst,
              gpTarget: Number(t.gp) || 0, gpTrend: gpTrend, gpMTD: gpMTD,
              accMTD: accMTD, wtMTD: wtMTD };
  const m = (BFX_NPSMTD.byStore || {})[key];
  if(m && m.total){ s.npsProm = m.prom; s.npsDet = m.det; s.npsTotal = m.total; }
  const g = BFX.storeGoals(s);
  g.est = { gpMTD: true, accMTD: row.accTotal == null,
            fMob: row.fMob == null, fInst: row.fInst == null };
  return g;
}

/* BFX SMART TARGETS: subject-line snippet " • today: X XM / Y RGU". */
function bfxSubjectSnippet(shortName, row){
  const g = bfxStoreTargets(shortName, row);
  if(!g || g.mobile.noTraffic) return "";
  return " • today: " + g.mobile.daily + " XM / " + g.rgu.daily + " RGU";
}

/* BFX SMART TARGETS: one dark-navy target tile (email-safe, tables only —
   no flex/grid so Outlook renders it). Modes: stretch ⭐ orange, behind red,
   hit green ✓, norm = standard header tile. */
function bfxTgtTile(label, big, ctx, mode){
  const bg = mode === "stretch" ? "rgba(249,115,22,0.16)" : mode === "behind" ? "rgba(239,68,68,0.13)" : mode === "hit" ? "rgba(16,185,129,0.13)" : "rgba(255,255,255,0.08)";
  const bd = mode === "stretch" ? "rgba(253,186,116,0.45)" : mode === "behind" ? "rgba(248,113,113,0.45)" : mode === "hit" ? "rgba(110,231,183,0.45)" : "rgba(159,192,255,0.22)";
  const lc = mode === "stretch" ? "#fdba74" : mode === "behind" ? "#fca5a5" : mode === "hit" ? "#6ee7b7" : "#9fc0ff";
  const cc = mode === "stretch" ? "#fdba74" : mode === "behind" ? "#fca5a5" : mode === "hit" ? "#6ee7b7" : "#8aa3d6";
  return '<td width="33.33%" style="padding:3px;vertical-align:top;">' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:' + bg + ';border:1px solid ' + bd + ';border-radius:8px;"><tr><td style="padding:8px 6px;text-align:center;">' +

    '</td></tr></table></td>';
}
function bfxMode(u){ return u.status === "hit" ? "hit" : u.stretch ? "stretch" : u.status === "behind" ? "behind" : "norm"; }
// Context line for rate-driven tiles (XM, RGU — fiscal basis).
function bfxCtxRate(u){
  if(u.status === "hit") return "goal hit &#10003; maintain " + u.maintain + "/day";
  if(u.status === "behind") return "behind pace &mdash; need " + u.daily + "/day";
  return "MTD " + u.mtd + " of " + u.monthGoal + " &middot; trending " + (Math.round(u.trend * 10) / 10).toFixed(1) + "%" + (u.stretch ? " &#11088;" : "");
}
// Context line for amount tiles (GP $, Acc $ — calendar basis). est prefixes ~.
function bfxCtxAmt(u, est){
  const f = v => "$" + Math.round(v).toLocaleString("en-US");
  if(u.status === "hit") return "goal hit &#10003; maintain " + f(u.maintain) + "/day";
  if(u.status === "behind") return "behind pace &mdash; need " + f(u.daily) + "/day";
  return "MTD " + (est ? "~" : "") + f(u.mtd) + " of " + f(u.goal) + (u.stretch ? " &#11088;" : "");
}

/* BFX SMART TARGETS: the 🎯 TODAY'S TARGETS panel. Renders directly below the
   Monthly Goal panel inside the dark-navy email header (also reused by the
   NPS Index dashboard cards). Returns "" when the engine has no data. */
function npsDailyGoalHtml(shortName, rowMaybe){
  const g = bfxStoreTargets(shortName, rowMaybe);
  if(!g) return "";
  const fp = g.period.fiscal, cp = g.period.calendar;
  // Watch/Tablet: weekly framing is friendlier when fewer units than days remain.
  const wt = g.wt;
  let wtBig, wtCtx;
  if(wt.status === "hit"){
    wtBig = "&#10003;";
    wtCtx = "goal hit &#10003; maintain " + wt.maintain + "/day";
  } else if(wt.need > 0 && wt.need < cp.rem){
    wtBig = Math.ceil(wt.need / Math.max(1, cp.rem / 7)) + "/wk";
    wtCtx = "MTD " + wt.mtd + " of " + wt.goal + (wt.status === "behind" ? " &mdash; behind pace" : "");
  } else {
    wtBig = wt.daily + "/day";
    wtCtx = wt.status === "behind" ? "behind pace &mdash; need " + wt.daily + "/day"
          : "MTD " + wt.mtd + " of " + wt.goal;
  }
  // NPS: "N more 9–10 surveys to reach 80" line.
  let npsBig = "&mdash;", npsCtx = "MTD surveys unavailable", npsModeStr = "norm";

      npsCtx = "<b>" + g.nps.needed + "</b> more 9&ndash;10 survey" + (g.nps.needed === 1 ? "" : "s") + " &rarr; " + g.nps.goalPct; /* BFX v1.1 */
      npsModeStr = "behind";
    }
  } else if(g.nps && g.nps.status === "no-data"){
    npsCtx = "no surveys yet &mdash; every 9&ndash;10 counts";
  }
  const gpTile = g.gp.goal > 0
    ? bfxTgtTile("GP $ / Day", "$" + g.gp.daily.toLocaleString("en-US"), bfxCtxAmt(g.gp, g.est.gpMTD), bfxMode(g.gp))
    : bfxTgtTile("GP $ / Day", "&mdash;", "no GP target posted", "norm");
  return '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:10px;"><tr>' +
    '<td style="background:rgba(255,255,255,0.08);border:1px solid rgba(159,192,255,0.35);border-radius:12px;padding:12px 8px 9px;">' +
    '<div style="color:#9fc0ff;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px 7px;">&#127919; Today&rsquo;s Targets ' +
    '<span style="color:#8aa3d6;font-weight:600;letter-spacing:0.4px;text-transform:none;">&bull; ' + fp.rem + ' fiscal day' + (fp.rem === 1 ? "" : "s") + ' left &bull; ' + cp.rem + ' calendar</span></div>' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>' +
    bfxTgtTile("XM / Day", g.mobile.daily + "/day", bfxCtxRate(g.mobile), bfxMode(g.mobile)) +
    bfxTgtTile("RGU / Day", g.rgu.daily + "/day", bfxCtxRate(g.rgu), bfxMode(g.rgu)) +
    bfxTgtTile("Acc $ / Day", "$" + g.acc.daily.toLocaleString("en-US"), bfxCtxAmt(g.acc, g.est.accMTD), bfxMode(g.acc)) +
    '</tr><tr>' +

    '</tr></table>' +
    '</td></tr></table>';
}

function npsMonthlyGoals(shortName){
  const key = String(shortName).trim().toLowerCase();
  const t = (NPS_TARGETS.byStore || {})[key];
  const daily = NPS_DAILY[key];
  if(!t || !daily) return null;
  const C = Math.ceil;
  const monthly = daily * npsDaysInMonth();
  /* BFX SMART TARGETS: the XM goal now comes from the smart engine (over-pace
     aware — rises to the store's trend when they beat 7%), and accessory is
     $20/box against that SMART mobile goal. Falls back to the old flat 7%
     when the engine has no Store Rank row yet. */
  const smart = bfxStoreTargets(shortName);
  const xm = (smart && smart.mobile.monthGoal > 0) ? smart.mobile.monthGoal : C(monthly * 0.07);
  const xmRate = (smart && smart.mobile.monthGoal > 0) ? smart.mobile.rate : 7;
  const xmStretch = !!(smart && smart.mobile.stretch);
  return { gp: C(t.gp||0), xm: xm, rgu: C(monthly*((t.fcr||0)/100)), wt: C(monthly*0.02), acc: C(xm*BFX.STD.ACC_PER_BOX), ts: C(monthly*0.20), xmRate: xmRate, xmStretch: xmStretch };
}

  const loaded = NPS_PUNCH.loaded;
