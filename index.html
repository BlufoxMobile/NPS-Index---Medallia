<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blufox NPS Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f1ea; min-height:100vh; color:#292524; padding:24px 16px 60px; }
  .wrap { max-width:980px; margin:0 auto; }
  header h1 { font-size:26px; font-weight:800; color:#1c1917; letter-spacing:-0.3px; }
  header p { color:#78716c; font-size:13px; margin-top:4px; }
  .tabs { display:flex; gap:8px; margin:22px 0 18px; border-bottom:1px solid #e0dad0; }
  .tab { background:none; border:none; color:#78716c; font-family:inherit; font-size:14px; font-weight:700; padding:10px 18px; cursor:pointer; border-bottom:3px solid transparent; }
  .tab.active { color:#1c1917; border-bottom-color:#b45309; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; align-items:center; }
  select, .chip, .lbtn { background:#ffffff; border:1px solid #d6d3d1; color:#292524; border-radius:8px; padding:8px 12px; font-family:inherit; font-size:13px; cursor:pointer; }
  select:focus { outline:2px solid #b45309; }
  .chip { border-radius:999px; font-weight:700; color:#a8a29e; }
  .chip.on-good { background:#f0fdf4; border-color:#15803d; color:#15803d; }
  .chip.on-ok   { background:#fffbeb; border-color:#b45309; color:#b45309; }
  .chip.on-bad  { background:#fef2f2; border-color:#dc2626; color:#dc2626; }
  .lbtns { margin-left:auto; display:flex; gap:8px; }
  .lbtn { font-weight:600; color:#57534e; }
  .lbtn:hover { background:#efe9e0; }
  .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:22px; }
  .sumcard { background:#ffffff; border:1px solid #e7e2d9; border-radius:12px; padding:14px 16px; box-shadow:0 1px 3px rgba(41,37,36,0.06); }
  .sumcard .lbl { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#a8a29e; font-weight:700; }
  .sumcard .val { font-size:24px; font-weight:800; margin-top:4px; color:#1c1917; }
  .sumcard.good .val { color:#15803d; } .sumcard.ok .val { color:#b45309; } .sumcard.bad .val { color:#dc2626; }

  /* Selected-employee scorecard */
  .scorecard { background:#2b2522; border-radius:14px; padding:18px 20px; margin-bottom:22px; color:#faf8f5; box-shadow:0 6px 18px rgba(41,37,36,0.18); }
  .scorecard .who { font-size:20px; font-weight:800; }
  .scorecard .whosub { font-size:12px; color:#d6cec2; margin-top:2px; }
  .scorecard .scrow { display:flex; flex-wrap:wrap; gap:22px; margin-top:14px; align-items:flex-end; }
  .scorecard .big { font-size:40px; font-weight:800; line-height:1; }
  .scorecard .biglbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#bdb4a6; font-weight:700; margin-top:4px; }
  .scorecard .mini { font-size:22px; font-weight:800; }
  .scorecard .minilbl { font-size:10px; letter-spacing:0.8px; text-transform:uppercase; color:#bdb4a6; font-weight:700; }
  .scorecard .clear { background:#44403c; color:#faf8f5; border:none; border-radius:8px; padding:8px 14px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; margin-left:auto; }

  .storeblock { margin-bottom:14px; border-radius:12px; overflow:hidden; border:1px solid #e7e2d9; box-shadow:0 1px 3px rgba(41,37,36,0.06); }
  .storehead { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:14px 16px; background:#2b2522; cursor:pointer; user-select:none; }
  .storehead:hover { background:#352e2a; }
  .storehead .chev { color:#d6cec2; font-size:13px; transition:transform .18s; flex:0 0 auto; width:14px; }
  .storeblock.open .storehead .chev { transform:rotate(90deg); }
  .storehead h2 { font-size:17px; color:#faf8f5; font-weight:800; }
  .storehead .sub { font-size:12px; color:#cabfb0; }
  .storehead .right { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .npsbadge { font-size:12px; font-weight:800; padding:4px 11px; border-radius:999px; white-space:nowrap; }
  .npsbadge.good { background:#dcfce7; color:#15803d; }
  .npsbadge.bad  { background:#fee2e2; color:#b91c1c; }
  .npsbadge.zero { background:#f5f5f4; color:#57534e; }
  .npsbadge.official { background:#e0edff; color:#1d4ed8; }
  .storehead .counts { font-size:12px; font-weight:700; color:#d6cec2; white-space:nowrap; }
  .storebody { background:#ffffff; padding:12px; display:none; }
  .storeblock.open .storebody { display:block; }

  .repgroup { border:1px solid #ece7de; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .repgroup:last-child { margin-bottom:0; }
  .rephead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 13px; background:#faf7f2; border-bottom:1px solid #ece7de; }
  .rephead .rname { font-size:14px; font-weight:800; color:#1c1917; }
  .rephead .rntid { font-size:11px; color:#a8a29e; font-weight:600; }
  .rephead .rright { margin-left:auto; display:flex; align-items:center; gap:9px; }
  .rephead .rcounts { font-size:11px; font-weight:700; color:#78716c; white-space:nowrap; }
  .repsurveys { padding:10px 12px; }

  .survey { display:flex; gap:12px; border-radius:10px; padding:11px 13px; margin-bottom:9px; border:1px solid; }
  .survey:last-child { margin-bottom:0; }
  .survey.good { background:#f7fdf9; border-color:#bbe5c8; }
  .survey.ok   { background:#fffdf4; border-color:#f3dfa8; }
  .survey.bad  { background:#fef5f4; border-color:#dc2626; border-width:2px; }
  .score { flex:0 0 38px; height:38px; border-radius:50%; color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .good .score { background:#16a34a; } .ok .score { background:#d97706; } .bad .score { background:#dc2626; }
  .meta { font-size:12px; color:#78716c; font-weight:600; }
  .comment { font-size:14px; color:#292524; margin-top:5px; line-height:1.5; }
  .comment.none { color:#a8a29e; font-style:italic; }
  .empty { text-align:center; color:#a8a29e; padding:50px 0; font-size:14px; }
  .banner { padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:16px; display:none; line-height:1.5; }
  .banner.info { display:block; background:#fffdf4; border:1px solid #d6cba8; color:#713f12; }
  .banner.success { display:block; background:#f0fdf4; border:1px solid #86efac; color:#15803d; }
  .banner.error { display:block; background:#fef2f2; border:1px solid #fca5a5; color:#b91c1c; }
  .src { text-align:center; color:#bbb3a6; font-size:11px; margin-top:26px; line-height:1.7; }
  .legend { font-size:11px; color:#a8a29e; margin:-8px 0 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Blufox NPS Report</h1>
    <p id="updatedAt">Loading survey data&hellip;</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabYesterday" onclick="setTab('yesterday')">Yesterday's NPS</button>
    <button class="tab" id="tabMtd" onclick="setTab('mtd')">Month to Date NPS</button>
  </div>

  <div class="controls">
    <select id="storeFilter" onchange="render()"><option value="">All Stores</option></select>
    <select id="empFilter" onchange="onEmpChange()"><option value="">All Employees</option></select>
    <select id="dmFilter" onchange="render()"><option value="">All DMs</option></select>
    <button class="chip on-good" id="chipGood" onclick="toggleBand('good')">Good 9&ndash;10</button>
    <button class="chip on-ok" id="chipOk" onclick="toggleBand('ok')">OK 8</button>
    <button class="chip on-bad" id="chipBad" onclick="toggleBand('bad')">Needs Attention 0&ndash;7</button>
    <span class="lbtns">
      <button class="lbtn" onclick="expandAll(true)">Expand all</button>
      <button class="lbtn" onclick="expandAll(false)">Collapse all</button>
    </span>
  </div>
  <div class="legend">tNPS = % Promoters (9&ndash;10) minus % Detractors (0&ndash;7). Tap any store to open its surveys.</div>
  <div class="legend" id="scopenote" style="margin-top:-12px;color:#8a7f6f;"></div>

  <div id="scorecard"></div>
  <div class="summary" id="summary"></div>
  <div class="banner" id="banner"></div>
  <div id="results"><div class="empty">Loading&hellip;</div></div>
  <div class="src" id="src"></div>
</div>

<script>
// ============================ CONFIG ============================
const NPS_CONFIG = {
  RESPONSES_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-responses.json",
  DIRECTORY_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/store-directory.json",
  MTD_SCORES_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-mtd.json",
  NPS_SALES_REPORT_URL: "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/Sales%20Report.xlsx"
};

// Read each GitHub file at its NEWEST commit so we bypass raw CDN lag.
function npsLocalYMD(d){ d = d || new Date(); const z = n => String(n).padStart(2,"0"); return d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()); }
async function npsPinnedUrl(repo, path){
  try {
    const api = "https://api.github.com/repos/BlufoxMobile/" + repo + "/commits?path=" + encodeURIComponent(path) + "&per_page=1&_=" + Date.now();
    const r = await fetch(api, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } });
    if(r.ok){
      const j = await r.json();
      if(j && j[0] && j[0].sha){
        return "https://raw.githubusercontent.com/BlufoxMobile/" + repo + "/" + j[0].sha + "/" + path.split("/").map(encodeURIComponent).join("/");
      }
    }
  } catch(e){ console.warn("pin lookup failed:", repo, path, e); }
  return null;
}

// Store-number -> short store name (numbers observed in the tNPS "Store ID" column BE).
const NPS_STORE_NUM = {
  "55027": "Bourbonnais",   "55009": "Uptown",          "55005": "Frankfort",
  "51026": "Schererville",  "55004": "Glenview",        "51011": "Greeneville",
  "51025": "South Skokie",  "55006": "Elkhart",         "55010": "Evergreen Park",
  "55000": "Valparaiso",    "51022": "South Knoxville", "51023": "Round Lake Beach",
  "51031": "Johnson City",  "55002": "Tinley Park",     "55011": "Cicero",
  "55001": "Kildeer",       "55003": "Dekalb",          "55008": "Evanston",
  "51009": "Oak Ridge",     "51032": "Burbank",         "51033": "Michigan City",
  "51017": "Hammond",       "51035": "South Bend",      "51041": "Calumet City"
};
// Keyword fallbacks for store numbers we haven't seen yet. Checked in order.
const NPS_STORE_ALIASES = [
  ["South Knoxville", ["s. knoxville", "s knoxville", "south knoxville"]],
  ["South Skokie",    ["south skokie", "s. skokie", "s skokie", "skokie"]],
  ["South Bend",      ["south bend"]],
  ["Bourbonnais",     ["bourbonnais", "northfield square"]],
  ["Elkhart",         ["elkhart", "northfield center"]],
  ["Glenview",        ["glenview", "patriot marketplace"]],
  ["Dekalb",          ["dekalb", "oakland shopping"]],
  ["Kildeer",         ["kildeer"]],
  ["Uptown",          ["uptown"]],
  ["Evergreen Park",  ["evergreen park"]],
  ["Round Lake Beach",["round lake"]],
  ["Calumet City",    ["calumet"]],
  ["Michigan City",   ["michigan city"]],
  ["Tinley Park",     ["tinley"]],
  ["Johnson City",    ["johnson city"]],
  ["Greeneville",     ["greeneville"]],
  ["Oak Ridge",       ["oak ridge"]],
  ["Schererville",    ["schererville"]],
  ["Valparaiso",      ["valparaiso"]],
  ["Frankfort",       ["frankfort"]],
  ["Evanston",        ["evanston"]],
  ["Hammond",         ["hammond"]],
  ["Burbank",         ["burbank"]],
  ["Cicero",          ["cicero"]]
];
function npsMapStore(raw){
  if(!raw) return null;
  const m = String(raw).match(/^\s*(\d{4,6})/);
  if(m && NPS_STORE_NUM[m[1]]) return NPS_STORE_NUM[m[1]];
  const s = String(raw).toLowerCase();
  for(const [name, keys] of NPS_STORE_ALIASES){
    if(keys.some(k => s.includes(k))) return name;
  }
  return null;
}

function npsPrettyDate(iso){
  if(!iso) return "";
  const [y,mo,da] = iso.split("-").map(Number);
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[mo-1] + " " + da + ", " + y;
}
function npsEsc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// Bucket: 9-10 good (promoter), 8 ok (passive), 0-7 bad (detractor).
function npsBucket(score){ return score >= 9 ? "good" : score === 8 ? "ok" : "bad"; }
// tNPS = %promoters - %detractors, rounded.
function tnps(list){
  if(!list.length) return 0;
  const p = list.filter(s => s.score >= 9).length;
  const d = list.filter(s => s.score <= 7).length;
  return Math.round(((p - d) / list.length) * 100);
}
function npsDateStr(v){
  let d = null;
  if(v instanceof Date){ d = v; }
  else if(v){ const t = new Date(v); if(!isNaN(t.getTime())) d = t; }
  if(!d || isNaN(d.getTime())) return null;
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// ---- Employee name resolution (NTID -> real name) from Sales Report "Rep Rank" ----
let NPS_REPS = [];
function npsParseReps(wb){
  const ws = wb.Sheets["Rep Rank"];
  if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(20, rows.length); i++){
    if(rows[i] && rows[i].some(c => c && String(c).trim() === "Rank")){ hr = i; break; }
  }
  if(hr < 0) return [];
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const iName = h.findIndex(c => c.toLowerCase().includes("employee"));
  const iLoc  = h.findIndex(c => c.toLowerCase().includes("location"));
  if(iName < 0) return [];
  const out = [];
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || r[iName] == null) continue;
    const name = String(r[iName]).trim();
    if(!name) continue;
    out.push({ name: name, store: iLoc >= 0 ? String(r[iLoc] || "").trim() : "" });
  }
  return out;
}
// Resolve "bp-aray552" -> "Anthony Ray" by first initial + last-name prefix.
function npsRepName(ntid){
  if(!ntid || !NPS_REPS.length) return "";
  const m = String(ntid).toLowerCase().match(/^bp-([a-z])([a-z]+?)\d/);
  if(!m) return "";
  const ini = m[1], lastPrefix = m[2];
  const hits = NPS_REPS.filter(rep => {
    const parts = String(rep.name).trim().toLowerCase().split(/\s+/);
    if(parts.length < 2) return false;
    const first = parts[0], last = parts[parts.length - 1];
    return first.charAt(0) === ini && last.indexOf(lastPrefix) === 0;
  });
  if(hits.length === 1) return hits[0].name;
  if(hits.length > 1){
    const exact = hits.filter(rep => {
      const last = String(rep.name).trim().toLowerCase().split(/\s+/).pop();
      return last === lastPrefix;
    });
    if(exact.length === 1) return exact[0].name;
  }
  return "";
}
// "Huerto, Joshua" -> "Joshua Huerto"
function npsNameFirstLast(name){
  if(!name) return name;
  if(name.indexOf(",") < 0) return name;
  const [last, first] = name.split(",");
  return (first || "").trim() + " " + (last || "").trim();
}
const _repNameCache = {};
function repDisplay(ntid){
  if(!ntid) return "Unknown";
  // Prefer the official Express name from the MTD upload when present.
  if(MTD && MTD.employees && MTD.employees[ntid] && MTD.employees[ntid].name){
    return npsNameFirstLast(MTD.employees[ntid].name);
  }
  if(_repNameCache[ntid] !== undefined) return _repNameCache[ntid];
  const n = npsRepName(ntid);
  _repNameCache[ntid] = n || ntid;
  return _repNameCache[ntid];
}
// Official Express metrics for a rep (only meaningful on the MTD tab).
function officialFor(ntid){
  if(tab !== "mtd" || !MTD || !MTD.employees) return null;
  const e = MTD.employees[ntid];
  return (e && e.officialTnps != null) ? e : null;
}

async function npsFetchReps(){
  try {
    const url = (await npsPinnedUrl("Daily-Sales-Report","data/Sales Report.xlsx")) || NPS_CONFIG.NPS_SALES_REPORT_URL;
    const resp = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if(!resp.ok) throw new Error("Sales report HTTP " + resp.status);
    const wb = XLSX.read(await resp.arrayBuffer(), { type: "array" });
    NPS_REPS = npsParseReps(wb);
  } catch(e){ console.warn("Employee-name resolution unavailable:", e); NPS_REPS = []; }
}

// ============================ DASHBOARD ============================
let DATA = null, DIR = null, MTD = null;
let tab = "yesterday";
const bands = { good: true, ok: true, bad: true };
const expanded = new Set();   // store keys whose accordion is open (default collapsed)

function setTab(t){
  tab = t;
  document.getElementById("tabYesterday").classList.toggle("active", t === "yesterday");
  document.getElementById("tabMtd").classList.toggle("active", t === "mtd");
  render();
}
function toggleBand(b){
  bands[b] = !bands[b];
  const el = document.getElementById(b === "good" ? "chipGood" : b === "ok" ? "chipOk" : "chipBad");
  el.classList.toggle("on-" + b, bands[b]);
  render();
}
function toggleStore(key){
  if(expanded.has(key)) expanded.delete(key); else expanded.add(key);
  render();
}
function toggleStoreByIdx(i){
  const key = lastRenderedKeys[i];
  if(key == null) return;
  toggleStore(key);
}
function expandAll(open){
  expanded.clear();
  if(open) lastRenderedKeys.forEach(k => expanded.add(k));
  render();
}
function onEmpChange(){
  // When isolating an employee, open every store so their surveys are visible.
  const emp = document.getElementById("empFilter").value;
  if(emp){ lastRenderedKeys.forEach(k => expanded.add(k)); }
  render();
}
function banner(msg, type){
  const el = document.getElementById("banner");
  el.className = "banner " + (type || "");
  el.innerHTML = msg || "";
}
function dmShort(email){
  if(!email) return "";
  const map = {
    "jucarrillo@blufoxmobile.com": "Juan Carrillo",
    "jcabrales@blufoxmobile.com": "J. Cabrales",
    "idhorajiwala@blufoxmobile.com": "I. Dhorajiwala",
    "mbrooks@blufoxmobile.com": "M. Brooks",
    "jbilbrey@blufoxmobile.com": "Jeff Bilbrey"
  };
  return map[email.toLowerCase()] || email.split("@")[0];
}

function currentSurveys(){
  if(!DATA) return [];
  if(tab === "yesterday"){
    const ids = new Set(DATA.lastBatchIds || []);
    return (DATA.surveys || []).filter(s => ids.has(s.id));
  }
  // MTD: prefer the dedicated month-to-date upload (complete fiscal month, scores
  // & surveys from one source). Fall back to the daily-accumulated history,
  // filtered to the same fiscal-month-to-date window.
  if(MTD && Array.isArray(MTD.surveys) && MTD.surveys.length){
    return MTD.surveys;
  }
  const fw = npsFiscalWindow();
  return (DATA.surveys || []).filter(s => {
    const d = s.txnDate || "";
    return d >= fw.startYMD && d <= fw.endYMD;
  });
}
// Blufox NPS fiscal month = the 22nd through the 21st. "Month to date" is the
// 22nd of the current fiscal month through today (spans two calendar months).
function npsFiscalWindow(today){
  today = today || new Date();
  let y = today.getFullYear(), m = today.getMonth();  // 0-based month
  if(today.getDate() < 22){ m -= 1; if(m < 0){ m = 11; y -= 1; } }
  const start = new Date(y, m, 22);
  const z = n => String(n).padStart(2,"0");
  const ymd = d => d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate());
  return { start: start, end: today, startYMD: ymd(start), endYMD: ymd(today) };
}
// Every survey we might filter on (daily history + MTD upload) — powers the
// store and employee dropdowns so they stay complete on both tabs.
function allSurveysForFilters(){
  const out = (DATA && DATA.surveys) ? DATA.surveys.slice() : [];
  if(MTD && Array.isArray(MTD.surveys)) out.push(...MTD.surveys);
  return out;
}

function npsbadgeHtml(val, label){
  const cls = val > 0 ? "good" : val < 0 ? "bad" : "zero";
  const sign = val > 0 ? "+" : "";
  return '<span class="npsbadge ' + cls + '">' + label + ' ' + sign + val + '</span>';
}

let lastRenderedKeys = [];

function storeKeyOf(s){ return s.storeKey || ("⚠ Unmatched: " + (s.storeRaw || "?")); }
function groupBy(list, keyFn){
  const g = {};
  list.forEach(s => { const k = keyFn(s); (g[k] = g[k] || []).push(s); });
  return g;
}

function render(){
  if(!DATA || !DIR) return;
  const storeF = document.getElementById("storeFilter").value;
  const dmF    = document.getElementById("dmFilter").value;
  const empF   = document.getElementById("empFilter").value;

  const scope = currentSurveys();

  // scope caption
  const noteEl = document.getElementById("scopenote");
  if(tab === "mtd"){
    if(MTD){
      const range = (MTD.window && MTD.window.startYMD)
        ? npsPrettyDate(MTD.window.startYMD) + " – " + npsPrettyDate(MTD.window.endYMD) : "";
      const scored = MTD.employees ? Object.keys(MTD.employees).filter(k => MTD.employees[k].officialTnps != null).length : 0;
      noteEl.textContent = "Month to date" +
        (MTD.period ? " — " + MTD.period + " (Express scores)" : "") +
        (range ? " · responses " + range : "") +
        (scored ? " · " + scored + " reps scored from Express" : "");
    } else {
      const fw = npsFiscalWindow();
      noteEl.textContent = "Fiscal month to date (22nd–21st): " +
        npsPrettyDate(fw.startYMD) + " – " + npsPrettyDate(fw.endYMD) +
        " · awaiting MTD upload — showing daily history";
    }
  } else {
    noteEl.textContent = "Latest uploaded batch" + (DATA.lastBatchDate ? " · " + npsPrettyDate(DATA.lastBatchDate) : "");
  }

  // employee scorecard = true totals for the selected rep this tab (ignores chips)
  renderScorecard(empF, scope);

  // baseList = scope narrowed by store / employee / DM (NOT band chips) — this
  // drives all the SCORES so a store's tNPS never changes when you toggle a chip.
  let baseList = scope.slice();
  if(storeF) baseList = baseList.filter(s => s.storeKey === storeF);
  if(empF)   baseList = baseList.filter(s => (s.ntid || "") === empF);
  if(dmF)    baseList = baseList.filter(s => {
    const dm = (DIR.storeDMs || {})[(s.storeKey || "") + " Xfinity Store"] || "";
    return dm.toLowerCase() === dmF.toLowerCase();
  });
  // displayList = baseList narrowed by band chips — controls which cards show.
  const displayList = baseList.filter(s => bands[npsBucket(s.score)]);

  // ---- summary scoreboard (full scope, independent of band chips) ----
  const good = baseList.filter(s => npsBucket(s.score) === "good").length;
  const ok   = baseList.filter(s => npsBucket(s.score) === "ok").length;
  const bad  = baseList.filter(s => npsBucket(s.score) === "bad").length;
  const withComments = baseList.filter(s => s.comment).length;
  const t = tnps(baseList);
  document.getElementById("summary").innerHTML =
    sumCard("Surveys", baseList.length, "") +
    sumCard("tNPS", baseList.length ? (t > 0 ? "+" : "") + t : "0", t >= 0 ? "good" : "bad") +
    sumCard("Good (9–10)", good, "good") +
    sumCard("OK (8)", ok, "ok") +
    sumCard("Needs Attn (0–7)", bad, "bad") +
    sumCard("With Comments", withComments, "");

  // ---- group by store: scores from baseGroups, cards from displayGroups ----
  const baseGroups    = groupBy(baseList, storeKeyOf);
  const displayGroups = groupBy(displayList, storeKeyOf);
  const keys = Object.keys(displayGroups).sort((a,b) => a.localeCompare(b)); // ALPHABETICAL
  lastRenderedKeys = keys.slice();

  const forceOpen = !!(storeF || empF || dmF);

  const out = keys.map((k, _idx) => {
    const fullKey = k + " Xfinity Store";
    const sm = (DIR.storeManagerNames || {})[fullKey] || "";
    const dm = dmShort((DIR.storeDMs || {})[fullKey] || "");
    const baseG = baseGroups[k] || [];
    const showG = displayGroups[k] || [];
    const storeTnps = tnps(baseG);
    const isOpen = forceOpen || expanded.has(k);

    // rep score lookup (from the full per-store set, not band-filtered)
    const baseByRep = groupBy(baseG, s => s.ntid || "Unknown");
    // rep groups that actually have visible cards, sorted by employee name
    const showByRep = groupBy(showG, s => s.ntid || "Unknown");
    const repKeys = Object.keys(showByRep).sort((a,b) => repDisplay(a).localeCompare(repDisplay(b)));
    const repHtml = repKeys.map(rk => {
      const rsBase = baseByRep[rk] || [];
      const rsShow = showByRep[rk].slice().sort((a,b) => a.score - b.score);
      const rgd = rsBase.filter(s => npsBucket(s.score) === "good").length;
      const rok = rsBase.filter(s => npsBucket(s.score) === "ok").length;
      const rbd = rsBase.filter(s => npsBucket(s.score) === "bad").length;
      const rt  = tnps(rsBase);
      const surveys = rsShow.map(surveyCard).join("");
      const name = repDisplay(rk);
      const ntidTag = (name !== rk) ? '<span class="rntid">' + npsEsc(rk) + '</span>' : '';
      const off = officialFor(rk);
      let rright;
      if(off){
        rright = npsbadgeHtml(off.officialTnps, "Official tNPS") +
          '<span class="rcounts">' + off.records + ' recs (Express)' +
          (off.issueResolved != null ? ' · ' + off.issueResolved + '% resolved' : '') +
          ' · ' + rgd + '/' + rok + '/' + rbd + ' here</span>';
      } else {
        rright = npsbadgeHtml(rt, "tNPS") +
          '<span class="rcounts">' + rgd + ' good · ' + rok + ' ok · ' + rbd + ' bad</span>';
      }
      return '<div class="repgroup"><div class="rephead">' +
        '<span class="rname">' + npsEsc(name) + '</span>' + ntidTag +
        '<span class="rright">' + rright +
        '</span></div><div class="repsurveys">' + surveys + '</div></div>';
    }).join("");

    const scopeTag = tab === "mtd" ? "MTD tNPS" : "tNPS";
    return '<div class="storeblock' + (isOpen ? ' open' : '') + '">' +
      '<div class="storehead" onclick="toggleStoreByIdx(' + _idx + ')">' +
        '<span class="chev">&#9654;</span>' +
        '<h2>' + npsEsc(k) + '</h2>' +
        '<span class="sub">' + (sm ? "SM: " + npsEsc(sm) : "") + (dm ? " · DM: " + npsEsc(dm) : "") + '</span>' +
        '<span class="right">' +
          npsbadgeHtml(storeTnps, scopeTag) +
          '<span class="counts">' + baseG.length + ' survey' + (baseG.length === 1 ? "" : "s") + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="storebody">' + repHtml + '</div>' +
    '</div>';
  }).join("");

  document.getElementById("results").innerHTML = out ||
    '<div class="empty">No surveys match the current filters' + (tab === "yesterday" ? " in the latest batch." : " this month.") + '</div>';
}

function surveyCard(s){
  const meta = [s.txnType, npsPrettyDate(s.txnDate)].filter(Boolean).map(npsEsc).join(" · ");
  const c = s.comment
    ? '<div class="comment">“' + npsEsc(s.comment) + '”</div>'
    : '<div class="comment none">No comment left</div>';
  return '<div class="survey ' + npsBucket(s.score) + '"><div class="score">' + s.score + '</div>' +
    '<div><div class="meta">' + (meta || "&nbsp;") + '</div>' + c + '</div></div>';
}

function renderScorecard(empF, scope){
  const host = document.getElementById("scorecard");
  if(!empF){ host.innerHTML = ""; return; }
  const mine = scope.filter(s => (s.ntid || "") === empF);
  const name = repDisplay(empF);
  const gd = mine.filter(s => npsBucket(s.score) === "good").length;
  const ok = mine.filter(s => npsBucket(s.score) === "ok").length;
  const bd = mine.filter(s => npsBucket(s.score) === "bad").length;
  const t  = tnps(mine);
  const comments = mine.filter(s => s.comment).length;
  // stores this rep was surveyed at
  const stores = Array.from(new Set(mine.map(s => s.storeKey).filter(Boolean))).sort();
  const scopeLabel = tab === "yesterday" ? "Latest batch" : "Month to date";
  const off = officialFor(empF);

  // Headline number = official Express tNPS on the MTD tab when available,
  // otherwise the tNPS computed from the surveys in view.
  const headVal = off ? off.officialTnps : t;
  const headLbl = off ? "Official tNPS · Express" : "tNPS";

  const extraTiles = off
    ? '<div><div class="mini">' + off.records + '</div><div class="minilbl">Express recs</div></div>' +
      (off.issueResolved != null ? '<div><div class="mini">' + off.issueResolved + '%</div><div class="minilbl">Issue resolved</div></div>' : '') +
      (off.waitPct != null ? '<div><div class="mini">' + off.waitPct + '%</div><div class="minilbl">≤10 min wait</div></div>' : '')
    : '';

  host.innerHTML =
    '<div class="scorecard">' +
      '<div style="display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px;">' +
        '<div><div class="who">' + npsEsc(name) + (name !== empF ? ' <span style="font-size:12px;color:#bdb4a6;font-weight:600;">' + npsEsc(empF) + '</span>' : '') + '</div>' +
        '<div class="whosub">' + scopeLabel + ' · ' + (stores.length ? npsEsc(stores.join(", ")) : "—") + '</div></div>' +
        '<button class="clear" onclick="clearEmp()">Clear employee ✕</button>' +
      '</div>' +
      '<div class="scrow">' +
        '<div><div class="big" style="color:' + (headVal >= 0 ? "#7ed8a0" : "#f49a92") + ';">' + (headVal > 0 ? "+" : "") + headVal + '</div><div class="biglbl">' + headLbl + '</div></div>' +
        extraTiles +
        '<div><div class="mini">' + mine.length + '</div><div class="minilbl">Responses' + (off ? " here" : "") + '</div></div>' +
        '<div><div class="mini" style="color:#7ed8a0;">' + gd + '</div><div class="minilbl">Good 9–10</div></div>' +
        '<div><div class="mini" style="color:#f0c46b;">' + ok + '</div><div class="minilbl">OK 8</div></div>' +
        '<div><div class="mini" style="color:#f49a92;">' + bd + '</div><div class="minilbl">Needs Attn 0–7</div></div>' +
        '<div><div class="mini">' + comments + '</div><div class="minilbl">Comments</div></div>' +
      '</div>' +
    '</div>';
}
function clearEmp(){
  document.getElementById("empFilter").value = "";
  render();
}

function sumCard(lbl, val, cls){
  return '<div class="sumcard ' + cls + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div></div>';
}

function buildStoreFilter(){
  const cur = document.getElementById("storeFilter").value;
  const stores = Array.from(new Set(allSurveysForFilters().map(s => s.storeKey).filter(Boolean))).sort();
  document.getElementById("storeFilter").innerHTML = '<option value="">All Stores</option>' +
    stores.map(s => '<option' + (s === cur ? " selected" : "") + '>' + npsEsc(s) + '</option>').join("");
}
function buildEmployeeFilter(){
  // Distinct employees across daily history + MTD upload, labelled by name (ntid).
  const seen = {};
  allSurveysForFilters().forEach(s => {
    const id = s.ntid || "";
    if(!id) return;
    if(!seen[id]) seen[id] = repDisplay(id);
  });
  const opts = Object.keys(seen).sort((a,b) => seen[a].localeCompare(seen[b]));
  const cur = document.getElementById("empFilter").value;
  document.getElementById("empFilter").innerHTML =
    '<option value="">All Employees</option>' +
    opts.map(id => {
      const label = (seen[id] !== id) ? seen[id] + " (" + id + ")" : id;
      return '<option value="' + npsEsc(id) + '"' + (id === cur ? " selected" : "") + '>' + npsEsc(label) + '</option>';
    }).join("");
}

async function init(){
  try {
    const [dataR, dirR] = await Promise.all([
      fetch(NPS_CONFIG.RESPONSES_URL + "?t=" + Date.now(), { cache: "no-store" }),
      fetch(NPS_CONFIG.DIRECTORY_URL + "?t=" + Date.now(), { cache: "no-store" })
    ]);
    if(!dirR.ok) throw new Error("store-directory.json HTTP " + dirR.status);
    DIR = await dirR.json();
    if(!dataR.ok){
      document.getElementById("results").innerHTML = '<div class="empty">No NPS data yet — upload your first tNPS Responses export on the <a href="https://blufoxmobile.github.io/Daily-Sales-Report/upload.html" style="color:#b45309;font-weight:600;">Daily Upload page</a>.</div>';
      document.getElementById("updatedAt").textContent = "Waiting for first upload";
      return;
    }
    DATA = await dataR.json();

    // Store filter (alphabetical)
    buildStoreFilter();
    // DM filter
    const dms = Array.from(new Set(Object.values(DIR.storeDMs || {}))).sort();
    document.getElementById("dmFilter").innerHTML = '<option value="">All DMs</option>' +
      dms.map(d => '<option value="' + npsEsc(d) + '">' + npsEsc(dmShort(d)) + '</option>').join("");
    // Employee filter (NTIDs first; names fill in after Rep Rank loads)
    buildEmployeeFilter();

    const upd = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
    document.getElementById("updatedAt").textContent =
      "Last upload: " + (upd ? upd.toLocaleString() : "unknown") +
      " · Latest batch: " + (DATA.lastBatchIds || []).length + " new surveys (" + (DATA.lastBatchDate || "") + ")";
    document.getElementById("src").innerHTML = "Read-only view · Source: nps-responses.json · store-directory.json · nps-mtd.json (Daily-Sales-Report repo)";

    render();

    // Resolve employee names from Rep Rank, then refresh labels + re-render.
    npsFetchReps().then(() => { _clearNameCache(); buildEmployeeFilter(); render(); });

    // Month-to-date NPS upload (optional — never blocks the page). Complete
    // fiscal-month surveys + scores from one source.
    fetch(NPS_CONFIG.MTD_SCORES_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(j => { if(j){ MTD = j; buildStoreFilter(); buildEmployeeFilter(); render(); } })
      .catch(() => {});
  } catch(e){
    document.getElementById("results").innerHTML = '<div class="empty">❌ ' + npsEsc(e.message) + '</div>';
  }
}
function _clearNameCache(){ for(const k in _repNameCache) delete _repNameCache[k]; }
init();
</script>
