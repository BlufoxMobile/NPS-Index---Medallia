<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The NPS Index &middot; Blufox Mobile</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================================
   NPS INDEX — visual system
   Shares the Cook County Cooks language: near-black ground, brass hairlines,
   Bodoni Moda display over Archivo text. Tokens below are lifted from
   cookcountycooks.com/assets/theme.css so the two pages read as one building.
   Signal colours reuse the site's own LCD / amber / alert, not stock chart RGB.
   ========================================================================= */
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..700;1,62..125,300..700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&display=swap');

:root{
  /* --- ground ------------------------------------------------------------ */
  --ink-950:#05070a; --ink-900:#090d13; --ink-850:#0d131b; --ink-800:#131a24;
  --ink-700:#1b2430; --ink-600:#26313f; --steel:#3a4653;
  --walnut:#4b3526;  --brick:#8a5238;   --slate:#1d3b52;
  /* --- brass ------------------------------------------------------------- */
  --brass-700:#8a6323; --brass-600:#a87c2e; --brass:#c8973f;
  --brass-400:#ddb463; --brass-300:#ebce93; --amber:#f7b955; --ember:#ff9e4a;
  /* --- bone -------------------------------------------------------------- */
  --bone:#f4efe6; --bone-2:#dcd5c8; --bone-3:#b4aba0;
  /* --- signal (the site's own three) ------------------------------------- */
  --lcd:#8ef0d0; --alert:#ff6f57;
  --pos:var(--lcd); --pos-deep:#2f7d63;
  --mid:var(--amber); --mid-deep:#8a6323;
  --neg:var(--alert); --neg-deep:#8f3225;

  --bg:var(--ink-950); --fg:var(--bone); --fg-muted:var(--bone-2); --fg-dim:var(--bone-3);
  --accent:var(--brass); --accent-lit:var(--brass-300); --accent-deep:var(--brass-700);
  --surface:      color-mix(in oklab, var(--ink-800) 90%, var(--walnut) 10%);
  --surface-2:    color-mix(in oklab, var(--ink-700) 90%, var(--walnut) 10%);
  --surface-glass:color-mix(in oklab, var(--ink-900) 72%, transparent);
  --line:     color-mix(in oklab, var(--brass) 30%, transparent);
  --line-soft:color-mix(in oklab, var(--bone) 40%, transparent);
  --line-hair:color-mix(in oklab, var(--bone) 8%, transparent);
  --shade:3 5 9;

  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem; --sp-5:1.5rem;
  --sp-6:2rem;   --sp-7:2.75rem; --sp-8:3.75rem; --sp-9:5rem;
  --gut:clamp(1.1rem, .55rem + 2.6vw, 3.25rem);

  --r-xs:2px; --r-sm:3px; --r-md:6px; --r-lg:10px; --r-pill:999px;
  --shadow-1:0 1px 2px rgb(var(--shade)/.55), 0 2px 8px rgb(var(--shade)/.35);
  --shadow-2:0 6px 14px -4px rgb(var(--shade)/.6), 0 18px 44px -12px rgb(var(--shade)/.62);
  --shadow-3:0 30px 90px -18px rgb(var(--shade)/.8), 0 4px 18px -6px rgb(var(--shade)/.6);
  --shadow-text:0 1px 0 rgb(var(--shade)/.55), 0 2px 20px rgb(var(--shade)/.78);
  --ring-brass:0 0 0 1px color-mix(in oklab, var(--brass) 62%, transparent),
               0 0 26px -6px color-mix(in oklab, var(--amber) 55%, transparent);

  --ease-cine:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,.61,.24,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1); --ease-bite:cubic-bezier(.34,1.36,.44,1);
  --dur-1:110ms; --dur-2:190ms; --dur-3:320ms; --dur-4:520ms; --dur-5:820ms;

  --t--2:clamp(.6875rem,.665rem + .11vw,.75rem);
  --t--1:clamp(.8125rem,.777rem + .18vw,.9375rem);
  --t-0: clamp(1rem,.955rem + .22vw,1.125rem);
  --t-1: clamp(1.1875rem,1.11rem + .38vw,1.4375rem);
  --t-2: clamp(1.4375rem,1.29rem + .73vw,1.9375rem);
  --t-3: clamp(1.75rem,1.48rem + 1.35vw,2.75rem);
  --t-4: clamp(2.125rem,1.63rem + 2.47vw,3.875rem);
  --t-5: clamp(2.625rem,1.79rem + 4.18vw,5.375rem);
  --track-5:-.034em; --track-4:-.026em; --track-3:-.018em; --track-2:-.012em;
  --track-1:-.006em; --track-body:.002em; --track-small:.008em;
  --track-caps:.165em; --track-title:.34em;
  --lh-solid:.92; --lh-tight:1.04; --lh-snug:1.18; --lh-lead:1.38; --lh-body:1.62;

  --font-display:"Bodoni Moda",Didot,"Bodoni MT","Playfair Display","Times New Roman",Times,serif;
  --font-text:"Archivo",ui-sans-serif,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --bar-h:clamp(56px,3.4rem + 1vw,72px);
  color-scheme:dark; accent-color:var(--brass);
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + var(--sp-5))}
body{
  min-height:100svh; overflow-x:clip;
  background:var(--bg); color:var(--fg);
  font-family:var(--font-text); font-size:var(--t-0); font-weight:400;
  line-height:var(--lh-body); letter-spacing:var(--track-body);
  font-variant-numeric:tabular-nums;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  /* one fixed warm pool from the top edge — the room is lit from the pass */
  background-image:radial-gradient(120% 78% at 50% 0%,
      color-mix(in oklab, var(--walnut) 20%, transparent) 0%, transparent 62%);
  background-attachment:fixed;
}
svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in oklab, var(--brass) 55%, transparent);color:var(--ink-950)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in oklab,var(--brass) 45%,transparent) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--brass) 40%,transparent);
  border-radius:var(--r-pill);border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:3px solid var(--brass-300);outline-offset:2px;
  box-shadow:0 0 0 6px rgb(var(--shade)/.9);border-radius:var(--r-xs)}
:focus:not(:focus-visible){outline:none}
[hidden]{display:none !important}

/* ---------- type primitives ---------- */
.kicker{
  font-family:var(--font-text); font-size:var(--t--2); font-weight:600;
  font-stretch:84%; text-transform:uppercase; letter-spacing:var(--track-title);
  line-height:1; color:var(--accent-lit); margin-inline-end:calc(-1 * var(--track-title));
  text-shadow:0 1px 14px rgb(var(--shade)/.8);
}
.caps{
  font-family:var(--font-text); font-size:var(--t--2); font-weight:600;
  font-stretch:90%; text-transform:uppercase; letter-spacing:var(--track-caps);
  line-height:1; margin-inline-end:calc(-1 * var(--track-caps));
}
.micro{font-size:var(--t--1);line-height:1.45;letter-spacing:var(--track-small);color:var(--fg-dim)}
.sr-only:not(:focus):not(:active){position:absolute!important;width:1px;height:1px;padding:0;
  margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:fixed;top:var(--sp-2);left:var(--sp-2);z-index:999;
  display:inline-flex;align-items:center;min-height:44px;
  padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);
  background:var(--brass);color:var(--ink-950);font-size:var(--t--2);font-weight:700;
  text-transform:uppercase;letter-spacing:var(--track-caps);
  transform:translateY(calc(-100% - var(--sp-6)));
  transition:transform var(--dur-2) var(--ease-bite)}
.skip:focus-visible{transform:none}
#results:focus{outline:none}

.wrap{width:min(1360px,100%);margin-inline:auto;padding-inline:var(--gut)}

/* ============================ MASTHEAD ============================ */
.masthead{position:relative;padding:clamp(2.25rem,1.2rem + 4.2vw,4.75rem) 0 var(--sp-6)}
.masthead::after{content:"";position:absolute;inset-inline:var(--gut);bottom:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,
    color-mix(in oklab,var(--brass) 52%,transparent) 3%,
    color-mix(in oklab,var(--brass) 52%,transparent) 72%, transparent 100%)}
.mast-row{display:flex;align-items:flex-end;gap:var(--sp-6);flex-wrap:wrap}
.mast-id{flex:1 1 22ch;min-width:0}
.mast-title{display:grid;gap:0;margin-top:var(--sp-4)}
.mast-title > span{
  display:block; font-family:var(--font-display); font-optical-sizing:none;
  font-size:var(--t-5); line-height:var(--lh-solid); letter-spacing:var(--track-5);
  text-shadow:var(--shadow-text);
}
.mast-title > span:nth-child(1){font-weight:430;font-variation-settings:"opsz" 52,"wght" 430}
.mast-title > span:nth-child(2){font-weight:430;font-variation-settings:"opsz" 52,"wght" 430;
  font-style:italic;color:var(--accent-lit);margin-inline-start:.14em}
.mast-title > span:nth-child(3){font-size:var(--t-1);font-weight:640;
  font-variation-settings:"opsz" 22,"wght" 640;line-height:1.6;
  margin-inline-start:.3em;letter-spacing:var(--track-1);
  color:color-mix(in oklab,var(--brass) 72%,var(--bone-3))}
.mast-sub{margin-top:var(--sp-4);color:var(--fg-dim);max-width:52ch;text-wrap:pretty}
.mast-sub b{color:var(--fg-muted);font-weight:600}

/* the standing ledger on the right of the masthead */
.mast-meta{flex:0 1 auto;display:grid;gap:var(--sp-3);min-width:min(100%,15rem);
  padding-left:var(--sp-5);border-left:1px solid var(--line-hair)}
.mast-meta .caps{color:var(--fg-dim)}
.mast-meta .v{font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 22,"wght" 540;font-size:var(--t-1);
  letter-spacing:var(--track-1);line-height:1.1;color:var(--fg)}

/* ============================ CONTROL BAR ============================ */
.bar{
  position:sticky; top:0; z-index:60;
  margin-top:var(--sp-5);
  background:linear-gradient(to bottom,
    color-mix(in oklab,var(--ink-950) 97%,transparent) 0%,
    color-mix(in oklab,var(--ink-950) 94%,transparent) 100%);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);
  backdrop-filter:blur(18px) saturate(1.35);
}
.bar::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,
    color-mix(in oklab,var(--brass) 42%,transparent) 8%,
    color-mix(in oklab,var(--brass) 42%,transparent) 78%, transparent 100%)}
.bar-in{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  min-height:var(--bar-h);padding-block:var(--sp-3)}
.bar-gap{flex:1 1 var(--sp-4)}

/* segmented period control */
.seg{display:inline-flex;padding:2px;border-radius:var(--r-sm);
  background:color-mix(in oklab,var(--ink-900) 70%,transparent);
  box-shadow:inset 0 0 0 1px var(--line-soft)}
.seg button{
  min-height:38px;padding-inline:var(--sp-4);border-radius:var(--r-xs);color:var(--fg-dim);
  font-size:var(--t--2);font-weight:600;font-stretch:90%;text-transform:uppercase;
  letter-spacing:var(--track-caps);line-height:1;white-space:nowrap;
  transition:color var(--dur-2) var(--ease-out),background var(--dur-2) var(--ease-out);
}
.seg button:hover{color:var(--fg);background:color-mix(in oklab,var(--bone) 7%,transparent)}
.seg button[aria-pressed="true"]{color:var(--ink-950);
  background:linear-gradient(180deg,var(--brass-300),var(--brass));
  box-shadow:0 1px 0 rgb(var(--shade)/.5)}

/* selects */
.field{position:relative;display:inline-flex;align-items:center}
.field::after{content:"";position:absolute;right:12px;width:7px;height:7px;
  border-right:1.5px solid var(--brass);border-bottom:1.5px solid var(--brass);
  transform:translateY(-2px) rotate(45deg);pointer-events:none;
  transition:transform var(--dur-2) var(--ease-out)}
.field:hover::after{transform:translateY(0) rotate(45deg)}
.field select{
  appearance:none;-webkit-appearance:none;
  min-height:40px;padding:0 var(--sp-7) 0 var(--sp-3);
  border:0;border-radius:var(--r-xs);cursor:pointer;
  color:var(--fg);background:color-mix(in oklab,var(--ink-900) 62%,transparent);
  box-shadow:inset 0 0 0 1px var(--line-soft);
  font-size:var(--t--2);font-weight:600;font-stretch:90%;text-transform:uppercase;
  letter-spacing:var(--track-caps);line-height:1;
  transition:box-shadow var(--dur-2) var(--ease-out),background var(--dur-2) var(--ease-out);
}
.field select:hover{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--brass) 55%,transparent)}
.field select option{background:var(--ink-850);color:var(--fg);
  text-transform:none;letter-spacing:0;font-weight:400}

/* band chips */
.chips{display:inline-flex;gap:var(--sp-2);flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:var(--sp-2);
  min-height:40px;padding-inline:var(--sp-3);border-radius:var(--r-xs);
  color:var(--fg-dim);background:color-mix(in oklab,var(--ink-900) 55%,transparent);
  box-shadow:inset 0 0 0 1px var(--line-hair);
  -webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
  font-size:var(--t--2);font-weight:600;font-stretch:90%;text-transform:uppercase;
  letter-spacing:var(--track-caps);line-height:1;white-space:nowrap;
  transition:color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out),
             background var(--dur-2) var(--ease-out),opacity var(--dur-2) var(--ease-out);
}
.chip .dot{width:6px;height:6px;flex:none;border-radius:50%;background:currentColor;
  transition:box-shadow var(--dur-2) var(--ease-out)}
.chip.good[aria-pressed="true"]{color:var(--pos);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--pos) 42%,transparent)}
.chip.neutral[aria-pressed="true"]{color:var(--mid);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--mid) 42%,transparent)}
.chip.bad[aria-pressed="true"]{color:var(--neg);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--neg) 42%,transparent)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 9px 1px currentColor}
.chip[aria-pressed="false"]{opacity:1;color:var(--fg-dim);
  box-shadow:inset 0 0 0 1px var(--line-hair)}
.chip[aria-pressed="false"] .dot{opacity:.5;box-shadow:none}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]:hover{filter:brightness(1.12)}

/* text buttons */
.tbtn{
  min-height:40px;padding-inline:var(--sp-3);border-radius:var(--r-xs);color:var(--fg-dim);
  font-size:var(--t--2);font-weight:600;font-stretch:90%;text-transform:uppercase;
  letter-spacing:var(--track-caps);line-height:1;white-space:nowrap;
  transition:color var(--dur-2) var(--ease-out),background var(--dur-2) var(--ease-out);
}
.tbtn:hover{color:var(--fg);background:color-mix(in oklab,var(--bone) 7%,transparent)}

/* ============================ BANNER ============================ */
.banner{display:none;margin:var(--sp-5) 0 0;padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-sm);font-size:var(--t--1);line-height:1.5;
  box-shadow:inset 0 0 0 1px var(--line-hair)}
.banner.info,.banner.success,.banner.error{display:block}
.banner.info{color:var(--brass-300);background:color-mix(in oklab,var(--brass) 12%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--brass) 34%,transparent)}
.banner.success{color:var(--pos);background:color-mix(in oklab,var(--pos) 10%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--pos) 32%,transparent)}
.banner.error{color:var(--neg);background:color-mix(in oklab,var(--neg) 11%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--neg) 36%,transparent)}

/* ============================ KPI LEDGER ============================ */
/* Not cards. A ruled ledger strip — hairline columns, Bodoni numerals. */
.kpis{display:grid;gap:1px;margin-top:var(--sp-6);
  grid-template-columns:repeat(auto-fit,minmax(clamp(8rem,11.2vw,10.5rem),1fr));
  background:var(--line-hair);                    /* the 1px gaps ARE the rules */
  box-shadow:inset 0 1px 0 var(--line-hair),inset 0 -1px 0 var(--line-hair)}
.kpi{position:relative;padding:var(--sp-4);background:var(--bg)}
.kpi::before{content:"";position:absolute;left:0;top:var(--sp-4);bottom:var(--sp-4);
  width:2px;background:transparent;transition:background var(--dur-3) var(--ease-out)}
.kpi .lbl{display:flex;align-items:flex-start;min-height:2.1em;
  font-size:var(--t--2);font-weight:600;font-stretch:90%;text-transform:uppercase;
  letter-spacing:var(--track-caps);line-height:1.05;
  color:var(--fg-dim);margin-inline-end:calc(-1 * var(--track-caps))}
.kpi .val{display:block;margin-top:var(--sp-3);
  font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 30,"wght" 520;font-size:var(--t-3);
  line-height:var(--lh-solid);letter-spacing:var(--track-3);color:var(--fg)}
.kpi .sub{display:block;margin-top:var(--sp-2);font-size:var(--t--1);
  line-height:1.4;color:var(--fg-dim)}
.kpi.k-good .val{color:var(--pos)}
.kpi.k-neutral .val{color:var(--mid)}
.kpi.k-bad .val{color:var(--neg)}
.kpi.k-nps .val{color:var(--brass-300);font-size:var(--t-4);
  font-variation-settings:"opsz" 40,"wght" 520}
.kpi.k-goal .val{color:var(--fg-muted)}
.kpi.k-goal::before{background:color-mix(in oklab,var(--brass) 40%,transparent)}
.kpi .val .pct{font-size:.56em;letter-spacing:.02em;vertical-align:.2em;
  color:color-mix(in oklab,currentColor 60%,transparent)}
.kpi.k-good::before{background:color-mix(in oklab,var(--pos) 50%,transparent)}
.kpi.k-neutral::before{background:color-mix(in oklab,var(--mid) 50%,transparent)}
.kpi.k-bad::before{background:color-mix(in oklab,var(--neg) 50%,transparent)}
.kpi.k-nps::before{background:color-mix(in oklab,var(--brass) 60%,transparent)}

/* ============================ SECTION HEAD ============================ */
.section-head{display:flex;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;
  margin:var(--sp-8) 0 var(--sp-4)}
.section-head h2{flex:1 1 auto;font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 30,"wght" 500;font-size:var(--t-2);
  line-height:var(--lh-tight);letter-spacing:var(--track-2);font-weight:500}
.section-head .bulk{display:flex;gap:var(--sp-1)}

/* ============================ THE LEDGER (districts) ============================ */
#results{margin-bottom:var(--sp-9)}
.district{position:relative}
.district::before{content:"";position:absolute;inset-inline:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--brass) 30%,transparent) 0%,
    color-mix(in oklab,var(--bone) 9%,transparent) 34%, transparent 100%)}
.district:last-child{box-shadow:inset 0 -1px 0 var(--line-hair)}
.district-head.low-n .rank{color:var(--fg-dim)}
.district-head.low-n .nps-badge{opacity:.7}
.district-head.low-n .dmeta::after{content:" · thin sample";color:var(--mid);font-weight:600}
.district[data-unmatched] .dname{font-family:var(--font-text);font-size:var(--t-0);
  font-weight:600;font-stretch:90%;text-transform:uppercase;letter-spacing:var(--track-caps);
  color:var(--mid)}
.district[data-unmatched]{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--mid) 26%,transparent)}
.district.open{background:linear-gradient(to bottom,
  color-mix(in oklab,var(--brass) 5%,transparent) 0%, transparent 220px)}
.store.open > .store-head .name,.rep.open > .rep-head .name{color:var(--brass-300)}
.district.open > .district-head .dname{color:var(--brass-300)}

.district-head{
  display:grid;width:100%;text-align:left;align-items:center;
  grid-template-columns:auto auto minmax(22ch,38ch) 1fr auto auto auto;
  gap:var(--sp-3) var(--sp-5);
  padding:var(--sp-5) var(--sp-2) var(--sp-5) var(--sp-3);
  transition:background var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
}
.district-head:hover,.district-head:focus-visible{
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--brass) 13%,transparent) 0%,
    color-mix(in oklab,var(--brass) 5%,transparent) 42%, transparent 88%);
  box-shadow:inset 3px 0 0 var(--brass)}
.district-head:hover .rank{color:var(--ink-950);
  background:linear-gradient(180deg,var(--brass-300),var(--brass));
  border-radius:var(--r-xs);padding:2px 5px;margin:-2px -5px}
.district-head .rank{
  font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 12,"wght" 600;font-size:var(--t--1);
  letter-spacing:0;color:var(--brass-600);min-width:1.6em;text-align:right}
.district-head:hover .rank{color:var(--brass)}
.dname{font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 30,"wght" 540;font-size:var(--t-2);
  line-height:var(--lh-tight);letter-spacing:var(--track-2);color:var(--fg)}
.district-id{min-width:0;max-width:38ch}
.dname{overflow-wrap:anywhere}
.dmeta{margin-top:var(--sp-1);font-size:var(--t--1);line-height:1.4;color:var(--fg-dim)}
/* the row's dead centre now carries the sharpest thing a customer said today */
.peek{min-width:0;font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 14,"wght" 420;font-size:var(--t--1);font-style:italic;
  line-height:1.4;letter-spacing:0;text-align:left;
  color:color-mix(in oklab,var(--bone-3) 72%,transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color var(--dur-2) var(--ease-out)}
.district-head:hover .peek{color:var(--fg-muted)}
.dmeta .dm{color:var(--brass-300);font-weight:600}

/* the meter — a hairline bar, never a rounded progress pill */
.meter{position:relative;width:clamp(96px,13vw,200px);height:2px;
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--neg) 15%,transparent) 0%,
    color-mix(in oklab,var(--bone) 11%,transparent) 50%,
    color-mix(in oklab,var(--pos) 15%,transparent) 100%)}
/* the goal. 80 on a -100..+100 rail sits at 90%. */
.meter::after{content:"";position:absolute;left:90%;top:-6px;width:1px;height:14px;
  background:color-mix(in oklab,var(--brass-300) 62%,transparent);
  box-shadow:0 0 8px -2px var(--amber)}
.meter span{position:absolute;inset-block:0;left:50%;height:2px;width:var(--w,0%);
  transition:width var(--dur-5) var(--ease-cine)}
.meter span.pos{background:linear-gradient(90deg,color-mix(in oklab,var(--pos) 45%,transparent),var(--pos));
  box-shadow:0 0 10px -1px color-mix(in oklab,var(--pos) 70%,transparent)}
.meter span.mid{background:linear-gradient(90deg,color-mix(in oklab,var(--mid) 45%,transparent),var(--mid));
  box-shadow:0 0 10px -1px color-mix(in oklab,var(--mid) 70%,transparent)}
.meter span.neg{right:50%;left:auto;
  background:linear-gradient(270deg,color-mix(in oklab,var(--neg) 45%,transparent),var(--neg));
  box-shadow:0 0 10px -1px color-mix(in oklab,var(--neg) 70%,transparent)}
.meter::before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:10px;
  background:color-mix(in oklab,var(--brass) 68%,transparent)}
/* an end-cap so a small value still reads as a measurement, not a smudge */
.meter span::after{content:"";position:absolute;right:-1px;top:-3px;width:2px;height:8px;
  background:currentColor}
.meter span.neg::after{right:auto;left:-1px}
.meter span.pos{color:var(--pos)}.meter span.mid{color:var(--mid)}.meter span.neg{color:var(--neg)}

/* ============================ STORE / REP ============================ */
.stores{position:relative;padding:0 0 var(--sp-6) clamp(var(--sp-3),2.2vw,var(--sp-6))}
.stores,.reps,.buckets{padding-inline-end:6px}
.stores::before,.reps::before{content:"";position:absolute;left:0;top:0;bottom:var(--sp-5);width:1px;
  background:linear-gradient(to bottom,color-mix(in oklab,var(--brass) 34%,transparent) 0%,
    color-mix(in oklab,var(--brass) 10%,transparent) 55%,transparent 100%)}
.store{position:relative}
.store::before{content:"";position:absolute;inset-inline:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--brass) 18%,transparent) 0%,
    color-mix(in oklab,var(--bone) 7%,transparent) 30%, transparent 92%)}
.store-head{
  display:grid;width:100%;text-align:left;align-items:center;
  grid-template-columns:auto 1fr auto auto;gap:var(--sp-3) var(--sp-4);
  padding:var(--sp-4) var(--sp-2) var(--sp-4) var(--sp-3);
  transition:background var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
}
.store-head:hover,.store-head:focus-visible{
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--brass) 10%,transparent) 0%,
    color-mix(in oklab,var(--brass) 4%,transparent) 40%, transparent 84%);
  box-shadow:inset 2px 0 0 color-mix(in oklab,var(--brass) 76%,transparent)}
.store-id{min-width:0}
.store-id .name{font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 24,"wght" 540;font-size:var(--t-1);
  line-height:var(--lh-snug);letter-spacing:var(--track-1);color:var(--fg)}
.store-id .meta{margin-top:2px;font-size:var(--t--1);line-height:1.4;color:var(--fg-dim)}
.store-id .meta .scope{margin-inline-start:var(--sp-2);font-size:var(--t--2);
  font-weight:600;font-stretch:88%;text-transform:uppercase;letter-spacing:var(--track-caps);
  margin-inline-end:calc(-1 * var(--track-caps));color:var(--brass-600)}

.reps{position:relative;padding:var(--sp-1) 0 var(--sp-5) clamp(var(--sp-3),2vw,var(--sp-5))}
.rep{position:relative}
.rep::before{content:"";position:absolute;inset-inline:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--bone) 11%,transparent) 0%, transparent 78%)}
.rep-head{
  display:grid;width:100%;text-align:left;align-items:center;
  grid-template-columns:auto 1fr auto;gap:var(--sp-3) var(--sp-4);
  padding:var(--sp-3) var(--sp-2) var(--sp-3) var(--sp-3);
  transition:background var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
}
.rep-head:hover,.rep-head:focus-visible{
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--bone) 7%,transparent) 0%, transparent 72%);
  box-shadow:inset 2px 0 0 color-mix(in oklab,var(--brass) 52%,transparent)}
.rep-id{min-width:0}
.rep-id .name{font-weight:600;font-size:var(--t-0);line-height:1.25;color:var(--fg)}
.rep-id .ntid{margin-left:var(--sp-2);font-size:var(--t--2);font-weight:500;
  letter-spacing:var(--track-small);color:var(--brass-600);font-variant-numeric:tabular-nums}
.rep-id .meta{margin-top:3px;display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.rep-id .meta .tot{font-size:var(--t--1);color:var(--fg-dim)}

/* count minis — bare tinted numerals with a leading bead, no pill chrome */
.minis{display:flex;gap:var(--sp-3);align-items:center}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:var(--t--1);
  font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:var(--track-small)}
.mini::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.mini.g{color:color-mix(in oklab,var(--pos) 82%,var(--bone))}
.mini.n{color:color-mix(in oklab,var(--mid) 86%,var(--bone))}
.mini.b{color:color-mix(in oklab,var(--neg) 86%,var(--bone))}
.rep-id .meta .mini{font-size:var(--t--2);opacity:.9}

/* the score badge — a small brass-ruled plate, Bodoni numeral */
.nps-badge,.rep-hero{
  display:grid;place-items:center;gap:0;min-width:clamp(64px,7.5vw,84px);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
  background:color-mix(in oklab,var(--ink-900) 62%,transparent);
  box-shadow:inset 0 0 0 1px var(--line-hair),inset 0 1px 0 rgb(255 255 255/.04);
  transition:box-shadow var(--dur-3) var(--ease-out)}
.nps-badge .num,.rep-hero .num{
  font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 22,"wght" 560;font-size:var(--t-1);
  line-height:1;letter-spacing:var(--track-1);font-variant-numeric:tabular-nums}
.nps-badge .cap,.rep-hero .cap{margin-top:5px;font-size:var(--t--2);font-weight:600;
  font-stretch:88%;text-transform:uppercase;letter-spacing:var(--track-caps);line-height:1;
  color:var(--fg-dim);margin-inline-end:calc(-1 * var(--track-caps))}
.nps-pos .num,.hero-pos .num{color:var(--pos)}
.nps-mid .num,.hero-mid .num{color:var(--mid)}
.nps-neg .num,.hero-neg .num{color:var(--neg)}
.nps-pos,.hero-pos{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--pos) 30%,transparent)}
.nps-mid,.hero-mid{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--mid) 30%,transparent)}
.nps-neg,.hero-neg{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--neg) 34%,transparent)}
.district-head .nps-badge{min-width:clamp(76px,9vw,100px)}
.district-head .nps-badge .num{font-size:var(--t-2);font-variation-settings:"opsz" 30,"wght" 560}
.rep-hero{min-width:clamp(58px,6.5vw,74px);padding:var(--sp-2)}
.rep-hero .num{font-size:var(--t-0);font-variation-settings:"opsz" 18,"wght" 560}

/* the store's MTD goal pill (JS-rendered — class hook, no inline colour) */
.goal-pill{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:var(--r-xs);
  font-size:var(--t--2);font-weight:600;letter-spacing:var(--track-small);line-height:1.35}
.goal-pill b{font-weight:700}
.goal-pill.neutral{color:var(--fg-dim);box-shadow:inset 0 0 0 1px var(--line-hair)}
.goal-pill.hit{color:var(--pos);background:color-mix(in oklab,var(--pos) 9%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--pos) 30%,transparent)}
.goal-pill.behind{color:var(--mid);background:color-mix(in oklab,var(--mid) 9%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--mid) 30%,transparent)}

/* ============================ BUCKETS / SURVEYS ============================ */
.buckets{padding:var(--sp-2) 0 var(--sp-4) clamp(0px,1.6vw,var(--sp-4));
  display:grid;gap:var(--sp-1)}
.bucket-head{display:flex;width:100%;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-2) var(--sp-2) 0;border-radius:var(--r-xs);
  transition:background var(--dur-2) var(--ease-out)}
.bucket-head:hover{background:color-mix(in oklab,var(--bone) 5%,transparent)}
.bucket-head .swatch{width:3px;height:16px;flex:none;border-radius:1px}
.bucket.good .swatch{background:var(--pos);box-shadow:0 0 8px -1px var(--pos)}
.bucket.neutral .swatch{background:var(--mid);box-shadow:0 0 8px -1px var(--mid)}
.bucket.bad .swatch{background:var(--neg);box-shadow:0 0 8px -1px var(--neg)}
.bucket-head .label{flex:1 1 auto;text-align:left;font-size:var(--t--2);font-weight:600;
  font-stretch:90%;text-transform:uppercase;letter-spacing:var(--track-caps);
  line-height:1;color:var(--fg-muted)}
.bucket.good .label{color:color-mix(in oklab,var(--pos) 62%,var(--bone))}
.bucket.neutral .label{color:color-mix(in oklab,var(--mid) 62%,var(--bone))}
.bucket.bad .label{color:color-mix(in oklab,var(--neg) 62%,var(--bone))}
.bucket-head .count-pill{font-size:var(--t--2);font-weight:600;color:var(--fg-dim);
  font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}

.surveys{display:grid;gap:0;padding:var(--sp-1) 0 var(--sp-3) var(--sp-4)}
.survey{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3);align-items:start;
  padding:var(--sp-3) 0;border-top:1px solid var(--line-hair)}
.survey:first-child{border-top:0}
.score-chip{display:grid;place-items:center;width:34px;height:34px;flex:none;
  border-radius:var(--r-xs);font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 16,"wght" 600;font-size:var(--t-0);line-height:1;
  font-variant-numeric:tabular-nums}
.score-chip.g{color:var(--pos);background:color-mix(in oklab,var(--pos) 11%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--pos) 34%,transparent)}
.score-chip.n{color:var(--mid);background:color-mix(in oklab,var(--mid) 11%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--mid) 34%,transparent)}
.score-chip.b{color:var(--neg);background:color-mix(in oklab,var(--neg) 12%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--neg) 38%,transparent)}
.survey-body{min-width:0}
.survey-top{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;
  font-size:var(--t--2);line-height:1}
.survey-top .txn{font-weight:600;font-stretch:90%;text-transform:uppercase;
  letter-spacing:var(--track-caps);color:var(--brass-600)}
.survey-top .date{color:var(--fg-dim);letter-spacing:var(--track-small)}
/* the comment is the point of the page — give it the display face */
.comment{margin-top:6px;font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 16,"wght" 440;font-size:var(--t-0);
  line-height:1.5;letter-spacing:0;color:var(--fg-muted);text-wrap:pretty;max-width:78ch}
.comment.none{padding:0;text-align:left;font-size:var(--t--1);font-style:italic;
  font-variation-settings:"opsz" 14,"wght" 420;letter-spacing:var(--track-small);
  color:color-mix(in oklab,var(--bone-3) 72%,transparent)}
.empty-bucket{padding:var(--sp-3) 0 var(--sp-3) var(--sp-4);font-size:var(--t--1);
  color:var(--fg-dim);font-style:italic}

/* ============================ ACCORDION ============================ */
.caret{display:grid;place-items:center;width:16px;height:16px;flex:none;color:var(--accent-deep);
  transition:transform var(--dur-3) var(--ease-cine),color var(--dur-2) var(--ease-out)}
.caret svg{width:13px;height:13px}
[aria-expanded="true"] > .caret{transform:rotate(90deg);color:var(--brass)}
.district-head:hover .caret,.store-head:hover .caret,.rep-head:hover .caret,
.bucket-head:hover .caret{color:var(--brass)}
.collapse{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows var(--dur-4) var(--ease-cine)}
[aria-expanded="true"] + .collapse,.collapse.open{grid-template-rows:1fr}
.collapse > .collapse-inner{overflow:hidden;min-height:0;
  /* height:0 alone leaves the subtree focusable and readable by a screen reader.
     visibility drops it from the tab order and the AX tree; the delayed
     transition keeps it visible for the length of the collapse animation. */
  visibility:hidden;transition:visibility 0s linear var(--dur-4)}
[aria-expanded="true"] + .collapse > .collapse-inner,
.collapse.open > .collapse-inner{visibility:visible;transition-delay:0s}

/* ============================ EMPTY / FOOTER ============================ */
.empty{padding:var(--sp-8) 0;text-align:center;color:var(--fg-dim);
  font-family:var(--font-display);font-optical-sizing:none;
  font-variation-settings:"opsz" 22,"wght" 440;font-size:var(--t-1);letter-spacing:var(--track-1)}
.empty a{color:var(--brass-300);text-decoration:underline;
  text-decoration-color:color-mix(in oklab,var(--brass) 45%,transparent);
  text-underline-offset:.18em;text-decoration-thickness:1px}
.empty a:hover{text-decoration-color:var(--brass-300)}
.src{padding:var(--sp-5) 0 var(--sp-9);font-size:var(--t--2);line-height:1.6;
  color:var(--fg-dim);letter-spacing:var(--track-small);
  border-top:1px solid var(--line-hair)}

/* ============================ REVEAL ============================ */
/* keep the browser from laying out collapsed subtrees it isn't painting */
.survey{content-visibility:auto;contain-intrinsic-size:auto 78px}
.collapse[data-big]{transition:none}
@keyframes led-in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.district{animation:led-in var(--dur-4) var(--ease-cine) both;
  animation-delay:calc(var(--i,0) * 55ms)}

/* ============================ RESPONSIVE ============================ */
@media (max-width:1240px){
  /* the pull-quote is the first thing to go — it is a reward, not a control */
  .peek{display:none}
  .district-head{grid-template-columns:auto auto minmax(20ch,1fr) auto auto auto}
}
@media (max-width:1000px){
  .district-head{grid-template-columns:auto auto 1fr auto;row-gap:var(--sp-3)}
  .district-id{max-width:none}
  .district-head .district-id{grid-column:3;grid-row:1}
  /* keep the meter inline at a fixed width — stretched full-bleed under the
     name it stops reading as a scale and starts reading as an underline */
  .district-head .meter{grid-column:3;grid-row:2;width:clamp(96px,22vw,150px);align-self:center}
  .district-head .minis{grid-column:3;grid-row:2;justify-self:end;align-self:center}
  .district-head .nps-badge{grid-column:4;grid-row:1/3;align-self:center}
}
@media (max-width:720px){
  .mast-meta{border-left:0;padding-left:0;padding-top:var(--sp-4);
    border-top:1px solid var(--line-hair);width:100%;
    display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3) var(--sp-4)}
  .bar-in{gap:var(--sp-2);padding-block:var(--sp-2)}
  .bar-gap{display:none}
  .seg{flex:1 1 100%}
  .seg button{flex:1 1 50%;padding-inline:var(--sp-2)}
  .field{flex:1 1 calc(50% - var(--sp-1));min-width:0}
  .field select{width:100%;max-width:none;min-height:44px}
  .chips{flex:1 1 100%}
  .chip{flex:1 1 0;justify-content:center;min-height:44px;padding-inline:var(--sp-2);
    font-size:10.5px;letter-spacing:.09em}
  .seg button{min-height:44px}
  .tbtn{min-height:44px}
  .bucket-head{min-height:44px;padding-block:var(--sp-3)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-left:1px solid var(--line-hair);border-top:1px solid var(--line-hair)}
  .kpi:nth-child(odd){border-left:0}
  .kpi:nth-child(-n+2){border-top:0}
  .kpi .val{font-size:var(--t-2)}
  .store-head{grid-template-columns:auto 1fr auto;row-gap:var(--sp-2)}
  .store-head .minis{grid-column:2;grid-row:2}
  .store-head .nps-badge{grid-row:1/3;grid-column:3}
  .rep-head{grid-template-columns:auto 1fr auto}
  .stores,.reps,.buckets,.surveys{padding-left:var(--sp-2)}
  .comment{font-size:var(--t--1)}
}
@media (max-width:420px){
  .district-head .meter{display:none}
  .mast-title > span{font-size:var(--t-4)}
}

/* ============================ PREFERENCES ============================ */
@media (prefers-reduced-transparency:reduce){
  .bar{-webkit-backdrop-filter:none;backdrop-filter:none;
    background:color-mix(in oklab,var(--ink-950) 97%,transparent)}
  .chip{-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){
  :root{--fg-dim:var(--bone-2);
    --line-soft:color-mix(in oklab,var(--bone) 30%,transparent);
    --line-hair:color-mix(in oklab,var(--bone) 20%,transparent)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .district{animation:none}
  .meter span{transition:none}
  *,*::before,*::after{animation-duration:1ms !important;animation-delay:0ms !important;
    animation-iteration-count:1 !important;transition-duration:1ms !important;
    transition-delay:0ms !important}
}
@media print{
  :root{--bg:#fff;--fg:#111;--fg-muted:#333;--fg-dim:#555;
    --line-hair:#ddd;--line-soft:#ccc;--brass-600:#8a6323;--brass-300:#8a6323}
  body{background:none;background-image:none}
  .bar,.section-head .bulk,.skip,.peek,.meter{display:none}
  .district,.store,.rep{content-visibility:visible;break-inside:avoid}
  .collapse{grid-template-rows:1fr!important}
  .collapse > .collapse-inner{overflow:visible;visibility:visible;transition-delay:0s}
  .caret{display:none}
  .nps-badge,.rep-hero,.score-chip{box-shadow:inset 0 0 0 1px #bbb}
}
@media (forced-colors:active){
  .chip,.seg button,.tbtn,.nps-badge,.rep-hero,.score-chip{
    forced-color-adjust:none;border:1px solid CanvasText;background:Canvas;color:CanvasText}
  .seg button[aria-pressed="true"],.chip:hover{background:Highlight;color:HighlightText}
}
</style>
</head>
<body>

<a class="skip" href="#results">Skip to the districts</a>

<header class="masthead">
    <div class="wrap mast-row">
      <div class="mast-id">
        <div class="kicker">Blufox Mobile &middot; Xfinity Retail</div>
        <h1 class="mast-title">
          <span>The NPS</span>
          <span>Index</span>
          <span id="mastPeriod"></span>
        </h1>
        <p class="mast-sub">Every Medallia response, filed by <b>district</b>, then store,
          then rep. Open a district to read what customers actually said.</p>
      </div>
      <div class="mast-meta">
        <div>
          <div class="caps">Districts</div>
          <div class="v" id="statDistricts">&mdash;</div>

// --- Freshness helpers: read each GitHub file at its NEWEST commit so we bypass
// the raw.githubusercontent CDN lag that otherwise serves yesterday's copy for
// minutes after an upload. NPS_FRESH records the commit date for the readiness gate.
const NPS_FRESH = {};
function npsLocalYMD(d){ d = d || new Date(); const z = n => String(n).padStart(2,"0"); return d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()); }
async function npsPinnedUrl(repo, path){
  try {
    const api = "https://api.github.com/repos/BlufoxMobile/" + repo + "/commits?path=" + encodeURIComponent(path) + "&per_page=1&_=" + Date.now();
    const r = await fetch(api, { cache: "no-store", headers: { "Accept": "application/vnd.github+json" } });
    if(r.ok){
      const j = await r.json();
      if(j && j[0] && j[0].sha){
        const iso = j[0].commit && j[0].commit.committer && j[0].commit.committer.date;
        NPS_FRESH[path] = { sha: j[0].sha, date: iso ? npsLocalYMD(new Date(iso)) : null };
        return "https://raw.githubusercontent.com/BlufoxMobile/" + repo + "/" + j[0].sha + "/" + path.split("/").map(encodeURIComponent).join("/");
      }
    }
  } catch(e){ console.warn("pin lookup failed:", repo, path, e); }
  return null;
}

// Store-number → short store name (numbers observed in the tNPS "Store ID" column BE).
const NPS_STORE_NUM = {
  "55027": "Bourbonnais",   "55009": "Uptown",          "55005": "Frankfort",
  "51026": "Schererville",  "55004": "Glenview",        "51011": "Greeneville",

function npsMapStore(raw){
  if(!raw) return null;
  const m = String(raw).match(/^\s*(\d{4,6})/);
  if(m && NPS_STORE_NUM[m[1]]) return NPS_STORE_NUM[m[1]];
  const s = String(raw).toLowerCase();
  for(const [name, keys] of NPS_STORE_ALIASES){
    if(keys.some(k => s.includes(k))) return name;
  }
  return null;
}

// Resolve a stored survey's store on READ. Records written by an older deploy
// can carry storeKey:null for stores the mapper didn't know yet (they are only
// re-mapped when they arrive in a fresh workbook), so fall back to re-mapping
// storeRaw with the current tables. Returns null when genuinely unmappable, so
// callers still route those surveys to the "Unmatched" group.
function npsSurveyStore(s){
  if(!s) return null;
  if(s.storeKey) return s.storeKey;
  return npsMapStore(s.storeRaw);
}

function npsDateStr(v){
  let d = null;
  if(v instanceof Date){ d = v; }
  else if(typeof v === "number"){
    d = new Date(Math.round((v - 25569) * 86400000));
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
  }
  else if(v){ const t = new Date(v); if(!isNaN(t.getTime())) d = t; }
  if(!d || isNaN(d.getTime())) return null;
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function npsPrettyDate(iso){
  if(!iso) return "";
  const [y,mo,da] = iso.split("-").map(Number);
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[mo-1] + " " + da + ", " + y;
}

function npsCleanText(v){
  if(v == null) return "";
  let s = String(v);
  // The export writes some unicode as literal "\uXXXX" sequences — decode them.
  s = s.replace(/\\u([0-9a-fA-F]{4})/g, (m,h) => String.fromCharCode(parseInt(h,16)));
  return s.trim();
}

function npsEsc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Bucket per Jeff's spec: 9-10 good (green), 8 ok (yellow), 0-7 bad (red).
function npsBucket(score){ return score >= 9 ? "good" : score === 8 ? "ok" : "bad"; }

// Parse the tNPS Responses export workbook into survey objects.
function parseNpsWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws) throw new Error("Workbook has no sheets");
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(15, rows.length); i++){
    const r = rows[i];
    if(r && r.some(c => c != null && String(c).trim() === "Employee NTID")){ hr = i; break; }
  }
  if(hr < 0) throw new Error('Header row not found (no "Employee NTID" column). Is this the tNPS Responses export?');
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const iId       = h.findIndex(c => /^surveyid/i.test(c));
  const iTxn      = h.findIndex(c => c.toLowerCase() === "transaction date");
  const iResp     = h.findIndex(c => c.toLowerCase() === "response date");
  const iNtid     = h.indexOf("Employee NTID");
  const iScore    = h.findIndex(c => c.toLowerCase() === "sms tnps");       // col J
  const iScoreAlt = h.findIndex(c => c.toLowerCase() === "tnps");           // col K fallback
  const iReason   = h.findIndex(c => c.toLowerCase() === "reason for score"); // col L
  let iType  = h.findIndex(c => /retail interaction/i.test(c));             // col AY
  if(iType  < 0) iType  = 50;
  let iStore = h.findIndex(c => c.toLowerCase() === "store id");            // col BE
  if(iStore < 0) iStore = 56;

  const surveys = [];
  const unmatched = new Set();
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r) continue;
    const id = r[iId] != null ? String(r[iId]).trim() : "";
    let score = r[iScore];
    if((score == null || score === "") && iScoreAlt >= 0) score = r[iScoreAlt];
    if(!id || score == null || score === "") continue;
    score = Number(score);
    if(isNaN(score)) continue;
    const rawStore = r[iStore] != null ? String(r[iStore]).trim() : "";
    const storeKey = npsMapStore(rawStore);
    if(!storeKey && rawStore) unmatched.add(rawStore);
    surveys.push({
      id: id,
      score: score,
      txnDate:  npsDateStr(r[iTxn]),
      respDate: npsDateStr(r[iResp]),
      ntid:     r[iNtid] != null ? String(r[iNtid]).trim() : "",
      comment:  npsCleanText(r[iReason]),
      txnType:  r[iType] != null ? String(r[iType]).trim() : "",
      storeKey: storeKey,
      storeRaw: rawStore
    });
  }
  return { surveys: surveys, unmatched: Array.from(unmatched) };
}

async function npsFetchDirectory(){
  const r = await fetch(NPS_CONFIG.DIRECTORY_URL + "?t=" + Date.now(), { cache: "no-store" });
  if(!r.ok) throw new Error("store-directory.json HTTP " + r.status);
  return await r.json();
}

// Reps parsed from the "Rep Rank" sheet — used to resolve NTIDs to real names.
let NPS_REPS = [];

// Compact version of the DM-Visit-Guide "Store Rank" parser (same header regexes).
// Also parses "Rep Rank" into NPS_REPS as a side effect (same workbook fetch).
async function npsFetchSalesStores(){
  const salesUrl = (await npsPinnedUrl("Daily-Sales-Report","data/Sales Report.xlsx")) || NPS_CONFIG.NPS_SALES_REPORT_URL;
  const resp = await fetch(salesUrl + "?t=" + Date.now(), {cache:"no-store"});
  if(!resp.ok) throw new Error("Sales report HTTP " + resp.status);
  const wb = XLSX.read(await resp.arrayBuffer(), { type: "array" });
  try { NPS_REPS = npsParseReps(wb); } catch(e){ console.warn("Rep Rank parse failed:", e); }
  const ws = wb.Sheets["Store Rank"];
  if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(20, rows.length); i++){
    if(rows[i] && rows[i].some(c => c && String(c).trim() === "Rank")){ hr = i; break; }
  }
  if(hr < 0) return [];
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const idx = {
    rank:      h.findIndex(c => c.trim() === "Rank"),
    region:    h.findIndex(c => c.toLowerCase().includes("region")),
    store:     h.findIndex(c => c.toLowerCase().includes("store")),
    rsd:       h.findIndex(c => c.toLowerCase().includes("rsd")),
    dm:        h.findIndex(c => c.trim().toLowerCase() === "dm"),
    sm:        h.findIndex(c => c.trim().toLowerCase() === "sm"),
    gpTrend:   h.findIndex(c => /^GP\s*\$\s*Trend$/i.test(c)),
    mobileCR:  h.findIndex(c => c.toLowerCase().includes("mobile close rate")),
    fiscalCR:  h.findIndex(c => c.toLowerCase().includes("fiscal close rate")),
    nonTrad:   h.findIndex(c => c.toLowerCase().includes("non traditional")),
    gigPct:    h.findIndex(c => /^GIG\s*Plans[\s\S]*%[\s\S]*10\s*Pts/i.test(c)),
    plusMix:   h.findIndex(c => /Mobile\s*Plus\s*Mix[\s\S]*5\s*Pts/i.test(c)),
    newToUpg:  h.findIndex(c => /NEW\s*TO\s*UPGR\s*%/i.test(c)),
    accPerDev: h.findIndex(c => /Accessory.*per\s*Device.*Net/i.test(c)),
    nps:       h.findIndex(c => c.toLowerCase().includes("fiscal nps") && !c.toLowerCase().includes("last")),
    newRGU:    h.findIndex(c => /^NEW\s*RGU$/i.test(c)),
    mobileMTD: h.findIndex(c => /^Mobile\s*MTD$/i.test(c)),
    tabletMTD: h.findIndex(c => /^Tablet\s*MTD$/i.test(c)),
    watchMTD:  h.findIndex(c => /^Watches\s*MTD$/i.test(c))
  };
  /* BFX SMART TARGETS: extra Store Rank columns for the daily-target engine.
     Header regex first; fixed-index fallback (fiscal installs AM/38, fiscal
     mobile AN/39, accessory net $ CD/81) only when the header text there
     passes a sanity check — otherwise -1 and the engine estimates instead. */
  const bfxCol = (pred, fixedIdx, sanityRe) => {
    const byName = h.findIndex(c => c && pred(String(c)));
    if(byName >= 0) return byName;
    const at = (h[fixedIdx] != null) ? String(h[fixedIdx]) : "";
    return sanityRe.test(at) ? fixedIdx : -1;
  };
  idx.fMob   = bfxCol(c => /mobile/i.test(c) && /install/i.test(c), 39, /mobile/i);
  idx.fInst  = bfxCol(c => /install/i.test(c) && !/mobile/i.test(c), 38, /install|rgu/i);
  idx.accNet = bfxCol(c => /access/i.test(c) && /net/i.test(c) && !/device/i.test(c), 81, /access/i);
  idx.trafBfx = h.findIndex(c => c && /shopper\s*trak\s*daily\s*avg/i.test(String(c)));
  const out = [];
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || r[idx.rank] == null) break;
    const rsd = r[idx.rsd];
    if(!rsd || !String(rsd).includes(NPS_CONFIG.RSD_FILTER)) continue;
    const g = k => idx[k] >= 0 ? num(r[idx[k]]) : 0;
    out.push({
      rank: num(r[idx.rank]),
      region: r[idx.region] || "", name: r[idx.store] || "",
      dm: r[idx.dm] || "", sm: r[idx.sm] || "",
      gpTrend: g("gpTrend"), mobileCR: g("mobileCR"), fiscalCR: g("fiscalCR"),
      nonTrad: g("nonTrad"), gigPct: g("gigPct"), plusMix: g("plusMix"),
      newToUpg: g("newToUpg"), accPerDev: g("accPerDev"), nps: g("nps"),
      newRGU: g("newRGU"), mobileMTD: g("mobileMTD"), tabletMTD: g("tabletMTD"), watchMTD: g("watchMTD"),
      /* BFX SMART TARGETS: engine inputs (null when the column wasn't found) */
      fMob: idx.fMob >= 0 ? num(r[idx.fMob]) : null,
      fInst: idx.fInst >= 0 ? num(r[idx.fInst]) : null,
      accTotal: idx.accNet >= 0 ? num(r[idx.accNet]) : null
    });
    /* BFX SMART TARGETS: capture shopper-trak daily avg here too, so the
       dashboard gets traffic pacing without a second workbook fetch. */
    if(idx.trafBfx >= 0){
      const tv = num(r[idx.trafBfx]);
      const snB = npsShortFromRaw(r[idx.store]);
      if(snB && tv > 0) NPS_DAILY[snB.toLowerCase()] = Math.round(tv);
    }
  }
  BFX_SALES_ROWS = out; /* BFX SMART TARGETS: cache for goal helpers */
  return out;
}

// Parse "Rep Rank" sheet → ALL reps with their MTD stats (no RSD filter, so any
// rep who shows up on a survey can be matched). Header regexes mirror the
// DM-Visit-Guide parser.
function npsParseReps(wb){
  const ws = wb.Sheets["Rep Rank"];
  if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  let hr = -1;
  for(let i = 0; i < Math.min(20, rows.length); i++){
    if(rows[i] && rows[i].some(c => c && String(c).trim() === "Rank")){ hr = i; break; }
  }
  if(hr < 0) return [];
  const h = rows[hr].map(c => c == null ? "" : String(c).trim());
  const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const iRank   = h.findIndex(c => c.trim() === "Rank");
  const iName   = h.findIndex(c => c.toLowerCase().includes("employee"));
  const iLoc    = h.findIndex(c => c.toLowerCase().includes("location"));
  const iGP     = h.findIndex(c => /^GP\s*\$/i.test(c));
  const iPlus   = h.findIndex(c => /Mobile\s*Plus\s*Mix[\s\S]*5\s*Pts/i.test(c));
  const iGig    = h.findIndex(c => /^GIG\s*Plans[\s\S]*commissions\s*plan\)\s*%$/i.test(c));
  const iMobile = h.findIndex(c => /^Mobile\s*MTD$/i.test(c));
  const iTablet = h.findIndex(c => /^Tablet\s*MTD$/i.test(c));
  const iWatch  = h.findIndex(c => /^Watches\s*MTD$/i.test(c));
  if(iName < 0) return [];
  const out = [];
  for(let i = hr + 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || r[iName] == null) continue;
    const name = String(r[iName]).trim();
    if(!name) continue;
    out.push({
      name: name,
      store: iLoc >= 0 ? String(r[iLoc] || "").trim() : "",
      rank: iRank >= 0 ? num(r[iRank]) : 0,
      gp: iGP >= 0 ? num(r[iGP]) : 0,
      plusMix: iPlus >= 0 ? num(r[iPlus]) : 0,
      gigPct: iGig >= 0 ? num(r[iGig]) : 0,
      mobile: iMobile >= 0 ? num(r[iMobile]) : 0,
      tablet: iTablet >= 0 ? num(r[iTablet]) : 0,
      watch: iWatch >= 0 ? num(r[iWatch]) : 0
    });
  }
  return out;
}

// ===== Aux data for the Morning Message (best-effort, never blocks emails) =====
let NPS_TCHARTS = { byStore: {}, byRep: {}, total: 0, loaded: false };
let NPS_CRM     = { open: {}, aged: {}, leads: {}, loaded: false };

// Map any raw store string (full name, lead string, order string) → short name.
function npsShortFromRaw(raw){
  if(!raw) return null;
  const stripped = String(raw).replace(/\s+Test\s+Xfinity\s+Store\b/gi, "").replace(/\s+Xfinity\s+Store\b/gi, "").trim();
  return npsMapStore(raw) || npsMapStore(stripped) || (stripped || null);
}

// T-Sheet Submissions feed → MTD t-chart counts by store + by rep.
async function npsFetchTSheets(){
  const resp = await fetch(NPS_CONFIG.TSHEET_URL + "?_=" + Date.now(), { cache: "no-store" });
  if(!resp.ok) throw new Error("T-Sheet HTTP " + resp.status);
  const data = await resp.json();
  if(!data || !data.success || !Array.isArray(data.submissions)) throw new Error("T-Sheet payload malformed");
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const byStore = {}, byRep = {};
  let total = 0;
  for(const s of data.submissions){
    const ts = Date.parse(s.timestamp);
    if(!isFinite(ts) || ts < startOfMonth) continue;
    total++;
    const shortName = npsShortFromRaw(s.store);
    if(shortName) byStore[shortName] = (byStore[shortName] || 0) + 1;
    const rep = String(s.rep_name || "").trim().toLowerCase();
    if(rep && shortName){
      const key = rep + "||" + shortName.toLowerCase();
      byRep[key] = (byRep[key] || 0) + 1;
    }
  }
  NPS_TCHARTS = { byStore: byStore, byRep: byRep, total: total, loaded: true };
  return NPS_TCHARTS;
}

// ===== Lunch Punch Audit (best-effort) — missed lunch punches per store =====
// Mirrors the Auto-Punch-Report "By Store" tab: an employee-day with 1–3 punches
// (fewer than clock-in / lunch-out / lunch-in / clock-out) is a missed lunch
// punch. Managers are excluded, exactly like the dashboard. Never blocks emails.
let NPS_PUNCH = { byStore: {}, total: 0, detail: {}, loaded: false };
const NPS_PUNCH_URL  = "https://raw.githubusercontent.com/BlufoxMobile/Auto-Punch-Report/main/data/punch-data.xlsx";
const NPS_MGR_TITLES = ["Store Manager", "DM", "Ops Coordinator"];

// Same logic the punch dashboard uses to read a punch time out of a cell.
function npsPunchTime(v){
  if(v == null || v === "") return "";
  if(v instanceof Date){
    return String(v.getHours()).padStart(2,"0") + ":" +
           String(v.getMinutes()).padStart(2,"0") + ":" +
           String(v.getSeconds()).padStart(2,"0");
  }
  const m = String(v).match(/(\d{2}:\d{2}:\d{2})/);
  return m ? m[1] : "00:00:00";
}

async function npsFetchPunches(){
  const purl = (await npsPinnedUrl("Auto-Punch-Report","data/punch-data.xlsx")) || NPS_PUNCH_URL;
  const resp = await fetch(purl + "?t=" + Date.now(), { cache: "no-store" });
  if(!resp.ok) throw new Error("Punch data HTTP " + resp.status);
  const wb = XLSX.read(await resp.arrayBuffer(), { type: "array", cellDates: true });
  const sn = wb.SheetNames.find(s => /punch.?status/i.test(s))
          || wb.SheetNames.find(s => /break.*compliance/i.test(s))
          || wb.SheetNames.find(s => /punch/i.test(s))
          || wb.SheetNames[0];
  const ws = wb.Sheets[sn];
  if(!ws){ NPS_PUNCH = { byStore: {}, total: 0, detail: {}, loaded: true }; return NPS_PUNCH; }
  const rows = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true, cellDates: true });
  if(!rows.length){ NPS_PUNCH = { byStore: {}, total: 0, detail: {}, loaded: true }; return NPS_PUNCH; }

  const H = Object.keys(rows[0]);
  const findH = re => H.find(h => re.test(String(h).trim()));
  const cPunchTime = findH(/^punch\s*time$/i);

  // Collapse rows into per-(store, employee, date) day records → punch count.
  const days = {};
  if(cPunchTime){
    // Long form: one row per punch.
    const cStore = findH(/^store$/i)       || "Store";
    const cName  = findH(/^name$/i)        || findH(/^employee$/i) || findH(/employee.?name/i) || "Name";
    const cTitle = findH(/^job\s*title$/i) || findH(/^title$/i)    || "Title";
    const cDate  = findH(/^date$/i)        || findH(/punch.*in.*date/i) || "Date";
    rows.forEach(r => {
      const t = npsPunchTime(r[cPunchTime]);
      if(!t || t === "00:00:00") return;
      const dstr = npsDateStr(r[cDate]) || String(r[cDate]||"").slice(0,10);
      const k = String(r[cStore]||"") + "||" + String(r[cName]||"") + "||" + dstr;
      if(!days[k]) days[k] = { store: String(r[cStore]||""), title: String(r[cTitle]||""), name: String(r[cName]||""), date: dstr, times: [], cnt: 0 };
      days[k].cnt++;
      days[k].times.push(t);
    });
  } else {
    // Wide form: one row per employee-day with up to 4 punch columns.
    const cStore = findH(/^store$/i)              || "Store";
    const cEmp   = findH(/^employee$/i)           || findH(/employee.?name/i) || "Employee";
    const cTitle = findH(/^job\s*title$/i)        || findH(/^title$/i)        || "Job Title";
    const cDate  = findH(/punch.*in.*date/i)      || findH(/^date$/i)         || "Punch In Date";
    const cols   = [findH(/punch.?1.*time.*in\b/i) || "Punch 1 Time In",
                    findH(/punch.?1.*time.*out/i)  || "Punch 1 Time Out",
                    findH(/punch.?2.*time.*in\b/i) || "Punch 2 Time In",
                    findH(/punch.?2.*time.*out/i)  || "Punch 2 Time Out"];
    rows.forEach(r => {
      let cnt = 0; const tms = [];
      cols.forEach(c => { const t = npsPunchTime(r[c]); if(t && t !== "00:00:00"){ cnt++; tms.push(t); } });
      if(!cnt) return;
      const dstr = npsDateStr(r[cDate]) || String(r[cDate]||"").slice(0,10);
      const k = String(r[cStore]||"") + "||" + String(r[cEmp]||"") + "||" + dstr;
      days[k] = { store: String(r[cStore]||""), title: String(r[cTitle]||""), name: String(r[cEmp]||""), date: dstr, times: tms, cnt: cnt };
    });
  }

  // Per store: count employee-days with 1–3 punches, managers excluded, keyed by
  // the same short store name the email loop uses.
  const byStore = {};
  const detail = {};
  let total = 0;
  Object.keys(days).forEach(k => {
    const d = days[k];
    if(NPS_MGR_TITLES.includes(d.title)) return;
    if(d.cnt >= 1 && d.cnt < 4){
      const short = npsShortFromRaw(d.store);
      if(short){
        byStore[short] = (byStore[short] || 0) + 1; total++;
        (detail[short] = detail[short] || []).push({ rep: d.name, date: d.date, punches: d.cnt, clockOut: (d.times.length ? d.times.slice().sort().pop() : "") });
      }
    }
  });
  NPS_PUNCH = { byStore: byStore, total: total, detail: detail, loaded: true };
  return NPS_PUNCH;
}

// Minimal CSV parser (same semantics as the CRM's parseFuCSV).
function npsParseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}

// Same classification the Store CRM uses for credit-escalation leads.
function npsClassifyLead(responseText){
  const t = String(responseText || "").replace(/<[^>]*>/g, "").toLowerCase();
  if(!t) return "pending";
  if(/\bresubmit\b/i.test(t)) return "resubmit";
  if(/\bconfirm[a-z]*\b[\s\S]{0,80}\beligible\b/i.test(t)) return "approved";
  return "denied";
}

// Open orders (open-orders.json + closures.json) and actionable lead follow-ups
// (published credit-escalation sheet) per store.
async function npsFetchCrmActions(){
  const open = {}, aged = {}, leads = {}, openList = {}, leadList = {};
  // --- open orders ---
  try {
    const [ooR, clR] = await Promise.all([
      fetch(NPS_CONFIG.OPEN_ORDERS_URL + "?_=" + Date.now(), { cache: "no-store" }),
      fetch(NPS_CONFIG.CLOSURES_URL + "?_=" + Date.now(), { cache: "no-store" })
    ]);
    const oo = ooR.ok ? await ooR.json() : { orders: [] };
    const cl = clR.ok ? await clR.json() : {};
    (oo.orders || []).forEach(o => {
      const c = cl[o.workOrder];
      const status = (!c || c.status === "Other") ? "Open" : c.status;
      if(status !== "Open") return;
      const shortName = npsShortFromRaw(o.store);
      if(!shortName) return;
      open[shortName] = (open[shortName] || 0) + 1;
      if(Number(o.age) >= 30) aged[shortName] = (aged[shortName] || 0) + 1;
      (openList[shortName] = openList[shortName] || []).push({
        customer: String(o.customerName || "").trim(),
        wo: String(o.workOrder || "").trim(),
        product: String(o.product || "").trim(),
        rep: String(o.repName || "").trim(),
        age: Number(o.age) || 0
      });
    });
    Object.keys(openList).forEach(k => {
      openList[k].sort((a,b) => b.age - a.age);
      openList[k] = openList[k].slice(0, 50);
    });
  } catch(e){ console.warn("open-orders fetch failed:", e); }
  // --- lead follow-ups ---
  try {
    const r = await fetch(NPS_CONFIG.FU_CSV_URL + "&_=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const rows = npsParseCsv(await r.text());
      const h = (rows[0] || []).map(s => String(s).trim());
      const col = name => h.indexOf(name);
      const iStore = col("store"), iResp = col("creditTeamResponse"),
            iCust = col("customerName"), iPhone = col("phone"), iRep = col("rep");
      for(let i = 1; i < rows.length; i++){
        const row = rows[i];
        if(!row || !row.some(v => v && String(v).trim())) continue;
        const bucket = npsClassifyLead(iResp >= 0 ? row[iResp] : "");
        if(bucket !== "approved" && bucket !== "resubmit") continue;
        const shortName = npsShortFromRaw(iStore >= 0 ? row[iStore] : "");
        if(!shortName) continue;
        if(!leads[shortName]) leads[shortName] = { approved: 0, resubmit: 0 };
        leads[shortName][bucket]++;
        (leadList[shortName] = leadList[shortName] || []).push({
          customer: iCust >= 0 ? String(row[iCust] || "").trim() : "",
          phone: iPhone >= 0 ? String(row[iPhone] || "").trim() : "",
          rep: iRep >= 0 ? String(row[iRep] || "").trim() : "",
          bucket: bucket
        });
      }
      // approved (contact now) first, then resubmits
      Object.keys(leadList).forEach(k => {
        leadList[k].sort((a,b) => (a.bucket === b.bucket) ? 0 : (a.bucket === "approved" ? -1 : 1));
        leadList[k] = leadList[k].slice(0, 50);
      });
    }
  } catch(e){ console.warn("lead follow-ups fetch failed:", e); }
  NPS_CRM = { open: open, aged: aged, leads: leads, openList: openList, leadList: leadList, loaded: true };
  return NPS_CRM;
}

// "ALURRALDE,DIANA" → "Alurralde, Diana"
function npsTitleCase(s){
  return String(s || "").toLowerCase().replace(/,(?=\S)/g, ", ")
    .replace(/\b[a-z]/g, c => c.toUpperCase()).trim();
}

// Resolve an NTID like "bp-aray552" → "Anthony Ray" by matching first initial +
// last-name prefix against Rep Rank names. Returns "" unless exactly one match.
function npsRepName(ntid){
  if(!ntid || !NPS_REPS.length) return "";
  const m = String(ntid).toLowerCase().match(/^bp-([a-z])([a-z]+?)\d/);
  if(!m) return "";
  const ini = m[1], lastPrefix = m[2];
  const hits = NPS_REPS.filter(rep => {
    const parts = String(rep.name).trim().toLowerCase().split(/\s+/);
    if(parts.length < 2) return false;
    const first = parts[0], last = parts[parts.length - 1];
    return first.charAt(0) === ini && last.indexOf(lastPrefix) === 0;
  });
  if(hits.length === 1) return hits[0].name;
  // collisions: try narrowing by exact last-name length match
  if(hits.length > 1){
    const exact = hits.filter(rep => {
      const last = String(rep.name).trim().toLowerCase().split(/\s+/).pop();
      return last === lastPrefix;
    });
    if(exact.length === 1) return exact[0].name;
  }
  return "";
}

function npsPctFmt(v){
  const n = Number(v) || 0;
  return (Math.abs(n) <= 1.5 ? n * 100 : n).toFixed(1) + "%";
}
function npsMoneyFmt(v){ return "$" + Math.round(Number(v) || 0).toLocaleString("en-US"); }

function npsMedian(arr){
  const a = arr.slice().sort((x,y) => x - y);
  if(!a.length) return 0;
  const mid = Math.floor(a.length / 2);
  return a.length % 2 ? a[mid] : (a[mid-1] + a[mid]) / 2;
}

/* ---- Daily Briefing data: monthly goals + yesterday's conversion ---- */
let NPS_CONV = { byStore: {}, date: null, loaded: false };
let NPS_TARGETS = { byStore: {}, loaded: false };
let NPS_DAILY = {};

function npsDaysInMonth(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }

async function npsFetchTargets(){
  try {
    const purl = (await npsPinnedUrl("Daily-Sales-Report","data/target-summary.json")) || NPS_CONFIG.SUMMARY_URL;
    const r = await fetch(purl + "?t=" + Date.now(), { cache: "no-store" });

      const by = {};
      Object.keys(j.stores || {}).forEach(k => {
        const rec = j.stores[k] || {};
        let fcr = rec.closeRate;
        fcr = (typeof fcr === "number") ? (fcr <= 1 ? fcr*100 : fcr) : 0;
        by[String(k).trim().toLowerCase()] = { gp: Number(rec.gp) || 0, fcr: fcr };
      });
