async function npsFetchConversion(){
  try {
    const purl = (await npsPinnedUrl("Daily-Sales-Report","data/Sales Report.xlsx")) || NPS_CONFIG.NPS_SALES_REPORT_URL;
    const resp = await fetch(purl + "?t=" + Date.now(), { cache: "no-store" });
    if(resp.ok){
      const buf = await resp.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), { type: "array" });
      const conv = {};
      const zs = wb.Sheets["Zero"];
      if(zs){
        const aoa = XLSX.utils.sheet_to_json(zs, { header: 1, defval: null, raw: true });
        let hr = -1;
        for(let i=0;i<Math.min(aoa.length,10);i++){ if(aoa[i] && String(aoa[i][0]||"").trim().toLowerCase()==="store name"){ hr=i; break; } }
        if(hr > -1){
          for(let i=hr+1;i<aoa.length;i++){
            const r = aoa[i]; if(!r || !r[0]) continue;
            const sn = npsShortFromRaw(r[0]); if(!sn) continue;
            const mobile = Number(r[2]) || 0;
            const mcrRaw = r[7];
            const traffic = Number(r[8]) || 0;
            const mcr = (typeof mcrRaw === "number") ? (mcrRaw <= 1 ? mcrRaw*100 : mcrRaw) : null;
            conv[sn] = { traffic: traffic, mobile: mobile, mcr: mcr, tcharts: 0, tpct: null };
          }
        }
      }
      const srk = wb.Sheets["Store Rank"];
      if(srk){
        const aoa = XLSX.utils.sheet_to_json(srk, { header: 1, defval: null, raw: true });
        let h = -1, col = 30;
        for(let i=0;i<Math.min(aoa.length,12);i++){ if(aoa[i] && String(aoa[i][2]||"").trim().toLowerCase()==="store"){ h=i; break; } }
        if(h > -1){
          const hdr = aoa[h];
          for(let ci=0;ci<hdr.length;ci++){ if(hdr[ci] && /shopper\s*trak\s*daily\s*avg/i.test(String(hdr[ci]))){ col=ci; break; } }
          for(let i=h+1;i<aoa.length;i++){ const r=aoa[i]; if(!r || !r[2]) continue; const sn = npsShortFromRaw(r[2]); const v = Number(r[col]); if(sn && !isNaN(v) && v>0) NPS_DAILY[sn.toLowerCase()] = Math.round(v); }
        }
      }
      NPS_CONV.byStore = conv;
    }
    const tr = await fetch(NPS_CONFIG.TSHEET_URL + "?_=" + Date.now(), { cache: "no-store" });
    if(tr.ok){
      const data = await tr.json();
      const subs = (data && data.submissions) || [];
      const byDate = {};
      for(const s of subs){ const ts = s.timestamp; if(!ts) continue; const day = String(ts).slice(0,10); (byDate[day] = byDate[day] || []).push(s); }
      const d = new Date(); d.setDate(d.getDate()-1); const yISO = d.toISOString().slice(0,10);
      let useDate = null;
      if(byDate[yISO]) useDate = yISO;
      else { const days = Object.keys(byDate).sort(); for(let i=days.length-1;i>=0;i--){ if(byDate[days[i]].length>=30){ useDate=days[i]; break; } } if(!useDate && days.length) useDate = days[days.length-1]; }
      const counts = {};
      (byDate[useDate] || []).forEach(s => { const sn = npsShortFromRaw(s.store); if(sn) counts[sn] = (counts[sn]||0)+1; });
      NPS_CONV.date = useDate;
      Object.keys(NPS_CONV.byStore).forEach(sn => {
        const tc = counts[sn] || 0;
        const traffic = NPS_CONV.byStore[sn].traffic || 0;
        NPS_CONV.byStore[sn].tcharts = tc;
        NPS_CONV.byStore[sn].tpct = traffic > 0 ? (tc/traffic*100) : null;
      });
    }
    NPS_CONV.loaded = true;
  } catch(e){ console.warn("conversion unavailable:", e); }
  return NPS_CONV;
}

/* BFX SMART TARGETS ========================================================
   Everything from here to "END BFX SMART TARGETS" is new and IDENTICAL in
   upload.html + NPS-Index---Medallia/index.html (it lives inside the shared
   NPS module). It embeds the Blufox Smart Goal Engine VERBATIM, then renders
   the "🎯 TODAY'S TARGETS" panel used by the morning-briefing email and the
   NPS Index per-store dashboard cards. */
/* ============================================================
   BLUFOX SMART GOAL ENGINE  v1.1  (shared module)
   v1.1: volume-aware attachGoal for Gig/Plus (replaces "N in a row"),
         video-per-internet rule, mixGoal locked to Jeff's NPS Calculator.
   Embed this block VERBATIM in:
     - Daily-Goals-Sheet/index.html
     - One-On-One-Form/index.html
     - NPS email module (NPS-Index---Medallia/index.html + Daily-Sales-Report/upload.html)
   ------------------------------------------------------------
   DESIGN (agreed with Jeff, July 2026):
   - DUAL PERIOD:
       * FISCAL month (22nd -> 21st): drives MCR / FCR / NPS pacing,
         because close rates are measured fiscally.
       * CALENDAR month: drives GP $, Accessory $, Watch/Tablet units,
         because the sales report counts those units calendar-MTD and
         the Monthly Target Planner assigns calendar-month goals.
   - PACING: need = goal - MTD actual; daily = ceil(need / daysRemaining)
     where daysRemaining INCLUDES today (old sheet excluded today -> inflated goals).
   - DAY MATH: computed from calendar dates at midnight (old sheet used
     clock time, so goals flipped at noon).
   - OVER-PACE RULE: if a store's trending close rate beats the minimum
     (7% MCR / 10% FCR), the goal RISES to maintain their trend, flagged
     stretch:true. Same for GP when gpTrend > assigned target.
   - GOAL HIT: when need <= 0, status 'hit' and daily = maintenance pace
     (what it takes per day to keep the achieved rate), never a fake 1.
   ============================================================ */
var BFX = (function(){
  'use strict';

  // ---- Company standards (single source of truth) ----
  var STD = {
    MCR_MIN: 7,        // % mobile close rate, fiscal
    FCR_MIN: 10,       // % fiscal close rate (RGUs), fiscal
    NPS_GOAL: 80,      // tNPS
    GIG_GOAL: 80,      // % of internet sales on Gig
    PLUS_GOAL: 75,     // % of mobile lines on Plus
    ACC_PER_BOX: 20,   // $ accessory per mobile box (was $30 on old daily sheet — wrong)
    WT_RATE: 2,        // % of traffic -> watch/tablet
    TSHEET_RATE: 20    // % of traffic -> t-sheets
  };

  var DAY = 86400000;
  function mid(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function ceil(x){ return Math.ceil(x - 1e-9); }

  // ---- Period math (date-based, stable all day) ----
  // Fiscal month: 22nd -> 21st. rem INCLUDES today.
  function fiscalPeriod(now, dayOverride){
    var t = mid(now||new Date()), y=t.getFullYear(), m=t.getMonth(), d=t.getDate();
    var s = (d>=22) ? new Date(y,m,22) : new Date(y,m-1,22);
    var e = (d>=22) ? new Date(y,m+1,21) : new Date(y,m,21);
    var tot = Math.round((e-s)/DAY)+1;
    var el  = dayOverride>0 ? dayOverride : Math.round((t-s)/DAY)+1;
    el = Math.min(Math.max(el,1), tot);
    return { start:s, end:e, tot:tot, el:el, rem: tot-el+1 };
  }
  function calendarPeriod(now, dayOverride){
    var t = mid(now||new Date()), y=t.getFullYear(), m=t.getMonth();
    var tot = new Date(y, m+1, 0).getDate();
    var el  = dayOverride>0 ? dayOverride : t.getDate();
    el = Math.min(Math.max(el,1), tot);
    return { tot:tot, el:el, rem: tot-el+1 };
  }

  /* ---- Rate-driven unit goal (MCR -> mobile, FCR -> RGU). FISCAL basis.
     in: { trafDay, mtdUnits, minRate(%), per: fiscalPeriod() }
     Traffic to date approximated trafDay*el (report gives daily avg, not fiscal MTD).
     out: { rate, trend, stretch, monthGoal, mtd, need, daily, maintain, status, pct } */
  function rateGoal(o){
    var p = o.per, trafDay = o.trafDay>0 ? o.trafDay : 0;
    if(!trafDay) return { noTraffic:true, rate:o.minRate, trend:0, stretch:false,
      monthGoal:0, mtd:o.mtdUnits||0, need:0, daily:0, maintain:0, status:'no-data', pct:0 };
    var trafToDate = trafDay * p.el;
    var projTraf   = trafDay * p.tot;
    var mtd   = o.mtdUnits||0;
    var trend = trafToDate>0 ? (mtd/trafToDate)*100 : 0;
    var stretch = trend > o.minRate;
    var rate  = Math.max(o.minRate, trend);          // over-pace rule: raise to trend
    var monthGoal = ceil((rate/100)*projTraf);       // always round UP
    var need  = Math.max(0, monthGoal - mtd);
    var maintain = Math.max(1, ceil((rate/100)*trafDay)); // per-day pace to hold the rate
    var daily = need>0 ? ceil(need/p.rem) : maintain;
    var status = need<=0 ? 'hit' : (mtd >= (rate/100)*trafToDate - 1e-9 ? 'on-pace' : 'behind');
    return { rate:rate, trend:trend, stretch:stretch, monthGoal:monthGoal, mtd:mtd,
             need:need, daily:daily, maintain:maintain, status:status,
             pct: monthGoal>0 ? Math.min(100,(mtd/monthGoal)*100) : 0 };
  }

  /* ---- Amount goal (GP $, Accessory $, W/T units). CALENDAR basis.
     in: { monthGoal, trendGoal(optional, e.g. gpTrend), mtd, per: calendarPeriod(), roundTo }
     Jeff's example: goal $50,000, trending $48,000 -> gap $2,000 / days left
     is added on top of pace. Implemented as need/rem which is equivalent. */
  function amountGoal(o){
    var p = o.per;
    var base = o.monthGoal||0;
    var stretch = (o.trendGoal||0) > base;
    var goal = Math.max(base, o.trendGoal||0);       // over-pace rule
    var mtd  = o.mtd||0;
    var need = Math.max(0, goal - mtd);
    var maintain = Math.max(0, ceil(goal/p.tot));
    var daily = need>0 ? ceil(need/p.rem) : maintain;
    var paceMTD = goal*(p.el/p.tot);
    var status = need<=0 ? 'hit' : (mtd >= paceMTD-1e-9 ? 'on-pace' : 'behind');
    if(o.roundTo){ daily = Math.ceil(daily/o.roundTo)*o.roundTo; }
    return { goal:goal, stretch:stretch, mtd:mtd, need:need, daily:daily,
             maintain:maintain, status:status,
             pct: goal>0 ? Math.min(100,(mtd/goal)*100) : 0,
             gapToPace: Math.max(0, paceMTD-mtd) };
  }

  /* ---- Mix goal (NPS): how many more "good" outcomes in a row to reach
     the goal share. n = ceil((g*base - num)/(1-g)).
     Matches Jeff's NPS Calculator 2025.xlsx exactly:
       =MAX(0, CEILING((Surveys*Desired - Surveys*Current)/(1-Desired), 1))
     NPS: num = promoters - detractors, base = total surveys, g = 0.80. */
  function mixGoal(o){
    var g = (o.goalPct||0)/100, num = o.num||0, base = o.base||0;
    var cur = base>0 ? (num/base)*100 : null;
    if(cur===null) return { cur:null, needed:null, status:'no-data', goalPct:o.goalPct };
    if(cur >= o.goalPct) return { cur:cur, needed:0, status:'hit', goalPct:o.goalPct };
    var needed = g>=1 ? Infinity : Math.max(1, ceil((g*base - num)/(1-g)));
    return { cur:cur, needed:needed, status:'behind', goalPct:o.goalPct };
  }

  /* ---- Attach goal (Gig %, Plus %, video-on-internet) — VOLUME-AWARE.
     The old "next N in a row" math dragged the whole month's history along
     (e.g. "139 Gig in a row"), which is not actionable. Instead:
       expRem  = internets/mobiles you'll realistically sell in the rest of
                 the month, from your own pace: ceil((base/el) * rem)
       needed  = Gig sales required AMONG those to finish the month at goal:
                 ceil(g*(base+expRem) - num)
     If needed > expRem the goal is mathematically out of reach this month:
       status 'all-in' -> sell goal-product on EVERY remaining sale and
       report bestPct (the % you'd finish at), fresh start next month.
     in: { goalPct, num, base, per (calendarPeriod or fiscalPeriod) }
     out: { cur, expRem, needed, perDay, share(%), bestPct, status } */
  function attachGoal(o){
    var g = (o.goalPct||0)/100, num = o.num||0, base = o.base||0, p = o.per;
    var cur = base>0 ? (num/base)*100 : null;
    if(cur===null) return { cur:null, status:'no-data', goalPct:o.goalPct };
    if(cur >= o.goalPct){
      // already at goal: hold it — goal-share of each remaining sale
      var expR0 = ceil((base/p.el)*p.rem);
      return { cur:cur, expRem:expR0, needed:ceil(g*expR0), perDay:0,
               share:o.goalPct, bestPct:cur, status:'hit', goalPct:o.goalPct };
    }
    var expRem = ceil((base/Math.max(1,p.el)) * p.rem);        // own-pace projection
    if(expRem<=0) return { cur:cur, expRem:0, needed:0, perDay:0, share:null,
                           bestPct:cur, status:'no-volume', goalPct:o.goalPct };
    var needed = Math.max(1, ceil(g*(base+expRem) - num));
    if(needed >= expRem){
      var bestPct = ((num+expRem)/(base+expRem))*100;          // all-Gig finish
      return { cur:cur, expRem:expRem, needed:expRem, perDay:null,
               share:100, bestPct:bestPct, status:'all-in', goalPct:o.goalPct };
    }
    return { cur:cur, expRem:expRem, needed:needed,
             perDay: needed/p.rem,                              // may be <1 — round in UI
             share: (needed/expRem)*100,
             bestPct:o.goalPct, status:'behind', goalPct:o.goalPct };
  }

  /* ---- Full store computation ----
     s: { trafDay, fMob, fInst,            // fiscal MTD mobile / RGU installs
          gpTarget (from target-summary.json, fallback report col P),
          gpTrend, gpMTD,
          accMTD, wtMTD,
          npsProm, npsDet, npsTotal,       // optional (Medallia MTD)
          gigNum, gigBase, plusNum, plusBase } // optional
     opts: { now, fiscalDayOverride, calDayOverride } */
  function storeGoals(s, opts){
    opts = opts||{};
    var fp = fiscalPeriod(opts.now, opts.fiscalDayOverride||0);
    var cp = calendarPeriod(opts.now, opts.calDayOverride||0);

    var mobile = rateGoal({ trafDay:s.trafDay, mtdUnits:s.fMob, minRate:STD.MCR_MIN, per:fp });
    var rgu    = rateGoal({ trafDay:s.trafDay, mtdUnits:s.fInst, minRate:STD.FCR_MIN, per:fp });

    // Accessory month goal = $20 x mobile month goal (unit-consistent with planner)
    var accMonth = STD.ACC_PER_BOX * mobile.monthGoal;
    var acc = amountGoal({ monthGoal:accMonth, mtd:s.accMTD, per:cp, roundTo:5 });

    var wtMonth = ceil((STD.WT_RATE/100) * (s.trafDay||0) * cp.tot);
    var wt = amountGoal({ monthGoal:wtMonth, mtd:s.wtMTD, per:cp });

    var gp = amountGoal({ monthGoal:s.gpTarget||0, trendGoal:s.gpTrend||0,
                          mtd:s.gpMTD||0, per:cp, roundTo:25 });

    var out = { period:{fiscal:fp, calendar:cp}, std:STD,
                mobile:mobile, rgu:rgu, acc:acc, wt:wt, gp:gp };

    if(s.npsTotal!=null) out.nps  = mixGoal({ goalPct:STD.NPS_GOAL,
      num:(s.npsProm||0)-(s.npsDet||0), base:s.npsTotal });
    // Gig / Plus: volume-aware attach goals (report MTD counts are calendar-month)
    if(s.gigBase!=null)  out.gig  = attachGoal({ goalPct:STD.GIG_GOAL,  num:s.gigNum,  base:s.gigBase,  per:cp });
    if(s.plusBase!=null) out.plus = attachGoal({ goalPct:STD.PLUS_GOAL, num:s.plusNum, base:s.plusBase, per:cp });
    // Video / non-traditional: standard is video WITH EVERY internet sale.
    // Daily video goal = today's internet (RGU) goal; monthly need = internets without video.
    if(s.videoMTD!=null && s.intMTD!=null){
      out.video = { attachCur: s.intMTD>0 ? (s.videoMTD/s.intMTD)*100 : null,
                    missed: Math.max(0, (s.intMTD||0)-(s.videoMTD||0)),
                    daily: rgu.daily, rule:'video with every internet sale' };
    }
    return out;
  }

  return { STD:STD, fiscalPeriod:fiscalPeriod, calendarPeriod:calendarPeriod,
           rateGoal:rateGoal, amountGoal:amountGoal, mixGoal:mixGoal,
           attachGoal:attachGoal, storeGoals:storeGoals };
})();
if (typeof module!=='undefined' && module.exports) module.exports = BFX;

/* BFX SMART TARGETS: Store Rank rows cached by npsFetchSalesStores() so the
   goal helpers can see a store's row without re-fetching the workbook. */
let BFX_SALES_ROWS = [];
function bfxRowFor(shortName){
  const k = String(shortName || "").trim().toLowerCase();
  return (BFX_SALES_ROWS || []).find(s => String(s.name).trim().toLowerCase() === k) || null;
}

/* BFX SMART TARGETS: fiscal-MTD NPS survey buckets per store (nps-mtd.json —
   the same Medallia MTD export the dashboard's MTD tab reads). Best effort. */
let BFX_NPSMTD = { byStore: {}, loaded: false };
function bfxIngestNpsMtd(surveys){
  const by = {};
  (surveys || []).forEach(s => {
    const sk = npsSurveyStore(s);
    if(!s || !sk || s.score == null) return;
    const k = String(sk).trim().toLowerCase();
    const rec = by[k] = by[k] || { prom: 0, det: 0, total: 0 };
    const b = npsBucket(Number(s.score));
    if(b === "good") rec.prom++; else if(b === "bad") rec.det++;
    rec.total++;
  });
  BFX_NPSMTD = { byStore: by, loaded: true };
  return BFX_NPSMTD;
}
async function bfxFetchNpsMtd(){
  if(BFX_NPSMTD.loaded) return BFX_NPSMTD;
  try {
    const url = NPS_CONFIG.MTD_URL || "https://raw.githubusercontent.com/BlufoxMobile/Daily-Sales-Report/main/data/nps-mtd.json";
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if(r.ok){
      const j = await r.json();
      bfxIngestNpsMtd(j.surveys || []);
    }
  } catch(e){ console.warn("nps-mtd unavailable for targets:", e); }
  return BFX_NPSMTD;
}

/* BFX SMART TARGETS: map the parsed feeds into BFX.storeGoals for one store.
   Inputs: NPS_DAILY (shopper-trak daily avg), NPS_TARGETS (target-summary.json),
   the store's Store Rank row, BFX_NPSMTD (Medallia MTD buckets).
   g.est flags which inputs were estimated so the UI can mark them with ~. */
function bfxStoreTargets(shortName, rowMaybe){
  const key = String(shortName || "").trim().toLowerCase();
  const row = rowMaybe || bfxRowFor(shortName);
  const trafDay = NPS_DAILY[key] || 0;
  if(!row || !trafDay) return null;
  const t = (NPS_TARGETS.byStore || {})[key] || {};
  const cp = BFX.calendarPeriod();
  const gpTrend = Number(row.gpTrend) || 0;
  const gpMTD = gpTrend * (cp.el / cp.tot);   // ESTIMATE: report carries trend, not GP MTD
  const wtMTD = (Number(row.watchMTD) || 0) + (Number(row.tabletMTD) || 0);
  const devs  = (Number(row.mobileMTD) || 0) + wtMTD;
  const accMTD = (row.accTotal != null) ? Number(row.accTotal)
               : Math.round((Number(row.accPerDev) || 0) * devs);   // estimate when col missing
  const fMob  = (row.fMob  != null) ? Number(row.fMob)  : (Number(row.mobileMTD) || 0);
  const fInst = (row.fInst != null) ? Number(row.fInst) : (Number(row.newRGU) || 0);
  const s = { trafDay: trafDay, fMob: fMob, fInst: fInst,
              gpTarget: Number(t.gp) || 0, gpTrend: gpTrend, gpMTD: gpMTD,
              accMTD: accMTD, wtMTD: wtMTD };
  const m = (BFX_NPSMTD.byStore || {})[key];
  if(m && m.total){ s.npsProm = m.prom; s.npsDet = m.det; s.npsTotal = m.total; }
  const g = BFX.storeGoals(s);
  g.est = { gpMTD: true, accMTD: row.accTotal == null,
            fMob: row.fMob == null, fInst: row.fInst == null };
  return g;
}

/* BFX SMART TARGETS: subject-line snippet " • today: X XM / Y RGU". */
function bfxSubjectSnippet(shortName, row){
  const g = bfxStoreTargets(shortName, row);
  if(!g || g.mobile.noTraffic) return "";
  return " • today: " + g.mobile.daily + " XM / " + g.rgu.daily + " RGU";
}

/* BFX SMART TARGETS: one dark-navy target tile (email-safe, tables only —
   no flex/grid so Outlook renders it). Modes: stretch ⭐ orange, behind red,
   hit green ✓, norm = standard header tile. */
function bfxTgtTile(label, big, ctx, mode){
  const bg = mode === "stretch" ? "rgba(249,115,22,0.16)" : mode === "behind" ? "rgba(239,68,68,0.13)" : mode === "hit" ? "rgba(16,185,129,0.13)" : "rgba(255,255,255,0.08)";
  const bd = mode === "stretch" ? "rgba(253,186,116,0.45)" : mode === "behind" ? "rgba(248,113,113,0.45)" : mode === "hit" ? "rgba(110,231,183,0.45)" : "rgba(159,192,255,0.22)";
  const lc = mode === "stretch" ? "#fdba74" : mode === "behind" ? "#fca5a5" : mode === "hit" ? "#6ee7b7" : "#9fc0ff";
  const cc = mode === "stretch" ? "#fdba74" : mode === "behind" ? "#fca5a5" : mode === "hit" ? "#6ee7b7" : "#8aa3d6";
  return '<td width="33.33%" style="padding:3px;vertical-align:top;">' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:' + bg + ';border:1px solid ' + bd + ';border-radius:8px;"><tr><td style="padding:8px 6px;text-align:center;">' +
    '<div style="font-size:9px;color:' + lc + ';font-weight:800;letter-spacing:0.5px;text-transform:uppercase;">' + label + '</div>' +
    '<div style="font-size:18px;color:#ffffff;font-weight:800;margin-top:1px;line-height:1.1;">' + big + '</div>' +
    '<div style="font-size:9.5px;color:' + cc + ';font-weight:600;margin-top:3px;line-height:1.35;">' + ctx + '</div>' +
    '</td></tr></table></td>';
}
function bfxMode(u){ return u.status === "hit" ? "hit" : u.stretch ? "stretch" : u.status === "behind" ? "behind" : "norm"; }
// Context line for rate-driven tiles (XM, RGU — fiscal basis).
function bfxCtxRate(u){
  if(u.status === "hit") return "goal hit &#10003; maintain " + u.maintain + "/day";
  if(u.status === "behind") return "behind pace &mdash; need " + u.daily + "/day";
  return "MTD " + u.mtd + " of " + u.monthGoal + " &middot; trending " + (Math.round(u.trend * 10) / 10).toFixed(1) + "%" + (u.stretch ? " &#11088;" : "");
}
// Context line for amount tiles (GP $, Acc $ — calendar basis). est prefixes ~.
function bfxCtxAmt(u, est){
  const f = v => "$" + Math.round(v).toLocaleString("en-US");
  if(u.status === "hit") return "goal hit &#10003; maintain " + f(u.maintain) + "/day";
  if(u.status === "behind") return "behind pace &mdash; need " + f(u.daily) + "/day";
  return "MTD " + (est ? "~" : "") + f(u.mtd) + " of " + f(u.goal) + (u.stretch ? " &#11088;" : "");
}

/* BFX SMART TARGETS: the 🎯 TODAY'S TARGETS panel. Renders directly below the
   Monthly Goal panel inside the dark-navy email header (also reused by the
   NPS Index dashboard cards). Returns "" when the engine has no data. */
function npsDailyGoalHtml(shortName, rowMaybe){
  const g = bfxStoreTargets(shortName, rowMaybe);
  if(!g) return "";
  const fp = g.period.fiscal, cp = g.period.calendar;
  // Watch/Tablet: weekly framing is friendlier when fewer units than days remain.
  const wt = g.wt;
  let wtBig, wtCtx;
  if(wt.status === "hit"){
    wtBig = "&#10003;";
    wtCtx = "goal hit &#10003; maintain " + wt.maintain + "/day";
  } else if(wt.need > 0 && wt.need < cp.rem){
    wtBig = Math.ceil(wt.need / Math.max(1, cp.rem / 7)) + "/wk";
    wtCtx = "MTD " + wt.mtd + " of " + wt.goal + (wt.status === "behind" ? " &mdash; behind pace" : "");
  } else {
    wtBig = wt.daily + "/day";
    wtCtx = wt.status === "behind" ? "behind pace &mdash; need " + wt.daily + "/day"
          : "MTD " + wt.mtd + " of " + wt.goal;
  }
  // NPS: "N more 9–10 surveys to reach 80" line.
  let npsBig = "&mdash;", npsCtx = "MTD surveys unavailable", npsModeStr = "norm";
  if(g.nps && g.nps.status !== "no-data"){
    npsBig = String(Math.round(g.nps.cur));
    if(g.nps.status === "hit"){
      npsCtx = "at or above " + g.nps.goalPct + " &#10003; keep it up";
      npsModeStr = "hit";
    } else {
      npsCtx = "<b>" + g.nps.needed + "</b> more 9&ndash;10 survey" + (g.nps.needed === 1 ? "" : "s") + " &rarr; " + g.nps.goalPct; /* BFX v1.1 */
      npsModeStr = "behind";
    }
  } else if(g.nps && g.nps.status === "no-data"){
    npsCtx = "no surveys yet &mdash; every 9&ndash;10 counts";
  }
  const gpTile = g.gp.goal > 0
    ? bfxTgtTile("GP $ / Day", "$" + g.gp.daily.toLocaleString("en-US"), bfxCtxAmt(g.gp, g.est.gpMTD), bfxMode(g.gp))
    : bfxTgtTile("GP $ / Day", "&mdash;", "no GP target posted", "norm");
  return '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:10px;"><tr>' +
    '<td style="background:rgba(255,255,255,0.08);border:1px solid rgba(159,192,255,0.35);border-radius:12px;padding:12px 8px 9px;">' +
    '<div style="color:#9fc0ff;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px 7px;">&#127919; Today&rsquo;s Targets ' +
    '<span style="color:#8aa3d6;font-weight:600;letter-spacing:0.4px;text-transform:none;">&bull; ' + fp.rem + ' fiscal day' + (fp.rem === 1 ? "" : "s") + ' left &bull; ' + cp.rem + ' calendar</span></div>' +
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>' +
    bfxTgtTile("XM / Day", g.mobile.daily + "/day", bfxCtxRate(g.mobile), bfxMode(g.mobile)) +
    bfxTgtTile("RGU / Day", g.rgu.daily + "/day", bfxCtxRate(g.rgu), bfxMode(g.rgu)) +
    bfxTgtTile("Acc $ / Day", "$" + g.acc.daily.toLocaleString("en-US"), bfxCtxAmt(g.acc, g.est.accMTD), bfxMode(g.acc)) +
    '</tr><tr>' +
    gpTile +
    bfxTgtTile("Watch / Tablet", wtBig, wtCtx, bfxMode(wt)) +
    bfxTgtTile("NPS &middot; to 80", npsBig, npsCtx, npsModeStr) +
    '</tr></table>' +
    '</td></tr></table>';
}

function npsMonthlyGoals(shortName){
  const key = String(shortName).trim().toLowerCase();
  const t = (NPS_TARGETS.byStore || {})[key];
  const daily = NPS_DAILY[key];
  if(!t || !daily) return null;
  const C = Math.ceil;
  const monthly = daily * npsDaysInMonth();
  /* BFX SMART TARGETS: the XM goal now comes from the smart engine (over-pace
     aware — rises to the store's trend when they beat 7%), and accessory is
     $20/box against that SMART mobile goal. Falls back to the old flat 7%
     when the engine has no Store Rank row yet. */
  const smart = bfxStoreTargets(shortName);
  const xm = (smart && smart.mobile.monthGoal > 0) ? smart.mobile.monthGoal : C(monthly * 0.07);
  const xmRate = (smart && smart.mobile.monthGoal > 0) ? smart.mobile.rate : 7;
  const xmStretch = !!(smart && smart.mobile.stretch);
  return { gp: C(t.gp||0), xm: xm, rgu: C(monthly*((t.fcr||0)/100)), wt: C(monthly*0.02), acc: C(xm*BFX.STD.ACC_PER_BOX), ts: C(monthly*0.20), xmRate: xmRate, xmStretch: xmStretch };
}

    '<td style="background:rgba(255,255,255,0.08);border:1px solid rgba(159,192,255,0.35);border-radius:12px;padding:12px 11px 9px;">'+

    '<div style="font-size:0;">'+
    npsGoalTile("GP", "$"+g.gp.toLocaleString("en-US"), false)+

function npsCurTile(label, value, tone, w){

    '<div style="color:#9a3412;font-size:12px;margin-top:8px;line-height:1.5;">How yesterday&rsquo;s foot traffic turned into sales. <strong>MCR</strong> = % of shoppers who bought mobile; <strong>T&#8209;Chart %</strong> = % we ran a savings comparison for. Goal: <strong>MCR 7%+</strong> and <strong>T&#8209;Charts on 20%+</strong> of traffic.</div>'+
    '</td></tr>'+

function npsTimekeepingHtml(shortName){
  const detail = (NPS_PUNCH.detail || {})[shortName] || [];
  const loaded = NPS_PUNCH.loaded;
  const byRep = {};
  detail.forEach(x => { (byRep[x.rep] = byRep[x.rep] || []).push(x); });
  const reps = Object.keys(byRep).sort();
  let punchHtml;
  if(!loaded){
    punchHtml = '<div style="font-size:12px;color:#94a3b8;font-style:italic;">Punch data not loaded yet.</div>';
  } else if(reps.length === 0){
    punchHtml = '<div style="font-size:13px;color:#047857;background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:8px;padding:10px 12px;">&#10003; No missed punches this month &mdash; nice work keeping it clean.</div>';
  } else {
    let rowsH = "";
    reps.forEach(rep => {
      const days = byRep[rep].slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
      const daysH = days.map(d => '<div style="font-size:12px;color:#7c2d12;margin-top:2px;">' + npsEsc(String(d.date)) + ' &mdash; clocked out ' + npsEsc(d.clockOut || "—") + ' <span style="color:#9a3412;">(' + d.punches + ' punches)</span></div>').join("");
      rowsH += '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:10px;"><tr>' +
        '<td style="vertical-align:top;"><div style="font-size:14px;font-weight:800;color:#0f172a;">' + npsEsc(rep) + '</div>' + daysH + '</td>' +
        '<td width="60" align="right" style="vertical-align:top;"><div style="font-size:22px;font-weight:800;color:#ea580c;">' + days.length + '</div><div style="font-size:9px;color:#9a3412;text-transform:uppercase;letter-spacing:0.5px;">day' + (days.length===1?"":"s") + '</div></td>' +
        '</tr></table>';
    });
    punchHtml = '<div style="border:1.5px solid #f97316;background:#fff7ed;border-radius:8px;padding:10px 12px;">' +
      '<div style="font-size:11px;color:#9a3412;margin-bottom:2px;">Reps with fewer than 4 punches on a day this month (managers excluded). Fix clock-outs in the Punch Audit.</div>' + rowsH + '</div>';
  }
  return '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1.5px solid #94a3b8;border-radius:14px;overflow:hidden;">'+
    '<tr><td style="padding:14px 18px 6px;"><div><span style="display:inline-block;background:#0f172a;color:#ffffff;font-size:13px;font-weight:800;letter-spacing:0.5px;padding:5px 12px;border-radius:8px;">&#9201;&nbsp; TIMEKEEPING &amp; REMINDERS</span></div></td></tr>'+
    '<tr><td style="padding:4px 18px 8px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fffbeb;border:1.5px solid #fbbf24;border-radius:10px;"><tr>'+
    '<td width="40" align="center" style="vertical-align:top;padding:12px 0 12px 6px;font-size:22px;">&#127869;</td>'+
    '<td style="vertical-align:middle;padding:12px 14px 12px 6px;"><div style="font-size:13px;font-weight:800;color:#92400e;">Please clock in and out for lunch &mdash; every day.</div>'+
    '<div style="font-size:12px;color:#b45309;margin-top:2px;">Use the clock in / clock out portion on your timesheet for the start <strong>and</strong> end of every lunch. Accurate punches keep everyone&rsquo;s pay correct.</div></td>'+
    '</tr></table></td></tr>'+
    '<tr><td style="padding:0 18px 16px;"><div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:#64748b;text-transform:uppercase;margin-bottom:6px;">Month To Date Missed Punches</div>'+
    punchHtml + '</td></tr>'+
    '</table>';
}

// Build the full HTML email + webhook payload for one store.
function buildNpsPayload(shortName, surveys, salesStores, dir){
  const fullKey = shortName + " Xfinity Store";
  const smEmail  = (dir.storeManagers || {})[fullKey] || "";
  const asmEmail = (dir.storeAMs || {})[fullKey] || "";
  const dmEmail  = (dir.storeDMs || {})[fullKey] || "";
  const smName   = (dir.storeManagerNames || {})[fullKey] || "";

  const repEmails = ((dir.storeEmployees || {})[fullKey] || []).map(e => (e && typeof e === 'object') ? (e.email || '') : e).filter(Boolean);
  const to = smEmail || asmEmail || dmEmail || (repEmails[0] || "") || NPS_CONFIG.MY_EMAIL;
  const seen = new Set([to.toLowerCase()]);
  const cc = [asmEmail, dmEmail, ...repEmails, NPS_CONFIG.MY_EMAIL].filter(e => {
    if(!e) return false;
    const k = e.toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  }).join(",");

  const good = surveys.filter(s => npsBucket(s.score) === "good");
  const ok   = surveys.filter(s => npsBucket(s.score) === "ok");
  const bad  = surveys.filter(s => npsBucket(s.score) === "bad");
  const tnps = surveys.length ? Math.round(((good.length - bad.length) / surveys.length) * 100) : 0;

  const dates = surveys.map(s => s.txnDate).filter(Boolean).sort();
  const dateLabel = dates.length
    ? (dates[0] === dates[dates.length-1]
        ? npsPrettyDate(dates[0])
        : npsPrettyDate(dates[0]) + " &ndash; " + npsPrettyDate(dates[dates.length-1]))
    : npsPrettyDate(npsDateStr(new Date()));

  // --- Store performance row (Sales Report "Store Rank") + tone fn ---
  const row = (salesStores || []).find(s => String(s.name).trim().toLowerCase() === shortName.toLowerCase());
  let tone = () => "neutral";
  if(row){
    const med = {};
    ["gpTrend","mobileCR","fiscalCR","nonTrad","gigPct","plusMix","newToUpg","accPerDev","nps"].forEach(k => {
      med[k] = npsMedian(salesStores.map(s => s[k]));
    });
    tone = k => row[k] >= med[k] ? "good" : "bad";
  }

  // --- Header (briefing label, store, region/SM/DM, rank pill, Monthly Goal panel) ---
  const rankPill = (row && row.rank != null)
    ? '<span style="background:#f97316;color:#ffffff;font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 13px;border-radius:999px;">RANK&nbsp;#' + row.rank + '</span>'
    : '';
  const subLine = row
    ? npsEsc(row.region || "") + ' &nbsp;&bull;&nbsp; SM: ' + npsEsc(smName || row.sm || "No Mgr") + ' &nbsp;&bull;&nbsp; DM: ' + npsEsc(row.dm || "")
    : 'SM: ' + npsEsc(smName || "No Mgr");
  const headerHtml =
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>' +
    '<td style="vertical-align:middle;">' +
    '<div style="color:#9fc0ff;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">BLUFOX&nbsp;MOBILE &nbsp;&bull;&nbsp; DAILY BRIEFING</div>' +
    '<div style="color:#ffffff;font-size:28px;font-weight:800;letter-spacing:-0.5px;margin-top:6px;">' + npsEsc(shortName) + '</div>' +
    '<div style="color:#c7d6f3;font-size:13px;margin-top:5px;">' + subLine + '</div>' +
    '</td><td style="vertical-align:top;text-align:right;white-space:nowrap;">' + rankPill + '</td>' +
    '</tr></table>' +
    npsMonthlyGoalHtml(shortName) +
    npsDailyGoalHtml(shortName, row); /* BFX SMART TARGETS: 🎯 Today's Targets panel */

  // --- Team table (Rep Rank) ---
  let teamHtml = "";
  const allowedStores = new Set((salesStores || []).map(s => String(s.name).trim().toLowerCase()));
  const pool = (NPS_REPS || []).filter(r => allowedStores.has(String(r.store).trim().toLowerCase()));
  const storeReps = pool.filter(r => String(r.store).trim().toLowerCase() === shortName.toLowerCase())
    .sort((a,b) => a.rank - b.rank);
  if(storeReps.length){
    const repTc = r => (NPS_TCHARTS.byRep || {})[String(r.name).trim().toLowerCase() + "||" + shortName.toLowerCase()] || 0;
    const medGP   = npsMedian(pool.map(r => r.gp));
    const medPlus = npsMedian(pool.map(r => r.plusMix));
    const medGig  = npsMedian(pool.map(r => r.gigPct));
    const medTc   = npsMedian(pool.map(r => (NPS_TCHARTS.byRep || {})[String(r.name).trim().toLowerCase() + "||" + String(r.store).trim().toLowerCase()] || 0));
    const cv = (v, med) => v >= med ? "#047857" : "#b91c1c";
    const th = (t, ctr) => '<td style="background:#0f172a;color:#cbd5e1;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;font-weight:700;padding:6px 4px;white-space:nowrap;' + (ctr ? "text-align:center;" : "") + '">' + t + '</td>';
    const td = (v, color, extra) => '<td style="font-size:12px;padding:6px 4px;border-bottom:1px solid #e2e8f0;color:' + (color || "#0f172a") + ';white-space:nowrap;' + (extra || "") + '">' + v + '</td>';
    const ctr = "text-align:center;";
    const rowsHtml = storeReps.map(r =>
      '<tr>' +
      td('#' + r.rank, "#2563eb", "font-weight:700;") +
      td(npsEsc(r.name), "#0f172a", "font-weight:700;white-space:normal;min-width:96px;") +
      td(npsMoneyFmt(r.gp), cv(r.gp, medGP), "font-weight:700;") +
      td(npsPctFmt(r.plusMix), cv(r.plusMix, medPlus)) +
      td(npsPctFmt(r.gigPct), cv(r.gigPct, medGig)) +
      td(r.mobile, "#0f172a", ctr + "font-weight:700;") +
      td(r.tablet, "#475569", ctr) +
      td(r.watch, "#475569", ctr) +
      td(repTc(r), cv(repTc(r), medTc), ctr + "font-weight:700;") +
      '</tr>').join("");
    teamHtml =
      '<div style="font-size:11px;color:#64748b;margin:0 0 8px;line-height:1.5;">Where each rep ranks <strong>nationally</strong> this month. Green = top half of all our reps, red = bottom half. XM/Tab/Watch = devices sold; T-Charts = savings sheets ran.</div>' +
      '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">' +
      '<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;min-width:480px;">' +
      '<tr>' + th("Nat&rsquo;l #") + th("Rep") + th("GP $") + th("Plus %") + th("Gig %") + th("XM", 1) + th("Tab", 1) + th("Watch", 1) + th("T-Charts", 1) + '</tr>' +
      rowsHtml + '</table></div>';
  }

  // --- Action items: open orders + lead follow-ups ---
  const openCount = (NPS_CRM.open  || {})[shortName] || 0;
  const agedCount = (NPS_CRM.aged  || {})[shortName] || 0;
  const leadObj   = (NPS_CRM.leads || {})[shortName] || { approved: 0, resubmit: 0 };
  const leadCount = (leadObj.approved || 0) + (leadObj.resubmit || 0);
  const crmLoaded = NPS_CRM.loaded;
  const punchCount = (NPS_PUNCH.byStore || {})[shortName] || 0;
  let actionHtml = "";
  if(crmLoaded){
    const SHOW_MAX = 5;
    const openItems = ((NPS_CRM.openList || {})[shortName] || []);
    const leadItems = ((NPS_CRM.leadList || {})[shortName] || []);
    const allClear = openCount === 0 && leadCount === 0;

    const subHead = (n, label, sub) =>
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:14px;"><tr>' +
      '<td width="50" align="center" style="vertical-align:top;"><div style="font-size:26px;font-weight:800;color:' + (n ? "#ea580c" : "#047857") + ';line-height:1.1;">' + n + '</div></td>' +
      '<td style="vertical-align:top;padding-left:6px;"><div style="font-size:13px;font-weight:800;color:#0f172a;text-transform:uppercase;letter-spacing:0.5px;">' + label + '</div>' +
      (sub ? '<div style="font-size:12px;color:#64748b;margin-top:1px;">' + sub + '</div>' : '') + '</td></tr></table>';

    const orderLine = o =>
      '<div style="padding:7px 0 7px 56px;border-bottom:1px solid #fde4cf;">' +
      '<div style="font-size:13px;font-weight:700;color:#0f172a;">' + npsEsc(npsTitleCase(o.customer) || "Unknown Customer") +
      ' <span style="font-weight:500;color:#94a3b8;font-size:11px;">WO ' + npsEsc(o.wo) + '</span></div>' +
      '<div style="font-size:12px;color:#64748b;margin-top:1px;">' + npsEsc(o.product || "") +
      (o.rep ? ' &bull; sold by ' + npsEsc(o.rep) : '') +
      ' &bull; <span style="font-weight:700;color:' + (o.age >= 30 ? "#b91c1c" : "#9a3412") + ';">' + o.age + ' days open</span></div></div>';

    const leadLine = l =>
      '<div style="padding:7px 0 7px 56px;border-bottom:1px solid #fde4cf;">' +
      '<div style="font-size:13px;font-weight:700;color:#0f172a;">' + npsEsc(npsTitleCase(l.customer) || "Unknown Customer") + ' ' +
      (l.bucket === "approved"
        ? '<span style="background:#ecfdf5;border:1px solid #10b981;color:#047857;border-radius:999px;padding:1px 8px;font-size:10px;font-weight:800;letter-spacing:0.5px;">APPROVED &mdash; CALL TO SELL</span>'
        : '<span style="background:#fffbeb;border:1px solid #f59e0b;color:#b45309;border-radius:999px;padding:1px 8px;font-size:10px;font-weight:800;letter-spacing:0.5px;">RESUBMIT TO CREDIT TEAM</span>') +
      '</div>' +
      '<div style="font-size:12px;color:#64748b;margin-top:1px;">' + npsEsc(l.phone || "no phone on file") +
      (l.rep ? ' &bull; submitted by ' + npsEsc(l.rep) : '') + '</div></div>';

    const moreLine = n => n > 0
      ? '<div style="font-size:12px;color:#9a3412;font-weight:700;padding:7px 0 0 56px;">+ ' + n + ' more in the Store CRM</div>'
      : '';

    let detail = "";
    if(!allClear){
      detail += subHead(openCount, "Open Orders to close out",
        openCount ? "Oldest first" + (agedCount ? ' &bull; <span style="color:#b91c1c;font-weight:700;">' + agedCount + ' aged 30+ days</span>' : "") : "Nothing pending &mdash; clear");
      detail += openItems.slice(0, SHOW_MAX).map(orderLine).join("") + moreLine(openCount - Math.min(openItems.length, SHOW_MAX));
      detail += subHead(leadCount, "Lead Follow-Ups to work",
        leadCount ? (leadObj.approved || 0) + " approved to contact &bull; " + (leadObj.resubmit || 0) + " to resubmit" : "Nothing pending &mdash; clear");
      detail += leadItems.slice(0, SHOW_MAX).map(leadLine).join("") + moreLine(leadCount - Math.min(leadItems.length, SHOW_MAX));
    }

    actionHtml =
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:2px solid ' + (allClear ? "#10b981" : "#f97316") + ';border-radius:14px;overflow:hidden;">' +
      '<tr><td style="background:' + (allClear ? "#ecfdf5" : "#fff7ed") + ';padding:14px 18px 6px;">' +
      '<div><span style="display:inline-block;background:' + (allClear ? "#10b981" : "#ea580c") + ';color:#ffffff;font-size:13px;font-weight:800;letter-spacing:0.5px;padding:5px 12px;border-radius:8px;">&#9989;&nbsp; ACTION ITEMS FOR TODAY</span></div>' +
      '<div style="color:' + (allClear ? "#047857" : "#9a3412") + ';font-size:12px;margin-top:8px;line-height:1.5;">Orders to close out and leads to call back. Knock these out first.</div></td></tr>' +
      '<tr><td style="background:' + (allClear ? "#ecfdf5" : "#fff7ed") + ';padding:4px 18px 14px;">' +
      (allClear

function npsHookReady(){
  return /^https:\/\/hooks\.zapier\.com\//.test(NPS_CONFIG.WEBHOOK_URL);
}

async function npsPostWebhook(payload){
  // text/plain keeps this a "simple" CORS request so Zapier's catch hook
  // accepts it without a preflight (same trick as the DM Visit Guide).
  const resp = await fetch(NPS_CONFIG.WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=UTF-8" },
    body: JSON.stringify(payload)
  });
  if(!resp.ok) throw new Error("Webhook HTTP " + resp.status);
}

// Group surveys by store, then email EVERY store in the RSD roster (not just
// stores that had surveys). Stores with no surveys still get the full briefing.
async function npsSendEmails(surveys, salesStores, dir){
  // Best-effort aux data. Failures never block the email itself.
  await Promise.all([
    npsFetchTSheets().catch(e => console.warn("t-sheets unavailable:", e)),
    npsFetchCrmActions().catch(e => console.warn("crm actions unavailable:", e)),
    npsFetchPunches().catch(e => console.warn("punch data unavailable:", e)),
    npsFetchConversion().catch(e => console.warn("conversion unavailable:", e)),
    npsFetchTargets().catch(e => console.warn("targets unavailable:", e)),
    bfxFetchNpsMtd().catch(e => console.warn("nps-mtd unavailable:", e)) /* BFX SMART TARGETS */
  ]);
  // Freshness gate: don't send on stale daily data — wait until today's files are up.
  const _today = npsLocalYMD(new Date());
  const _sales = NPS_FRESH["data/Sales Report.xlsx"];
  const _punch = NPS_FRESH["data/punch-data.xlsx"];
  const _stale = [];
  if(_sales && _sales.date && _sales.date !== _today) _stale.push("Sales Report (" + _sales.date + ")");
  if(_punch && _punch.date && _punch.date !== _today) _stale.push("Punch data (" + _punch.date + ")");
  if(_stale.length){
    console.warn("NPS send skipped — data not current for today (" + _today + "): " + _stale.join(", ") + ". Will send on next upload once updated.");
    return { sent: 0, storeCount: 0, errors: [], skipped: true, stale: _stale };
  }
  const groups = {};
  surveys.forEach(s => { const sk = npsSurveyStore(s); if(sk){ (groups[sk] = groups[sk] || []).push(s); } });
  // Email EVERY store in the RSD roster, not just stores that had surveys.
  const storeNames = new Set();
  (salesStores || []).forEach(s => { if(s && s.name) storeNames.add(String(s.name).trim()); });
  Object.keys(groups).forEach(k => storeNames.add(k));
  let sent = 0; const errors = [];
  for(const shortName of Array.from(storeNames).sort()){
    try {
      const payload = buildNpsPayload(shortName, groups[shortName] || [], salesStores, dir);
      await npsPostWebhook(payload);
      sent++;
    } catch(e){ errors.push(shortName + ": " + e.message); }
  }
  return { sent: sent, errors: errors, storeCount: storeNames.size };
}

/* ===================== DISTRICT RESOLUTION =====================
   Districts are owned by the Admin Panel Directory
   (blufoxmobile.github.io/Admin-Panel-Directory), which publishes two keys into
   Daily-Sales-Report/data/store-directory.json:

     districts      : [{ id, name, dm }]
     storeDistricts : { "<Store> Xfinity Store": "<district id>" }

   Those are the source of truth. Until they are published, we fall back to the
   DM email already sitting on every store in storeDMs and name it from the table
   below — so this page groups correctly both before and after the panel ships,
   and a store Jeff moves between districts in the panel moves here on next load
   with no code change. */
const NPS_DISTRICT_NAMES = {
  "idhorajiwala@blufoxmobile.com": "North Side",
  "jucarrillo@blufoxmobile.com":   "South Side",
  "jcabrales@blufoxmobile.com":    "East Side",
  "mbrooks@blufoxmobile.com":      "Big South",
  "tchowdhury@blufoxmobile.com":   "West Side",
  "jbilbrey@blufoxmobile.com":     "Director"
};
const NPS_NO_DISTRICT = { id: "__none", name: "Unassigned", dm: "", dmName: "" };
// Below this many surveys a district's rank is noise, not performance.
const NPS_MIN_N = 8;

// A DM's display name is a property of the person, not the store — so if this
// store has no storeDMNames entry, borrow one from any other store they run.
function npsDmFullName(email, fullKey){
  if(!email) return "";
  const names = (DIR && DIR.storeDMNames) || {};
  const dms = (DIR && DIR.storeDMs) || {};
  const want = email.toLowerCase();
  // only trust this store's name if this store is actually run by `email`
  if(fullKey && names[fullKey] && String(dms[fullKey] || "").toLowerCase() === want)
    return names[fullKey];
  for(const k in dms){
    if(dms[k] && String(dms[k]).toLowerCase() === want && names[k]) return names[k];
  }
  return dmShort(email);
}

function npsDistrictFor(storeKey){
  if(!storeKey || String(storeKey).indexOf("Unmatched") >= 0) return NPS_NO_DISTRICT;
  const fullKey = storeKey + " Xfinity Store";
  const list = (DIR && Array.isArray(DIR.districts)) ? DIR.districts : null;
  const dm   = ((DIR && DIR.storeDMs) || {})[fullKey] || "";

  // 1. explicit assignment from the Admin Panel wins
  const assignedId = ((DIR && DIR.storeDistricts) || {})[fullKey];
  if(list && assignedId){
    const d = list.find(x => x && x.id === assignedId);
    if(d) return { id: d.id, name: d.name || d.id, dm: d.dm || dm,
                   dmName: d.dmName || npsDmFullName(d.dm || dm, fullKey) };
  }
  // 2. otherwise match the store's DM against a declared district
  if(dm){
    const want = dm.toLowerCase();
    if(list){
      const d = list.find(x => x && x.dm && String(x.dm).toLowerCase() === want);
      if(d) return { id: d.id, name: d.name || d.id, dm: dm,
                     dmName: d.dmName || npsDmFullName(dm, fullKey) };
    }
    // 3. last resort — one district per DM, named from the table above
    return { id: want, name: NPS_DISTRICT_NAMES[want] || (dmShort(dm) + " — District"),
             dm: dm, dmName: npsDmFullName(dm, fullKey) };
  }
  return NPS_NO_DISTRICT;
}

function render(){
  if(!DATA || !DIR) return;
  const storeF = document.getElementById("storeFilter").value;
  const dmF = document.getElementById("dmFilter").value;

  let list = currentSurveys();
  if(storeF) list = list.filter(s => npsSurveyStore(s) === storeF);
  if(dmF) list = list.filter(s => npsDistrictFor(npsSurveyStore(s) || "").id === dmF);
  list = list.filter(s => bands[npsBucket(s.score)]);

  // summary (band filter applied so the cards match what you see)
  const good = list.filter(s => npsBucket(s.score) === "good").length;
  const ok   = list.filter(s => npsBucket(s.score) === "ok").length;
  const bad  = list.filter(s => npsBucket(s.score) === "bad").length;
  const tnps = list.length ? Math.round(((good - bad) / list.length) * 100) : 0;
  const withComments = list.filter(s => s.comment).length;
  const cmtPct = list.length ? Math.round((withComments / list.length) * 100) : 0;
  document.getElementById("summary").innerHTML =
    sumCard("SURVEYS", list.length, "", "all responses") +
    sumCard("GOOD", good, "k-good", "9–10 promoters") +
    sumCard("NEUTRAL", ok, "k-neutral", "score of 8") +
    sumCard("NEEDS ATTN", bad, "k-bad", "0–7 detractors") +
    sumCard("tNPS", fmtNps(tnps), "k-nps", "promoters − detractors") +
    sumCard("WITH COMMENTS", withComments, "", cmtPct + "% of surveys") +
    bfxToGoalSummaryCard(storeF, dmF); /* BFX v1.1: MTD 9–10s-to-80 card */

  // ---- group: survey -> store -> district ----
  const storeGroups = {};
  list.forEach(s => {
    const k = npsSurveyStore(s) || ("⚠ Unmatched: " + s.storeRaw);
    (storeGroups[k] = storeGroups[k] || []).push(s);
  });
  const storeKeys = Object.keys(storeGroups);

  const dist = {};
  storeKeys.forEach(k => {
    const info = npsDistrictFor(k);
    const bucket = dist[info.id] || (dist[info.id] = { info: info, stores: [], surveys: [] });
    bucket.stores.push(k);
    for(let x = 0; x < storeGroups[k].length; x++) bucket.surveys.push(storeGroups[k][x]);
  });

  // Districts rank best-first — this is a leaderboard, and the rank numeral
  // has to mean something. Stores INSIDE a district stay worst-first, because
  // that list is a work queue, not a scoreboard.
  const dKeys = Object.keys(dist).sort((a, b) => {
    if(a === "__none") return 1;
    if(b === "__none") return -1;
    const la = dist[a].surveys.length >= NPS_MIN_N, lb = dist[b].surveys.length >= NPS_MIN_N;
    if(la !== lb) return la ? -1 : 1;   // don't rank a 3-survey district above a 28-survey one
    return npsTnps(dist[b].surveys) - npsTnps(dist[a].surveys)
        || dist[b].surveys.length - dist[a].surveys.length
        || dist[a].info.name.localeCompare(dist[b].info.name);
  });
  dKeys.forEach(id => {
    dist[id].stores.sort((a, b) => {
      const badA = storeGroups[a].filter(s => npsBucket(s.score) === "bad").length;
      const badB = storeGroups[b].filter(s => npsBucket(s.score) === "bad").length;
      return badB - badA || a.localeCompare(b);
    });
  });

  // Filtered down to one district? Open it — nobody wants to click twice.
  const solo = dKeys.length === 1;
  const out = dKeys.map((id, n) => districtBlockHtml(dist[id], storeGroups, n + 1, solo)).join("");

  document.getElementById("results").innerHTML = out ||
    '<div class="empty">No surveys match the current filters' + (tab === "yesterday" ? " in the last upload batch." : " this month.") + '</div>';

  const sd = document.getElementById("statDistricts");
  if(sd) sd.textContent = String(dKeys.length);
  const ss = document.getElementById("statStores");
  if(ss) ss.textContent = String(storeKeys.length);
  const rc = document.getElementById("resultCount");
  if(rc) rc.textContent = list.length + " surveys across " + dKeys.length +
    " districts and " + storeKeys.length + " stores.";
}

/* ===================== NESTED STORE → REP → BUCKET RENDERING ===================== */
const NPS_CARET = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// tNPS = % promoters (9–10) − % detractors (0–7), rounded. Range −100..+100.
function npsTnps(surveys){
  if(!surveys.length) return 0;
  let g = 0, b = 0;
  surveys.forEach(s => { const k = npsBucket(s.score); if(k === "good") g++; else if(k === "bad") b++; });
  return Math.round(((g - b) / surveys.length) * 100);
}
function npsScoreClass(v){ return v >= 30 ? "pos" : v >= 0 ? "mid" : "neg"; }
function fmtNps(v){ return v + '<span class="pct">%</span>'; }  // NPS scores render as percentages (e.g. 15%) per Jeff — no +/- sign prefix on positives.
function bucketChip(k){ return k === "good" ? "g" : k === "ok" ? "n" : "b"; }
function npsTitleWord(w){ return w ? w.charAt(0).toUpperCase() + w.slice(1) : ""; }

// Resolve an NTID like "bp-emcfal330" → a friendly display name. Prefers the
// Rep Rank name when that data is loaded (after an upload); otherwise derives a
// name from the NTID, enriched by the store's employee email list when a
// confident first-initial + last-name prefix match exists.
function npsRepDisplay(ntid, storeKey){
  if(!ntid) return { name: "Unknown rep", ntid: "" };
  const real = (typeof npsRepName === "function") ? npsRepName(ntid) : "";
  if(real) return { name: real, ntid: ntid };
  const m = String(ntid).toLowerCase().match(/^bp-([a-z])([a-z]+?)\d/);
  if(!m) return { name: ntid, ntid: ntid };
  const ini = m[1], lastFrag = m[2];
  let last = lastFrag;
  const emails = (DIR && DIR.storeEmployees && DIR.storeEmployees[(storeKey || "") + " Xfinity Store"]) || [];
  // storeEmployees entries are {first,last,email} objects (older data may hold
  // plain email strings). Prefer the directory's real first/last name; fall
  // back to the email local-part.
  let best = "", bestFull = "";
  emails.forEach(e => {
    const obj   = (e && typeof e === "object") ? e : null;
    const first = obj ? String(obj.first || "") : "";
    const lastN = obj ? String(obj.last  || "") : "";
    const mail  = String((obj ? obj.email : e) || "");
    const dl    = lastN.toLowerCase().replace(/[^a-z]/g, "");
    if(!bestFull && dl && first.charAt(0).toLowerCase() === ini &&
       (dl.indexOf(lastFrag) === 0 || lastFrag.indexOf(dl) === 0)){
      bestFull = first + " " + lastN;
    }
    const lp = mail.split("@")[0].toLowerCase().replace(/[^a-z]/g, "");
    if(!lp || lp.charAt(0) !== ini) return;
    const lpLast = lp.slice(1);
    if(lpLast.indexOf(lastFrag) === 0 || lastFrag.indexOf(lpLast) === 0){
      if(lpLast.length > best.length) best = lpLast;
    }
  });
  if(bestFull) return { name: bestFull, ntid: ntid };
  if(best) last = best;
  return { name: ini.toUpperCase() + ". " + npsTitleWord(last), ntid: ntid };
}

function surveyRowHtml(s){
  const chip = bucketChip(npsBucket(s.score));
  const hasC = s.comment && String(s.comment).trim().length;
  const top =
    (s.txnType ? '<span class="txn">' + npsEsc(s.txnType) + '</span>' : '') +
    '<span class="date">' + npsEsc(npsPrettyDate(s.txnDate)) + '</span>';
  return '<div class="survey">' +
    '<div class="score-chip ' + chip + '">' + s.score + '</div>' +
    '<div class="survey-body">' +
      '<div class="survey-top">' + top + '</div>' +
      '<div class="comment ' + (hasC ? '' : 'none') + '">' +
        (hasC ? '“' + npsEsc(s.comment) + '”' : 'No comment left') +
      '</div>' +
    '</div>' +
  '</div>';
}

function bucketBlockHtml(cls, label, surveys){
  const sorted = surveys.slice().sort((a,b) =>
    (b.txnDate || "").localeCompare(a.txnDate || "") || a.score - b.score);
  const body = sorted.length
    ? sorted.map(surveyRowHtml).join('')
    : '<div class="empty-bucket">No surveys in this band.</div>';
  return '<div class="bucket ' + cls + '">' +
    '<button class="bucket-head" aria-expanded="false" onclick="npsToggle(this)">' +
      '<span class="caret">' + NPS_CARET + '</span>' +
      '<span class="swatch"></span>' +
      '<span class="label">' + label + '</span>' +
      '<span class="count-pill" aria-label="' + surveys.length + ' survey' +
        (surveys.length === 1 ? '' : 's') + '">' + surveys.length + '</span>' +
    '</button>' +
    '<div class="collapse"><div class="collapse-inner"><div class="surveys">' + body + '</div></div></div>' +
  '</div>';
}

// Rep's official Column D "SMS tNPS" from the morning Express Report. The upload
// stores it in nps-mtd.json -> employees[ntid].officialTnps. This is the score
// Jeff wants shown next to every rep (NOT the survey-computed tNPS, which can
// differ). Returns null when the rep isn't in the Express Report yet, so callers
// can fall back to the survey tNPS and never render a blank.
function npsColumnD(ntid){
  if(!ntid || !DATA_MTD || !DATA_MTD.employees) return null;
  const e = DATA_MTD.employees[ntid];
  const v = e && e.officialTnps;
  return (typeof v === "number") ? v : null;
}

function repBlockHtml(ntid, storeKey, surveys){
  const g = surveys.filter(s => npsBucket(s.score) === "good");
  const n = surveys.filter(s => npsBucket(s.score) === "ok");
  const b = surveys.filter(s => npsBucket(s.score) === "bad");
  const surveyTnps = npsTnps(surveys);
  // Headline = the rep's Column D SMS tNPS from the Express Report; only fall
  // back to the survey-computed tNPS when Column D isn't available for this rep.
  const colD = npsColumnD(ntid);
  const tnps = (colD !== null) ? colD : surveyTnps;
  const cls = npsScoreClass(tnps);
  const heroCap = (colD !== null) ? "NPS" : "tNPS";
  const who = npsRepDisplay(ntid, storeKey);
  const srRep = who.name + ", " + heroCap + " " + tnps + ", " + surveys.length + " surveys, " +
    g.length + " good, " + n.length + " neutral, " + b.length + " needing attention";

  return '<div class="rep">' +
    '<button class="rep-head" aria-expanded="false" aria-label="' + npsEsc(srRep) + '" onclick="npsToggle(this)">' +
      '<span class="caret">' + NPS_CARET + '</span>' +
      '<div class="rep-id">' +
        '<span class="name">' + npsEsc(who.name) + '</span> ' +
        (who.ntid ? '<span class="ntid">' + npsEsc(who.ntid) + '</span>' : '') +
        '<div class="meta">' +
          '<span class="tot">' + surveys.length + ' survey' + (surveys.length === 1 ? '' : 's') + '</span>' +
          '<span class="mini g">' + g.length + ' good</span>' +
          '<span class="mini n">' + n.length + ' ok</span>' +
          '<span class="mini b">' + b.length + ' attn</span>' +
        '</div>' +
      '</div>' +
      '<div class="rep-hero hero-' + cls + '" aria-hidden="true">' +
        '<div class="num">' + fmtNps(tnps) + '</div>' +
        '<div class="cap">' + heroCap + '</div>' +
      '</div>' +
    '</button>' +
    '<div class="collapse"><div class="collapse-inner"><div class="buckets">' +
      bucketBlockHtml('good', 'Good (9–10)', g) +
      bucketBlockHtml('neutral', 'Neutral (8)', n) +
      bucketBlockHtml('bad', 'Needs Attention (0–7)', b) +
    '</div></div></div>' +
  '</div>';
}

function storeBlockHtml(storeKey, surveys){
  const fullKey = storeKey + " Xfinity Store";
  const sm = (DIR.storeManagerNames || {})[fullKey] || "";
  const g = surveys.filter(s => npsBucket(s.score) === "good").length;
  const n = surveys.filter(s => npsBucket(s.score) === "ok").length;
  const b = surveys.filter(s => npsBucket(s.score) === "bad").length;
  const tnps = npsTnps(surveys);
  // Store headline = the OFFICIAL store NPS from the Daily Sales Report
  // (NPS_FISCAL) whenever it exists, on both tabs, so the store always shows its
  // real Sales-Report number. Falls back to survey tNPS when there isn't one.
  const official = NPS_FISCAL[String(storeKey).trim().toLowerCase()];
  const headlineNps = (typeof official === "number") ? official : tnps;
  const cls = npsScoreClass(headlineNps);

  // group this store's surveys by rep (ntid)
  const repGroups = {};
  surveys.forEach(s => { const key = s.ntid || "(no rep id)"; (repGroups[key] = repGroups[key] || []).push(s); });
  const repKeys = Object.keys(repGroups).sort((a, b2) => {
    const ra = repGroups[a], rb = repGroups[b2];
    const badA = ra.filter(s => npsBucket(s.score) === "bad").length;
    const badB = rb.filter(s => npsBucket(s.score) === "bad").length;
    return badB - badA || npsTnps(ra) - npsTnps(rb) || rb.length - ra.length;
  });
  const repsHtml = repKeys.map(rk => repBlockHtml(rk, storeKey, repGroups[rk])).join('');

  // DM is deliberately NOT repeated here — the district header above owns it.
  const metaBits = [];
  if(sm) metaBits.push("SM " + npsEsc(sm));
  metaBits.push(repKeys.length + " rep" + (repKeys.length === 1 ? '' : 's'));
  metaBits.push(surveys.length + " survey" + (surveys.length === 1 ? '' : 's'));
  const scope = (typeof official === "number")
    ? '<span class="scope">Fiscal MTD · Sales Report</span>' : '<span class="scope">Survey tNPS</span>';

  const srStore = storeKey + ", NPS " + headlineNps + ", " + (sm ? "manager " + sm + ", " : "") +
    repKeys.length + " reps, " + surveys.length + " surveys, " +
    g + " good, " + n + " neutral, " + b + " needing attention";

  return '<div class="store">' +
    '<button class="store-head" aria-expanded="false" aria-label="' + npsEsc(srStore) + '" onclick="npsToggle(this)">' +
      '<span class="caret">' + NPS_CARET + '</span>' +
      '<div class="store-id">' +
        '<div class="name">' + npsEsc(storeKey) + '</div>' +
        '<div class="meta">' + metaBits.join(" · ") + scope + '</div>' +
        bfxStoreGoalLineHtml(storeKey) + /* BFX v1.1: MTD surveys-to-80 pill */
      '</div>' +
      '<div class="minis" aria-hidden="true">' +
        '<span class="mini g">' + g + '</span>' +
        '<span class="mini n">' + n + '</span>' +
        '<span class="mini b">' + b + '</span>' +
      '</div>' +
      '<div class="nps-badge nps-' + cls + '" aria-hidden="true">' +
        '<div class="num">' + fmtNps(headlineNps) + '</div>' +
        '<div class="cap">NPS</div>' +
      '</div>' +
    '</button>' +
    '<div class="collapse"><div class="collapse-inner">' + bfxDashTargetsHtml(storeKey) + '<div class="reps">' + repsHtml + '</div></div></div>' +
  '</div>';
}

/* ===================== DISTRICT BLOCK =====================
   The top level of the ledger. Ranked best-first, with a centre-zero meter that
   reads tNPS as a deviation rather than a percentage bar — a district at -12
   should look like it is under the line, not like a nearly-empty progress bar. */
function districtBlockHtml(d, storeGroups, rank, openByDefault){
  const sv = d.surveys;
  const g = sv.filter(s => npsBucket(s.score) === "good").length;
  const n = sv.filter(s => npsBucket(s.score) === "ok").length;
  const b = sv.filter(s => npsBucket(s.score) === "bad").length;
  const tnps = npsTnps(sv);
  const cls = npsScoreClass(tnps);
  const meterCls = tnps < 0 ? "neg" : (tnps >= 30 ? "pos" : "mid");
  const width = Math.min(50, Math.abs(tnps) / 2);

  const metaBits = [];
  if(d.info.dmName) metaBits.push('<span class="dm">' + npsEsc(d.info.dmName) + '</span>');
  metaBits.push(d.stores.length + " store" + (d.stores.length === 1 ? '' : 's'));
  metaBits.push(sv.length + " survey" + (sv.length === 1 ? '' : 's'));
  // Say which window this number covers. The three levels of this page show
  // three different measures and the 11px badge caption cannot carry that.

  // The sharpest thing a customer said in this district today, in the row's
  // dead centre — the reason to read the row rather than scan it.
  const withC = sv.filter(x => x.comment && String(x.comment).trim());
  withC.sort((x, y) => x.score - y.score);
  const peek = withC.length ? '\u201C' + npsEsc(String(withC[0].comment).trim()) + '\u201D' : '';

  // A rank numeral is a promise that the order means something. Below the
  // confidence floor it doesn't, and the row says so rather than pretending.
  const thin = sv.length < NPS_MIN_N;
  const storesHtml = d.stores.map(k => storeBlockHtml(k, storeGroups[k])).join('');
  const open = openByDefault ? "true" : "false";
  const sr = d.info.name + " district, rank " + rank + ", tNPS " + tnps + ", " +
    d.stores.length + " stores, " + sv.length + " surveys, " +
    g + " good, " + n + " neutral, " + b + " needing attention" + (thin ? ", thin sample" : "") +
    (withC.length ? ". Lowest-scored comment: " + String(withC[0].comment).trim() : "");

  return '<div class="district' + (openByDefault ? ' open' : '') + '"' +
      (d.info.id === "__none" ? ' data-unmatched' : '') + ' style="--i:' + rank + '">' +
    '<button class="district-head' + (thin ? ' low-n' : '') + '" aria-expanded="' + open + '"' +
      ' aria-label="' + npsEsc(sr) + '" onclick="npsToggle(this)">' +
      '<span class="caret">' + NPS_CARET + '</span>' +
      '<span class="rank">' + (rank < 10 ? '0' : '') + rank + '</span>' +
      '<div class="district-id">' +
        '<div class="dname">' + npsEsc(d.info.name) + '</div>' +
        '<div class="dmeta">' + metaBits.join(" · ") + '</div>' +
      '</div>' +
      '<div class="peek" aria-hidden="true">' + peek + '</div>' +
      '<div class="meter" aria-hidden="true">' +
        '<span class="' + meterCls + '" style="--w:' + width + '%"></span>' +
      '</div>' +
      '<div class="minis" aria-hidden="true">' +
        '<span class="mini g">' + g + '</span>' +
        '<span class="mini n">' + n + '</span>' +
        '<span class="mini b">' + b + '</span>' +
      '</div>' +
      '<div class="nps-badge nps-' + cls + '" aria-hidden="true">' +
        '<div class="num">' + fmtNps(tnps) + '</div>' +
        '<div class="cap">tNPS</div>' +
      '</div>' +
    '</button>' +
    '<div class="collapse' + (openByDefault ? ' open' : '') + '"><div class="collapse-inner">' +
      '<div class="stores">' + storesHtml + '</div>' +
    '</div></div>' +
  '</div>';
}

/* BFX SMART TARGETS: dashboard version of the 🎯 Today's Targets panel — the
   exact same computation + renderer the email uses, wrapped in the header's
   dark navy so the inner tiles read correctly on the light page. */
function bfxDashTargetsHtml(storeKey){
  // BFX: the daily & monthly TARGET panel is hidden on the NPS dashboard per
  // Jeff's request — this page should show NPS scores only. The engine and
  // renderer below are kept intact (the morning-briefing email still uses them);
  // we simply return nothing so no target panel is drawn on the store cards.
  return "";
  if(String(storeKey).indexOf("Unmatched") >= 0) return "";
  let inner = "";
  try { inner = npsDailyGoalHtml(storeKey); } catch(e){ console.warn("targets panel:", e); }
  if(!inner) return "";
  return '<div style="background:#0f2350;background:linear-gradient(135deg,#0f2350 0%,#1e3a8a 60%,#2b4ba0 100%);border-radius:14px;padding:2px 12px 12px;margin:0 0 14px;">' + inner + '</div>';
}

/* BFX v1.1: per-store MTD surveys-to-goal line — Jeff's headline ask. Reads the
   fiscal-MTD Medallia buckets (BFX_NPSMTD: score>=9 promoter, 8 passive, <=7
   detractor) and asks BFX.mixGoal — the exact math in Jeff's NPS Calculator
   2025.xlsx — how many more 9–10 surveys reach the 80 goal. Rendered as a
   pill on every store card head. */
function bfxStoreGoalLineHtml(storeKey){
  if(String(storeKey).indexOf("Unmatched") >= 0) return "";
  const m = (BFX_NPSMTD.byStore || {})[String(storeKey).trim().toLowerCase()];
  let cls = "neutral", txt;
  if(!m || !m.total){
    txt = "No surveys yet this month";
  } else {
    const g = BFX.mixGoal({ goalPct: BFX.STD.NPS_GOAL, num: (m.prom || 0) - (m.det || 0), base: m.total });
    if(g.status === "hit"){
      cls = "hit";
      txt = "At goal — every survey counts · " + m.total + " survey" + (m.total === 1 ? "" : "s") + " MTD";
    } else {
      cls = "behind";
      txt = m.total + " survey" + (m.total === 1 ? "" : "s") + " MTD · NPS " + Math.round(g.cur) +
            " · needs <b>" + g.needed + "</b> more 9–10s to hit " + g.goalPct;
    }
  }
  return '<div class="goal-pill ' + cls + '">' + txt + '</div>';
}

/* BFX v1.1: summary-strip card — same surveys-to-goal math over whatever
   store/DM filter is active, straight from the fiscal-MTD survey export. */
function bfxToGoalSummaryCard(storeF, dmF){
  const surv = (DATA_MTD && Array.isArray(DATA_MTD.surveys)) ? DATA_MTD.surveys : null;
  if(!surv) return "";
  let list = surv;
  if(storeF) list = list.filter(s => npsSurveyStore(s) === storeF);
  if(dmF) list = list.filter(s => npsDistrictFor(npsSurveyStore(s) || "").id === dmF);
  if(!list.length) return sumCard("9–10s TO 80", "\u2014", "", "no surveys yet this month");
  let g = 0, b = 0;
  list.forEach(s => { const k = npsBucket(s.score); if(k === "good") g++; else if(k === "bad") b++; });
  const mix = BFX.mixGoal({ goalPct: BFX.STD.NPS_GOAL, num: g - b, base: list.length });
  if(mix.status === "hit") return sumCard("9–10s TO 80", "\u2713", "k-goal", "at goal \u2014 every survey counts (" + list.length + " MTD)");
  return sumCard("9–10s TO 80", String(mix.needed), "k-goal", "more promoters needed \u00b7 " + list.length + " surveys MTD");
}

/* ===================== ACCORDION INTERACTION (all three levels) ===================== */
function npsToggle(btn){
  const open = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!open));
  const panel = btn.nextElementSibling;          // the sibling .collapse
  // animating grid-template-rows relayouts the whole subtree every frame;
  // past ~40 rows that is visible jank on an iPad, so big panels just snap.
  if(panel && !panel.dataset.big && panel.querySelectorAll(".survey").length > 40)
    panel.dataset.big = "1";
  if(panel) panel.classList.toggle("open", !open);
  // A bucket head must not write its state onto the rep that contains it.
  const card = btn.classList.contains("bucket-head")
    ? null : btn.closest(".district, .store, .rep");
  if(card) card.classList.toggle("open", !open);
}
function expandAll(){
  // districts first, then the stores inside them
  document.querySelectorAll('#results .district > .district-head').forEach(b => {
    if(b.getAttribute("aria-expanded") !== "true") npsToggle(b);
  });
  document.querySelectorAll('#results .store > .store-head').forEach(b => {
    if(b.getAttribute("aria-expanded") !== "true") npsToggle(b);
  });
  document.querySelectorAll('#results .rep > .rep-head').forEach(b => {
    if(b.getAttribute("aria-expanded") !== "true") npsToggle(b);
  });
}
function collapseAll(){
  document.querySelectorAll('#results [aria-expanded="true"]').forEach(b => npsToggle(b));
}

async function resendEmails(){
  const btn = document.getElementById("resendBtn");
  if(!npsHookReady()){ banner("Zapier webhook URL not configured in this file.", "error"); return; }
  const list = (function(){
    const ids = new Set(DATA.lastBatchIds || []);
    return (DATA.surveys || []).filter(s => ids.has(s.id) && npsSurveyStore(s));
  })();
  if(!list.length){ banner("Nothing in the last batch to send.", "error"); return; }
  if(!confirm("Re-send digest emails for " + list.length + " surveys? SMs and DMs will receive duplicates of today's email.")) return;
  btn.disabled = true;
  banner("Building & sending emails…", "info");
  try {
    let salesStores = [];
    try { salesStores = await npsFetchSalesStores(); } catch(e){ console.warn(e); }
    const res = await npsSendEmails(list, salesStores, DIR);
    banner("✅ Sent " + res.sent + " of " + res.storeCount + " store digests." +
      (res.errors.length ? "<br>⚠ " + res.errors.join("; ") : ""), res.errors.length ? "error" : "success");
  } catch(e){
    banner("❌ " + e.message, "error");
  } finally { btn.disabled = false; }
}

async function init(){
  try {
    const [dataR, dirR, mtdR] = await Promise.all([
      fetch(NPS_CONFIG.RESPONSES_URL + "?t=" + Date.now(), { cache: "no-store" }),
      fetch(NPS_CONFIG.DIRECTORY_URL + "?t=" + Date.now(), { cache: "no-store" }),
      fetch(NPS_CONFIG.MTD_URL + "?t=" + Date.now(), { cache: "no-store" }).catch(() => null)
    ]);
    if(!dirR.ok) throw new Error("store-directory.json HTTP " + dirR.status);
    DIR = await dirR.json();
    if(!dataR.ok){
      document.getElementById("results").innerHTML = '<div class="empty">No NPS data yet — upload your first tNPS Responses export on the <a href="https://blufoxmobile.github.io/Daily-Sales-Report/upload.html">Daily Upload page</a>.</div>';
      document.getElementById("updatedAt").textContent = "Waiting for first upload";
      return;
    }
    DATA = await dataR.json();
    try { if(mtdR && mtdR.ok) DATA_MTD = await mtdR.json(); } catch(e){ DATA_MTD = null; }
    // Official per-store Fiscal NPS — the exact number managers are paid on,
    // read from the same Sales Report.xlsx the Daily Sales Report displays.
    try {
      const salesStores = await npsFetchSalesStores();
      (salesStores || []).forEach(s => {
        if(s && s.name && typeof s.nps === "number")
          NPS_FISCAL[String(s.name).trim().toLowerCase()] = Math.round(s.nps * 100);
      });
    } catch(e){ console.warn("Fiscal NPS unavailable:", e); }

    /* BFX SMART TARGETS: feed the goal engine for the dashboard cards —
       target-summary.json for GP targets, and the already-loaded MTD payload
       for the NPS buckets (traffic + Store Rank rows came in with the
       npsFetchSalesStores call above). */
    try { await npsFetchTargets(); } catch(e){ console.warn("targets unavailable:", e); }
    if(DATA_MTD && Array.isArray(DATA_MTD.surveys)) bfxIngestNpsMtd(DATA_MTD.surveys);

    // filters
    const mtdSurv = (DATA_MTD && DATA_MTD.surveys) || [];
    const stores = Array.from(new Set([...(DATA.surveys || []), ...mtdSurv].map(s => npsSurveyStore(s)).filter(Boolean))).sort();
    document.getElementById("storeFilter").innerHTML = '<option value="">All Stores</option>' +
      stores.map(s => '<option>' + npsEsc(s) + '</option>').join("");
    // Tripwire: if the official Fiscal NPS map loaded but a store has no match
    // (e.g. a future name change on one side), flag it so the badge silently
    // falling back to survey tNPS doesn't go unnoticed.
    if(Object.keys(NPS_FISCAL).length){
      const missing = stores.filter(s => !(String(s).trim().toLowerCase() in NPS_FISCAL));
      if(missing.length) console.warn("No official Fiscal NPS for: " + missing.join(", ") + " — badge will use survey tNPS.");
    }
    // District picker, keyed by district ID — a district can hold more than one
    // DM, so filtering on the DM email would silently drop the other DMs' stores.
    const seenD = {}, dOpts = [];
    Object.keys(DIR.storeDMs || {}).concat(Object.keys(DIR.storeDistricts || {}))
      .forEach(fk => {
        const info = npsDistrictFor(fk.replace(/ Xfinity Store$/, ""));
        if(info.id === "__none" || seenD[info.id]) return;
        seenD[info.id] = 1;
        dOpts.push(info);
      });
    dOpts.sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById("dmFilter").innerHTML = '<option value="">All Districts</option>' +
      dOpts.map(o => '<option value="' + npsEsc(o.id) + '">' + npsEsc(o.name) +
        (o.dmName ? " \u2014 " + npsEsc(o.dmName) : "") + '</option>').join("");

    const upd = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
    document.getElementById("updatedAt").textContent =
      (upd ? upd.toLocaleString() : "unknown") +
      " · " + (DATA.lastBatchIds || []).length + " new surveys" +
      (DATA.lastBatchDate ? " (" + DATA.lastBatchDate + ")" : "");
    document.getElementById("src").textContent = "Source: nps-responses.json (Yesterday) • nps-mtd.json (Fiscal Month-to-Date) • store-directory.json • Daily-Sales-Report repo";
    if((DATA.unmatched || []).length){
      banner("⚠ Unmatched store IDs in last upload: " + DATA.unmatched.map(npsEsc).join("; ") +
        " — add them to NPS_STORE_NUM / NPS_STORE_ALIASES.", "error");
    }
    npsStampDateline();
    render();
  } catch(e){
    document.getElementById("results").innerHTML = '<div class="empty">❌ ' + npsEsc(e.message) + '</div>';
  }
}
init();
</script>
